<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ボキバトル</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="ボキバト">
<meta name="theme-color" content="#0e1424">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="manifest" href="manifest.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=DotGothic16&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1424;--panel:#172036;--panel2:#1f2a44;--line:#2c3a5c;--ink:#eef3ff;--mute:#8d9bbd;
--neon:#39ff9a;--gold:#ffd23f;--red:#ff5d6c;--blue:#4da3ff;--pink:#ff6ec7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"M PLUS Rounded 1c",system-ui,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font-family:inherit;cursor:pointer}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.wrap{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
/* title */
.title{padding:28px 20px 30px}
.logo{text-align:center;margin:10px 0 6px}
.logo h1{margin:0;font-size:40px;font-weight:800;letter-spacing:.04em;background:linear-gradient(90deg,var(--neon),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo p{margin:4px 0 0;color:var(--mute);font-weight:700;font-size:13px;letter-spacing:.2em}
.mode{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--panel);border-radius:18px;padding:16px 18px;margin-top:14px;color:var(--ink);position:relative;overflow:hidden}
.mode:active{transform:scale(.985)}
.mode b{display:block;font-size:20px}
.mode span{font-size:13px;color:var(--mute);line-height:1.6;display:block;margin-top:2px}
.mode .best{position:absolute;right:16px;top:16px;font-size:13px;color:var(--gold)}
.mode.ta{border-color:#2f6b55}.mode.ta b{color:var(--neon)}
.mode.sa{border-color:#6b2f5f}.mode.sa b{color:var(--pink)}
.code{margin-top:22px;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:14px 16px}
.code label{font-size:13px;color:var(--mute);font-weight:700}
.code .row{display:flex;gap:10px;margin-top:8px;align-items:center}
.code input{flex:1;min-width:0;background:var(--bg);border:2px solid var(--line);border-radius:12px;color:var(--ink);font:800 22px "JetBrains Mono",monospace;padding:8px 12px;letter-spacing:.2em}
.code small{display:block;color:var(--mute);font-size:12px;margin-top:8px;line-height:1.6}
.sbtn{border:2px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:12px;padding:10px 12px;font-weight:800;font-size:13px}
.recs{margin-top:22px}
.recs h3{font-size:14px;color:var(--mute);margin:0 0 8px}
.rec{display:flex;justify-content:space-between;padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px}
.rec .r{font-weight:800}
.empty{color:var(--mute);font-size:13px;padding:8px 0}
.rules{margin-top:22px;color:var(--mute);font-size:12px;line-height:1.8}
/* countdown */
.cd{flex:1;display:flex;align-items:center;justify-content:center;font:800 120px "JetBrains Mono",monospace;color:var(--neon)}
.cd span{animation:cdp .9s ease-out}
@keyframes cdp{0%{transform:scale(2);opacity:0}30%{opacity:1}100%{transform:scale(.9);opacity:.6}}
/* game */
.game{display:flex;flex-direction:column;height:100vh;height:100dvh}
.game,.game *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.game textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
.game button,.game canvas{touch-action:manipulation}
.game #cv{touch-action:none}
.hud{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#0a0f1c;border-bottom:2px solid var(--line)}
.hud .t{font:800 30px "JetBrains Mono",monospace;color:var(--neon);letter-spacing:.02em}
.hud .t.warn{color:var(--red)}
.hud .p{font-weight:800;color:var(--mute);font-size:14px;text-align:right;line-height:1.3}
.hud .p b{color:var(--ink);font-size:18px}
.hud .x{background:none;border:none;color:var(--mute);font-size:22px;padding:0 6px}
.pen{color:var(--red);font-size:12px}
.prob{flex:1;overflow-y:auto;padding:12px 14px 8px;-webkit-overflow-scrolling:touch}
.cat{display:inline-block;font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--panel2);color:var(--blue);margin-bottom:6px}
.ptitle{font-size:16px;font-weight:800;margin:2px 0 10px;line-height:1.5;white-space:pre-line}
.data{width:100%;border-collapse:collapse;background:var(--panel);border-radius:12px;overflow:hidden;font-size:14px;margin-bottom:12px}
.data td{padding:7px 10px;border-bottom:1px solid var(--line)}
.data td:last-child{text-align:right;font-family:"JetBrains Mono",monospace;font-weight:600}
.data tr:last-child td{border-bottom:none}
.sheet{background:#fdfcf6;color:#1e2433;border-radius:12px;padding:6px 12px}
.ln{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px dashed #d9d4bd;font-weight:700;font-size:14px;flex-wrap:wrap}
.ln:last-child{border-bottom:none}
.ln .lab{flex:1 1 auto}
.blank{min-width:120px;min-height:38px;border:2px solid #b9c3d8;background:#fff;border-radius:8px;font:800 17px "JetBrains Mono",monospace;color:#1e2433;text-align:right;padding:4px 10px;display:inline-flex;flex-direction:column;align-items:flex-end;justify-content:center}
.blank.ch{min-width:72px;text-align:center;align-items:center;font-family:"M PLUS Rounded 1c",sans-serif}
.blank.on{border-color:var(--blue);box-shadow:0 0 0 3px rgba(77,163,255,.35)}
.blank .pv{font-size:11px;color:#6b7590;font-weight:600}
.blank.ok{border-color:#1fbf6c;background:#e6fff1}
.blank.ng{border-color:var(--red);background:#ffecee}
.blank .ca{font-size:12px;color:#1fbf6c;font-weight:800}
.unit{font-size:12px;color:#6b7590;margin-left:2px}
.note{font-size:11.5px;color:var(--mute);margin:8px 2px 0;line-height:1.6}
/* keypad */
.pad{background:#0a0f1c;border-top:2px solid var(--line);padding:8px 8px 10px}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.k{border:none;border-radius:10px;background:var(--panel2);color:var(--ink);font:800 20px "JetBrains Mono",monospace;padding:11px 0}
.k:active{background:var(--line)}
.k.op{color:var(--blue);background:#18233c}
.k.fn{font-size:14px;font-family:"M PLUS Rounded 1c",sans-serif;color:var(--mute)}
.acts{display:flex;gap:6px;margin-top:6px}
.acts .k{flex:1;font-size:15px;font-family:"M PLUS Rounded 1c",sans-serif}
.k.go{background:var(--neon);color:#062413}
.k.nx{background:#24365d;color:var(--ink)}
.chs{display:flex;gap:8px;margin-bottom:6px}
.chs .k{flex:1;font-family:"M PLUS Rounded 1c",sans-serif;font-size:17px;background:#2a3554}
/* feedback */
.fb{position:fixed;inset:auto 0 0 0;max-width:560px;margin:0 auto;background:var(--panel);border-top:3px solid var(--neon);border-radius:20px 20px 0 0;padding:16px 18px 22px;z-index:20;animation:up .25s ease-out;max-height:70vh;overflow-y:auto}
.fb.bad{border-color:var(--red)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.fb h3{margin:0 0 6px;font-size:20px}
.fb.good h3{color:var(--neon)}.fb.bad h3{color:var(--red)}
.fb .meta{font-size:13px;color:var(--mute);margin-bottom:8px}
.fb pre{white-space:pre-wrap;font:600 13px/1.7 "M PLUS Rounded 1c",sans-serif;color:var(--ink);background:var(--bg);border-radius:10px;padding:10px 12px;margin:0 0 12px}
.big{display:block;width:100%;border:none;border-radius:14px;padding:15px;font-size:17px;font-weight:800;background:var(--neon);color:#062413}
.big.sec{background:var(--panel2);color:var(--ink);border:2px solid var(--line)}
.pop{position:fixed;left:50%;top:84px;transform:translateX(-50%);font:800 22px "JetBrains Mono",monospace;pointer-events:none;z-index:30;animation:pp 1s ease-out forwards}
@keyframes pp{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-30px)}}
/* result */
.res{padding:30px 20px;text-align:center}
.rank{font:800 110px "JetBrains Mono",monospace;line-height:1;margin:6px 0;animation:rk .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes rk{from{transform:scale(.2) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
.rank.S{color:var(--gold);text-shadow:0 0 30px rgba(255,210,63,.5)}.rank.A{color:var(--neon)}.rank.B{color:var(--blue)}.rank.C{color:var(--mute)}
.final{font:800 44px "JetBrains Mono",monospace;margin:4px 0}
.nb{display:inline-block;background:var(--gold);color:#2b2100;font-weight:800;font-size:13px;padding:4px 12px;border-radius:99px;margin-bottom:8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.st{background:var(--panel);border-radius:14px;padding:12px}
.st span{display:block;font-size:12px;color:var(--mute);font-weight:700}
.st b{font:800 20px "JetBrains Mono",monospace}
.share{width:100%;height:110px;background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:10px;font:600 13px/1.6 "M PLUS Rounded 1c",sans-serif;resize:none;margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;font-weight:800;opacity:0;transition:opacity .3s;pointer-events:none;z-index:40}
.toast.on{opacity:1}

/* ===== layout: 問題 | 右:メモ+電卓 ===== */
.gbody{flex:1;display:flex;min-height:0}
.gleft{flex:1;min-width:0;display:flex;flex-direction:column}
.gleft .prob{flex:1}
.gright{width:44%;max-width:300px;display:flex;flex-direction:column;background:#0a0f1c;border-left:2px solid var(--line);min-height:0}
.abar{display:flex;gap:6px;padding:8px;background:#0a0f1c;border-top:2px solid var(--line)}
.ab{flex:1;border:none;border-radius:10px;padding:12px 4px;font-weight:800;font-size:14px}
.ab.nx{background:#24365d;color:var(--ink)}.ab.go{background:var(--neon);color:#062413}
.memo2{flex:1;display:flex;flex-direction:column;min-height:90px;padding:6px 6px 0}
.mhead{display:flex;gap:4px;margin-bottom:4px}
.mhead button{flex:1;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:8px;padding:4px 0;font-size:12px;font-weight:800}
.mhead button.on{background:var(--blue);border-color:var(--blue)}
#cv,#mt{flex:1;width:100%;min-height:0;border-radius:8px;background:#fdfcf6;touch-action:none;
  background-image:linear-gradient(#ece6cc 1px,transparent 1px);background-size:100% 22px}
#mt{display:none;border:none;padding:6px;font:600 13px/22px "M PLUS Rounded 1c",sans-serif;color:#1e2433;resize:none}
.calc{padding:6px;background:linear-gradient(#2b2f38,#1d2027);border-top:2px solid var(--line)}
.cdisp{background:#c9d3b8;border-radius:6px;padding:3px 8px 4px;margin-bottom:6px;box-shadow:inset 0 2px 4px rgba(0,0,0,.35)}
.cind{display:flex;gap:8px;height:12px;font:800 10px "JetBrains Mono",monospace;color:#2b3324}
.cnum{text-align:right;font-size:22px;color:#1d2418;line-height:1.15;overflow:hidden;white-space:nowrap}
.ckeys2{display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:minmax(34px,1fr);gap:4px}
.ck{border:none;border-radius:6px;background:#eceef2;color:#1d2027;font:800 16px "JetBrains Mono",monospace;padding:0;box-shadow:0 2px 0 #9aa0ab;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.ck.dn{transform:translateY(2px);box-shadow:none;filter:brightness(.9)}
.ck.op{background:#5b6170;color:#fff;box-shadow:0 2px 0 #34383f}
.ck.eq{background:#5b6170;color:#fff;box-shadow:0 2px 0 #34383f}
.ck.fn{background:#454a55;color:#e6e9ef;font-size:13px;box-shadow:0 2px 0 #2a2d33}
.ck.mem{background:#454a55;color:#cfd5df;font-size:11px;box-shadow:0 2px 0 #2a2d33}
.ck.clr{background:#e8584f;color:#fff;font-size:13px;box-shadow:0 2px 0 #9b2f29}
.ck.in{background:var(--neon);color:#062413;font:800 13px "M PLUS Rounded 1c",sans-serif;box-shadow:0 2px 0 #1c8a52}
.blank.flash{animation:fl .4s}
@keyframes fl{0%{background:#c9ffe0}100%{background:#fff}}
.chrow{flex-basis:100%;display:flex;gap:6px;justify-content:flex-end}
.cho{border:2px solid #b9c3d8;background:#fff;border-radius:8px;padding:5px 14px;font-weight:800;font-size:14px;color:#1e2433}
.cho.sel{border-color:var(--blue);background:#e8f2ff}
.ln{gap:6px}
.blank{min-width:96px}
@media (max-width:560px){
  .ptitle{font-size:14px}.data{font-size:12px}.data td{padding:5px 7px}
  .ln{font-size:12.5px}.blank{min-width:84px;font-size:15px;min-height:34px;padding:3px 7px}
  .gright{width:47%}
  .ck{font-size:15px}
}
@media (min-width:900px){ .wrap:has(.game){max-width:1100px} .gright{max-width:380px;width:36%} .ckeys2{grid-auto-rows:minmax(46px,1fr)} .ck{font-size:20px} .cnum{font-size:30px} }

.sw{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:8px;font-size:16px;font-weight:800;padding:3px 8px}
.hand{margin-top:22px;display:flex;align-items:center;justify-content:space-between;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:12px 16px;font-weight:800;font-size:14px;color:var(--mute)}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px}
.seg button{border:none;background:none;color:var(--mute);font-weight:800;font-size:14px;padding:7px 16px;border-radius:9px}
.seg button.on{background:var(--neon);color:#062413}
/* 左手モード:電卓とメモを左へ */
.gbody.lefty{flex-direction:row-reverse}
.gbody.lefty .gright{border-left:none;border-right:2px solid var(--line)}
/* 広い画面の左手モード:電卓(左)|問題(中)|メモ(右)→右手で書ける */
@media (min-width:900px){
  .gbody.lefty{flex-direction:row}
  .gbody.lefty .gright{display:contents}
  .gbody.lefty .calc{order:0;width:330px;border-top:none;border-right:2px solid var(--line);display:flex;flex-direction:column;justify-content:flex-end}
  .gbody.lefty .gleft{order:1}
  .gbody.lefty .memo2{order:2;width:300px;flex:none;background:#0a0f1c;border-left:2px solid var(--line);padding:8px}
}

.mode.vs{border-color:#6b5a2f}.mode.vs b{color:var(--gold)}
.back{background:none;border:none;color:var(--mute);font-weight:800;font-size:15px;padding:4px 0}
.howto{background:var(--panel);border-radius:16px;padding:12px 14px;font-size:13px;line-height:1.7;margin-top:12px}
.howto b{color:var(--gold)}
.itemlist{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.il{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border-radius:14px;padding:10px 12px;font-size:14px}
.il .ii{font-size:26px;line-height:1}
.il em{font-style:normal;font-size:11px;background:#1f4d3a;color:var(--neon);padding:2px 7px;border-radius:99px;margin-left:6px}
.il em.atk{background:#4d1f2a;color:var(--red)}
.il small{color:var(--mute);font-size:12px}
.h3{margin:22px 0 8px;font-size:15px}
.cpus{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cpu{border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:14px;padding:12px 4px}
.cpu b{display:block;font-size:15px}.cpu small{color:var(--mute);font-size:12px}
.lobby{text-align:center;margin-top:20px}
.lc{color:var(--mute);font-weight:800}.lc b{color:var(--ink);font-size:28px;letter-spacing:.15em;margin-left:6px}
.ls{color:var(--mute);font-size:13px;margin-top:16px;line-height:1.7}
.pl{display:flex;align-items:center;gap:10px;margin:20px 0}
.pc{flex:1;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:14px 6px;display:flex;flex-direction:column;gap:2px;min-height:110px;justify-content:center}
.pc.rd{border-color:var(--neon)}
.pc b{font-size:18px}.pc small{color:var(--mute);font-size:11px}.pc span{font-size:12px;font-weight:800;color:var(--gold)}
.vsx{font:800 22px "JetBrains Mono",monospace;color:var(--red)}
.big:disabled{opacity:.4}
/* battle HUD */
.vsh{gap:8px}
.hpwrap{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.hpl{display:flex;align-items:center;gap:6px}
.hpn{width:64px;font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mute)}
.hpbar{flex:1;height:12px;background:#2a1520;border-radius:99px;overflow:hidden}
.hpbar i{display:block;height:100%;border-radius:99px;transition:width .4s}
.hpbar.me i{background:linear-gradient(90deg,#28c76f,var(--neon))}
.hpbar.op i{background:linear-gradient(90deg,#ff9f43,var(--gold))}
.hpbar i.low{background:var(--red)!important}
.hpv{width:38px;text-align:right;font-size:12px}
.stk{font-size:11px;color:var(--gold);white-space:nowrap}.stk b{color:var(--ink)}
.itembar{display:flex;gap:6px;padding:6px 10px;background:#0a0f1c;border-bottom:2px solid var(--line);align-items:center}
.slot{width:64px;height:46px;border-radius:10px;border:2px solid var(--gold);background:#2a2412;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;}
.slot.new{animation:sl .3s}
.slot span{font-size:18px;line-height:1}.slot small{font-size:9px;font-weight:800;white-space:nowrap}
.slot.empty{border:2px dashed var(--line);background:none;color:var(--line);animation:none}
@keyframes sl{from{transform:scale(.5)}to{transform:none}}
.fxs{flex:1;text-align:right;font-size:11px;font-weight:800;color:var(--blue);line-height:1.4}
.cat.messy{background:#4d1f2a;color:var(--red);margin-left:6px}
.guide{display:none;background:#10223d;border:1px solid var(--blue);border-radius:8px;padding:5px 7px;margin-bottom:6px}
.gh{font-size:11px;font-weight:800;color:var(--blue);display:flex;justify-content:space-between}
.gt{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px;font:700 12px "JetBrains Mono",monospace}
.gt span{padding:1px 5px;border-radius:5px;background:#1d2b46;color:#9fb3d6}
.gt span.dn{opacity:.35}
.gt span.cu{background:var(--blue);color:#fff}
.goff{font-size:11px;color:var(--red);font-weight:800;margin-top:3px}
.ck.hint{outline:3px solid var(--blue);outline-offset:-1px;box-shadow:0 0 14px var(--blue)!important;animation:hb .7s infinite alternate}
@keyframes hb{to{filter:brightness(1.25)}}
.ck.shuf{background:#ffe7a8;color:#5a3b00}
.shufb{display:none;text-align:center;font-size:11px;font-weight:800;color:var(--gold);margin-top:4px}
.banner{position:fixed;left:50%;top:120px;transform:translateX(-50%);z-index:50;padding:12px 18px;border-radius:14px;font-weight:800;font-size:15px;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:bn .3s cubic-bezier(.2,1.5,.4,1);transition:opacity .4s}
.banner.hit{background:var(--red);color:#fff}.banner.atk{background:var(--gold);color:#2b2100}
.banner.self{background:var(--blue);color:#fff}.banner.info{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.banner.out{opacity:0}.banner.slim{padding:4px 12px;font-size:12.5px;border-radius:999px;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
@keyframes bn{from{transform:translate(-50%,-20px) scale(.8);opacity:0}to{transform:translateX(-50%);opacity:1}}
.wl{font:800 84px "JetBrains Mono",monospace;line-height:1;margin:20px 0 8px;animation:rk .6s cubic-bezier(.2,1.6,.4,1)}
.wl.w{color:var(--gold);text-shadow:0 0 30px rgba(255,210,63,.5)}.wl.l{color:var(--mute)}
@media (max-width:560px){.hpn{width:44px}.slot{width:58px}}

.pp,.shot{position:fixed;border-radius:50%;pointer-events:none;z-index:60;box-shadow:inset -3px -3px 0 rgba(0,0,0,.18),inset 3px 3px 0 rgba(255,255,255,.45)}

.ring{position:fixed;width:40px;height:40px;border:4px solid;border-radius:50%;pointer-events:none;z-index:61}

.fz{position:fixed;z-index:62;pointer-events:none;color:var(--red);font-size:34px;font-weight:800}
.hpbar.hit{animation:hbh .35s}

@keyframes fl2{20%{box-shadow:inset 0 0 90px rgba(255,110,199,.6)}50%{box-shadow:inset 0 0 50px rgba(77,163,255,.5)}}
.redflash{position:fixed;inset:0;background:rgba(255,60,80,.28);pointer-events:none;z-index:59;animation:rf .45s forwards}

.toast{bottom:auto;top:132px}

.cat.quick{background:#3b3412;color:var(--gold);margin-right:6px}
.phs{color:var(--mute);font-size:10px}
.hpbar.heal{animation:hbl .45s}
@keyframes hbl{0%{filter:brightness(2.2)}100%{filter:none}}

.hpbar.boost{box-shadow:0 0 0 2px #ff7a2f,0 0 12px #ff7a2f;animation:bst .4s infinite alternate}

.chtxt.opp{font-size:16px;font-style:normal}

@keyframes tpa{0%,100%{color:inherit}30%{color:#c0392b;transform:translateX(-3px)}60%{transform:translateX(3px)}}

/* ===== 計算テープ ===== */
.tape{background:#fbf8ec;color:#26323a;border-top:2px solid var(--line);display:flex;flex-direction:column;min-height:0}
.thead{display:flex;align-items:center;gap:6px;padding:3px 8px;font-size:11px;font-weight:800;color:#8a7d55;background:#f1ead2}
.thead span{flex:1}
.thead button{border:1px solid #d8cfb0;background:#fff;border-radius:6px;font-size:11px;font-weight:800;padding:2px 7px;color:#5b5236}
.thead .dtog{display:none}
.tbody{overflow-y:auto;max-height:76px;padding:2px 8px 4px;font:600 12px/1.55 "JetBrains Mono",monospace;text-align:right}
.tl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px dotted #e5dcbd}
.tl.in{color:#1f8a52;font-family:"M PLUS Rounded 1c",sans-serif}
.tl.sep{color:#b9ad86;text-align:center;font-size:10px;border:none}
.tl.cur{color:#8a7d55}
.cind .tgt{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-family:"M PLUS Rounded 1c",sans-serif;font-size:10px}
.gright{min-height:0}
.gright .memo2{min-height:0}
/* ===== スマホモード(縦長・幅狭) ===== */
@media (max-width:600px) and (orientation:portrait){
  .gbody,.gbody.lefty{flex-direction:column}
  .gbody .gleft{flex:1 1 auto;min-height:0}
  .gbody .gright,.gbody.lefty .gright{width:100%;max-width:none;flex:0 0 auto;border-left:none;border-right:none;border-top:2px solid var(--line);display:flex}
  .gright .memo2{display:none}
  .gright.drawmode .memo2{display:flex;height:300px;flex:none;padding:6px}
  .gright.drawmode .calc .cdisp,.gright.drawmode .calc .ckeys2,.gright.drawmode .calc .guide{display:none!important}
  .thead .dtog{display:inline-block}
  .tbody{max-height:40px;font-size:11.5px;line-height:1.5}
  .calc{padding:5px 6px 6px}
  .cdisp{margin-bottom:5px;padding:2px 8px}
  .cnum{font-size:22px}
  .ckeys2{grid-auto-rows:44px;gap:5px}
  .ck{font-size:19px}.ck.mem,.ck.fn,.ck.clr{font-size:13px}
  .sw{display:none}
  .hud{padding:6px 10px}
  .hud .t{font-size:22px}
  .prob{padding:8px 10px 6px}
  .cat{font-size:11px;padding:2px 8px;margin-bottom:4px}
  .ptitle{font-size:13.5px;margin:0 0 6px}
  .data{display:block;background:none;margin-bottom:8px}
  .data tbody{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  .data tr{display:flex;flex-direction:column;background:var(--panel);border-radius:8px;padding:4px 7px}
  .data td{padding:0;border:none;font-size:10.5px;color:var(--mute);line-height:1.3}
  .data td:last-child{font-size:14px;color:var(--ink);text-align:right}
  .sheet{padding:2px 10px}
  .ln{padding:5px 0;font-size:12px;flex-wrap:nowrap}
  .ln .lab{flex:1 1 auto;min-width:0}
  .blank{min-width:110px;min-height:32px;font-size:15px;padding:2px 8px}
  .note{font-size:10.5px;margin-top:4px}
  .abar{padding:5px 8px;gap:5px}
  .ab{padding:9px 4px;font-size:13px}
  .ab.sk{flex:0 0 50px}
  .itembar{padding:4px 10px;gap:5px}
  .slot{width:auto;height:30px;flex-direction:row;gap:3px;padding:0 8px;border-width:1.5px}
  .slot span{font-size:15px}.slot small{font-size:10px}
  .slot.empty{width:46px}
  .fxs{font-size:10px}
  .chrow{justify-content:flex-start}
}

@media (max-width:600px) and (orientation:portrait){
  .thead{padding:0 6px 0 8px}
  .thead span{display:none}
  .tape{flex-direction:row-reverse;align-items:center}
  .thead{background:none;flex:0 0 auto;gap:4px}
  .tbody{flex:1;max-height:22px;padding:1px 4px 1px 8px;font-size:11px;line-height:20px}
  .tbody .tl{border:none}
  .ckeys2{grid-auto-rows:40px;gap:4px}
  .cdisp{padding:1px 8px}
  .cnum{font-size:20px}
  .cind{height:11px}
  .abar .itembar.inbar{background:none;border:none;padding:0;flex:0 0 auto;gap:4px}
  .abar .itembar.inbar .slot{padding:0 6px;height:38px}
  .abar .itembar.inbar .slot small{display:none}
  .abar .itembar.inbar .slot span{font-size:18px}

.hand.snd{flex-wrap:wrap;gap:8px}
.hand.snd input[type=range]{flex-basis:100%;accent-color:var(--neon)}
.sw.mute{font-size:13px;padding:3px 6px}
@media (max-width:600px) and (orientation:portrait){.sw.mute{display:inline-block}}

/* テープは電卓の一部(液晶の上) */
.calc .tape{border-top:none;border-radius:8px;overflow:hidden;margin-bottom:6px}
@media (min-width:601px),(orientation:landscape){.calc .tape .tbody{max-height:58px}}
@media (max-width:600px) and (orientation:portrait){.calc .tape{margin:-5px -6px 5px;border-radius:0}}
.appicon{width:96px;height:96px;border-radius:22px;display:block;margin:0 auto 8px;box-shadow:0 8px 24px rgba(0,0,0,.45);animation:rk .6s cubic-bezier(.2,1.6,.4,1)}

/* ===== 電卓の種類 ===== */
.calcsel{margin-top:22px;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:12px 14px}
.cst{font-weight:800;font-size:14px;color:var(--mute);margin-bottom:8px}
.csl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.csl button{border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:8px 10px;text-align:left}
.csl button b{display:block;font-size:14px}.csl button small{color:var(--mute);font-size:11px}
.csl button.on{border-color:var(--neon);background:#12301f}
.ck.nop{opacity:.75}
/* カシオ実務型 */
.calc.th-az{background:linear-gradient(#aebbc5,#8d9ca8)}
.th-az .cdisp{background:#b9c3a6}
.th-az .ck{background:#2d3035;color:#f2f2f2;box-shadow:0 2px 0 #121417}

/* カシオ卓上型 */
.calc.th-df{background:linear-gradient(#e4e6e8,#c9cdd1)}

.th-sh .cdisp{background:#b8c4ad}

.th-tel .ck{border-radius:50px;background:#2b3558;color:#fff;box-shadow:0 2px 0 #151b30}

.th-tel .ck.clr{background:#ff5d6c;color:#fff}
.th-tel .ck.in{background:var(--neon);color:#062413}

/* ===== 横画面(広い画面)では電卓を大きく ===== */
@media (min-width:900px){
  .calc{display:flex;flex-direction:column;min-height:0}
  .calc .ckeys2{flex:1 1 auto;min-height:0;gap:6px}
  .calc .cdisp{flex:0 0 auto}
  .calc .tape{flex:0 0 auto}
  .ck{font-size:clamp(17px,1.9vw,26px)}
  .ck.mem,.ck.fn,.ck.clr,.ck.tax,.ck.time,.ck.in{font-size:clamp(13px,1.4vw,19px)}
  .cnum{font-size:clamp(28px,3vw,40px)}
  /* 右手:右の列は電卓が主役、メモは上に小さく */
  .gright{width:40%;max-width:520px}
  .gright .memo2{flex:0 0 26%;min-height:110px}
  .gright .calc{flex:1 1 auto}
  /* 左手:電卓の列を太くして上まで使う */
  .gbody.lefty .calc{width:clamp(340px,34vw,470px);flex:0 0 auto;justify-content:stretch}
  .gbody.lefty .memo2{width:clamp(190px,18vw,280px);flex:0 0 auto}
}

<script>
/* ================================================================
   ボキバトル 1級  —  タイムアタック / スコアアタック / 対戦(CPU・オンライン)
   ================================================================ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
const yen=n=>Number(n).toLocaleString("ja-JP");
const sgn=n=>(n>0?"+":n<0?"−":"±")+yen(Math.abs(n));
const OFF=(n)=>{const a=[];for(let i=-n;i<=n;i++)if(i)a.push(i);return a};

/* ---------- 問題を作るための乱数コンテキスト ----------
   構造(比率・方向など)は sr、数字の「細かさ」だけ mr で変える。
   → 端数地獄で同じ問題のまま数字だけ細かくできる */
function ctx(seed,messySeed,mu){
  const sr=mulberry32(seed),mr=messySeed?mulberry32(messySeed):null;
  const c={
    messy:!!mr,
    ri:(a,b)=>a+Math.floor(sr()*(b-a+1)),
    pick:a=>a[Math.floor(sr()*a.length)],
    rnd:()=>sr(),
    M:(a,b,k)=>{const base=a+Math.floor(sr()*(b-a+1));if(!mr)return base*k;
      let v=base*k+Math.round((mr()-.5)*Math.abs(k)*.9);v=Math.round(v/mu)*mu;return v===0?mu:v},
    R:(x,u)=>mr?Math.round(x):Math.round(x/u)*u,
    ok:true
  };
  return c;
}
const K=(...a)=>a;

/* ---------- 問題ジェネレーター ----------
   blank: {t:"num",ans,g:[電卓ガイド]} / {t:"ch",opts,ans} */
const GENS=[
function consA(c){
  const r=c.pick([60,70,75,80,90]),C=c.M(5,15,1000),E=c.M(1,6,1000),T=C+E,g=c.M(1,10,100),PI=T*r/100,P=PI+g,nci=T*(100-r)/100;
  return{cat:"連結会計",title:`P社はS社の発行済株式の${r}%を${yen(P)}で取得し、支配を獲得した。\n支配獲得日の連結修正について答えなさい。`,
  data:[["S社 資本金",C],["S社 利益剰余金",E],["取得原価(S社株式)",P],["P社の持分比率",r+"%"]],
  lines:[["のれん",0],["非支配株主持分",1]],

    if(!p)return null;

function makeSbRoom(){
  /* presence = 部屋の出入り・準備OKだけ(Supabaseは1クライアント30秒に5回まで)。
     対戦中のHP・攻撃などは broadcast で送る。切れたら自動で入り直す。 */
  const client=sbClient();
  const myKey=Math.random().toString(36).slice(2,10)+Date.now().toString(36);
  return{join:(name)=>new Promise((res,rej)=>{
    let ch=null,pres={},fns=[],mfns=[],last=0,timer=null,left=false,done=false,lastPeers=[];
    let bq=null,bt=null,blast=0;
    const peers=()=>{const st=(ch&&ch.presenceState())||{};const out=[];
      for(const k in st){const arr=st[k]||[];const p=arr[arr.length-1]||{};const o={};for(const f in p)if(f!=="presence_ref")o[f]=p[f];
        out.push({peer:k,sameTab:k===myKey,isMe:k===myKey,presence:k===myKey?pres:o})}
      if(!out.some(p=>p.sameTab))out.push({peer:myKey,sameTab:true,isMe:true,presence:pres});return out};
    const emit=()=>{lastPeers=peers();fns.forEach(f=>{try{f({peers:lastPeers})}catch(e){}})};
    const flush=()=>{timer=null;last=Date.now();if(ch&&api.ok)Promise.resolve(ch.track(pres)).catch(()=>{})};
    const bflush=()=>{bt=null;blast=Date.now();if(ch&&api.ok&&bq){const m=bq;bq=null;Promise.resolve(ch.send({type:"broadcast",event:"g",payload:m})).catch(()=>{})}};
    const connect=()=>{
      if(left)return;
      const c=client.channel(name,{config:{presence:{key:myKey},broadcast:{self:false}}});ch=c;
      c.on("presence",{event:"sync"},()=>{if(ch===c)emit()});
      c.on("broadcast",{event:"g"},m=>{if(ch!==c)return;const p=m&&m.payload;if(!p||p.k===myKey)return;mfns.forEach(f=>{try{f(p)}catch(e){}})});
      c.subscribe((st,err)=>{
        if(ch!==c)return;
        if(st==="SUBSCRIBED"){api.ok=true;api.downAt=0;flush();if(!done){done=true;res(api)}}
        else if(st==="CHANNEL_ERROR"||st==="TIMED_OUT"||st==="CLOSED"){
          api.ok=false;if(!api.downAt)api.downAt=Date.now();
          if(!done){done=true;rej({code:st,msg:err&&(err.message||String(err))||""});return}
          if(left)return;
          setTimeout(()=>{if(left||ch!==c)return;try{client.removeChannel(c)}catch(e){}connect()},1500);
        }});
    };

      presence:async(patch)=>{pres=Object.assign({},pres,patch);for(const k in patch)if(patch[k]===null)delete pres[k];

      onPeers:(f)=>{fns.push(f);setTimeout(()=>f({peers:peers()}),0);return()=>{fns=fns.filter(x=>x!==f)}},
      onMsg:(f)=>{mfns.push(f);return()=>{mfns=mfns.filter(x=>x!==f)}},
      leave:async()=>{if(bq&&api.ok){clearTimeout(bt);bflush()}left=true;const c=ch;try{await c.untrack()}catch(e){}try{client.removeChannel(c)}catch(e){}}
    };
    connect();
    setTimeout(()=>{if(!done){done=true;rej({code:"timeout"})}},10000);
  })};
}

  const s=REC.eq&&REC.eq.snd;if(!SND.ctx)return;
  if(!s||k==="IN")return _keySE(k);
  const d=/^\d$/.test(k)?+k:k==="00"?0:k==="."?10:["+","-","*","/","="].indexOf(k)>=0?11+["+","-","*","/","="].indexOf(k):16;
  const f=440*Math.pow(2,([0,2,4,5,7,9,11,12,14,16,17,19,21,23,24,26,28][d%17]-9)/12)*2;

};

  const amts=[...new Set([...L,...R].map(x=>x[1]))];
  const tot=L.reduce((s,x)=>s+x[1],0);const dec=new Set(extraAmt||[]);
  if(amts.length>1){dec.add(tot+amts[amts.length-1])}else{dec.add(amts[0]*2);dec.add(Math.round(amts[0]/2/100)*100||amts[0]+1000)}
  if(dec.size<2)dec.add(tot+1000);

  return{t:"jr",q,L,R,ac:rshuf([...new Set([...L,...R].map(x=>x[0]).concat(decoyAcct||[]))]),am:rshuf(amts.concat([...dec].slice(0,2)))};

     JR(`買掛金 ${yn(b)}円について、電子記録債務の発生記録を行った。`,[["買掛金",b]],[["電子記録債務",b]],["支払手形","電子記録債権"]),
     JR(`電子記録債権 ${yn(a)}円の支払期日が来て、普通預金口座に入金された。`,[["普通預金",a]],[["電子記録債権",a]],["売掛金","受取手形"]),
     MC("電子記録債務はどのグループ?",["負債","資産","費用"],"負債","あとで払う義務なので負債。")]}},
   {id:"c5l3",name:"手形の貸し借り・クレジット",make:lv=>{const a=A(lv,100000,500000),s=A(lv,20000,100000),r=rpick([2,3,4,5]),f=Math.round(s*r/100);return[
     TALK([["tencho","お金を貸すときに、借用書のかわりに手形を受け取ることもあるんだ。"]],{n:"手形貸付金・手形借入金",g:"",d:"手形を受け取って貸した → 手形貸付金(資産)<br>手形を渡して借りた → 手形借入金(負債)"}),
     JR(`取引先に現金 ${yn(a)}円を貸し付け、同額の約束手形を受け取った。`,[["手形貸付金",a]],[["現金",a]],["受取手形","貸付金"]),
     JR(`銀行から ${yn(a)}円を借り入れ、約束手形を振り出して当座預金に入金された。`,[["当座預金",a]],[["手形借入金",a]],["支払手形","借入金"]),
     TALK([["gou","お客さんがカードで払ったッス!"],["luna","…カード会社から入るまでは「クレジット売掛金」。手数料も引かれる。"]],{n:"クレジット売掛金",g:"資産",d:"クレジットカードで売り上げた代金。カード会社への手数料は「支払手数料」(費用)。"}),
     CALC(`商品 ${yn(s)}円をクレジットカードで売り上げた。カード会社の手数料は ${r}%。手数料はいくら?`,"支払手数料",f,`${yn(s)} × ${r}% = ${yn(f)}`),
     JR(`商品 ${yn(s)}円をクレジット払いで売り上げた。手数料 ${yn(f)}円は売上計上時に計上する。`,[["クレジット売掛金",s-f],["支払手数料",f]],[["売上",s]],["売掛金","現金"])]}}
  ]},
 {id:"c6",no:6,month:"7月",title:"固定資産",story:"店の配達用に車を買い、倉庫も借りた。長く使うものの記録を覚えよう。",color:"#7a5a1a",
  lessons:[
   {id:"c6l1",name:"買うとき",make:lv=>{const p=A(lv,1000000,5000000),f1=A(lv,20000,100000),f2=A(lv,10000,60000),c=A(lv,800000,2000000),d=A(lv,100000,400000);return[
     TALK([["gou","配達用の車、ついに来たッス!"],["tencho","買うときにかかった手数料も、車の値段に入れるんだよ。"]],{n:"取得原価",g:"",d:"本体価格+付随費用(登録料・手数料・運送費など)<br>= 固定資産の金額"}),
     CALC(`配達用の車 ${yn(p)}円を購入し、登録手数料 ${yn(f1)}円と納車費用 ${yn(f2)}円もかかった。車両運搬具の金額は?`,"車両運搬具",p+f1+f2,`${yn(p)}+${yn(f1)}+${yn(f2)}=${yn(p+f1+f2)}。付随費用も含める。`),
     JR(`車 ${yn(p)}円を購入し、付随費用 ${yn(f1+f2)}円とあわせて普通預金から支払った。`,[["車両運搬具",p+f1+f2]],[["普通預金",p+f1+f2]],["備品","支払手数料"]),
     JR(`倉庫用の建物 ${yn(c)}円を購入し、代金は月末払いとした。`,[["建物",c]],[["未払金",c]],["買掛金","土地"]),
     JR(`倉庫を借りるにあたり、敷金 ${yn(d)}円を普通預金から支払った。`,[["差入保証金",d]],[["普通預金",d]],["支払家賃","前払金"]),
     S("車両運搬具")]}},
   {id:"c6l2",name:"減価償却",make:lv=>{const n=rpick([4,5,6,8,10]),c=n*12*(lv>=2?rnd(500,2000)*10:rnd(5,20)*1000),y=c/n,m=rpick([3,4,6,8,9]),ym=c/n*m/12;return[
     TALK([["luna","…ものは使うと価値が減る。その分を毎年、費用にする。それが減価償却。"],["niya","人間も年々減価償却されてて草"]],{n:"減価償却(定額法)",g:"",d:"1年分の減価償却費 = 取得原価 ÷ 耐用年数<br>(残存価額ゼロのとき)"}),
     CALC(`備品 ${yn(c)}円、耐用年数 ${n}年、残存価額ゼロ。1年分の減価償却費は?`,"減価償却費",y,`${yn(c)} ÷ ${n} = ${yn(y)}`),
     TALK([["tencho","減った分は、備品から直接引かずに「減価償却累計額」に積み上げていくんだよ。これを間接法っていうの。"]],null),
     JR(`決算。備品の減価償却費 ${yn(y)}円を間接法で計上する。`,[["減価償却費",y]],[["減価償却累計額",y]],["備品","未払金"]),
     CALC(`期中に備品 ${yn(c)}円を取得し、決算まで ${m}か月使った。耐用年数 ${n}年・残存ゼロの月割りの減価償却費は?`,"減価償却費",ym,`${yn(c)} ÷ ${n} × ${m}/12 = ${yn(ym)}`),
     MC("間接法で、減価償却累計額は仕訳のどちら側に書く?",["右(貸方)","左(借方)"],"右(貸方)","資産の価値が減るのを右側に積み上げる。")]}},
   {id:"c6l3",name:"売るとき",make:lv=>{const c=A(lv,400000,1000000),acc=Math.round(c*rpick([.4,.5,.6])/1000)*1000,bv=c-acc,gain=Math.random()<.5,p=gain?bv+A(lv,10000,60000):Math.max(1000,bv-A(lv,10000,60000)),r=A(lv,10000,60000);
     const L=[["減価償却累計額",acc],["未収入金",p]],R=[["備品",c]];if(gain)R.push(["固定資産売却益",p-bv]);else L.push(["固定資産売却損",bv-p]);return[
     TALK([["tencho","古い棚を売ることにしたよ。帳簿の値段より高く売れたら「売却益」、安かったら「売却損」だね。"]],{n:"帳簿価額",g:"",d:"帳簿価額 = 取得原価 − 減価償却累計額<br>売った値段 − 帳簿価額 = 売却益(損)"}),
     CALC(`備品の取得原価 ${yn(c)}円、減価償却累計額 ${yn(acc)}円。帳簿価額は?`,"帳簿価額",bv,`${yn(c)} − ${yn(acc)} = ${yn(bv)}`),
     MC(`帳簿価額 ${yn(bv)}円の備品を ${yn(p)}円で売った。出てくる科目は?`,["固定資産売却益","固定資産売却損"],gain?"固定資産売却益":"固定資産売却損",gain?"帳簿価額より高く売れた → 売却益(収益)":"帳簿価額より安く売った → 売却損(費用)"),
     JR(`備品(取得原価 ${yn(c)}円、減価償却累計額 ${yn(acc)}円)を ${yn(p)}円で売却し、代金は月末に受け取る。`,L,R,[gain?"固定資産売却損":"固定資産売却益","現金"]),
     JR(`配達用の車の故障を修理し、修理代 ${yn(r)}円を現金で支払った。`,[["修繕費",r]],[["現金",r]],["車両運搬具","減価償却費"])]}}
  ]},
 {id:"c7",no:7,month:"8月",title:"税金",story:"店に届いた封筒の山。消費税、法人税、固定資産税…税金にも仕訳がある!",color:"#8a2a4a",
  lessons:[
   {id:"c7l1",name:"消費税",make:lv=>{const a=A(lv,100000,250000),ta=Math.round(a*.1),b=a+A(lv,100000,300000),tb=Math.round(b*.1);return[
     TALK([["gou","商品の値段に10%足して払ってるッス!この10%、どうするんスか!?"],["luna","…税抜方式。払った消費税は「仮払消費税」、もらった消費税は「仮受消費税」。"]],{n:"消費税(税抜方式)",g:"",d:"仕入れで払った10% → 仮払消費税(資産)<br>売上で受け取った10% → 仮受消費税(負債)"}),
     JR(`商品 ${yn(a)}円(税抜)を仕入れ、消費税10%とあわせて掛けとした。`,[["仕入",a],["仮払消費税",ta]],[["買掛金",a+ta]],["仮受消費税","現金"]),
     JR(`商品 ${yn(b)}円(税抜)を売り上げ、消費税10%とあわせて掛けとした。`,[["売掛金",b+tb]],[["売上",b],["仮受消費税",tb]],["仮払消費税","現金"]),
     SPOT(`商品 ${yn(b)}円(税抜)を売り上げ、消費税10%とあわせて掛けとした。`,[["売掛金",yn(b+tb),"売上",yn(b)],["—","","仮払消費税",yn(tb)]],[1,2],"売上で受け取った消費税は「仮受消費税」。"),
     CALC(`仮受消費税 ${yn(tb)}円、仮払消費税 ${yn(ta)}円。納める消費税は?`,"未払消費税",tb-ta,`${yn(tb)} − ${yn(ta)} = ${yn(tb-ta)}`),
     JR(`決算。仮受消費税 ${yn(tb)}円と仮払消費税 ${yn(ta)}円を相殺し、納付額を計上する。`,[["仮受消費税",tb]],[["仮払消費税",ta],["未払消費税",tb-ta]],["租税公課","現金"])]}},
   {id:"c7l2",name:"法人税",make:lv=>{const half=A(lv,100000,400000),tot=half+A(lv,100000,400000);return[
     TALK([["tencho","会社のもうけにかかる税金が法人税だよ。年の途中で半分くらい先に払うんだ。"]],{n:"法人税等",g:"",d:"途中で払った → 仮払法人税等(資産)<br>決算で年間の額が決まる → 法人税等(費用)<br>残りを後で払う → 未払法人税等(負債)"}),
     JR(`法人税等の中間申告を行い、${yn(half)}円を普通預金から納付した。`,[["仮払法人税等",half]],[["普通預金",half]],["法人税等","租税公課"]),
     CALC(`年間の法人税等は ${yn(tot)}円、中間納付は ${yn(half)}円。あと払う額は?`,"未払法人税等",tot-half,`${yn(tot)} − ${yn(half)} = ${yn(tot-half)}`),
     JR(`決算。法人税等が ${yn(tot)}円と決まった。中間納付額は ${yn(half)}円。`,[["法人税等",tot]],[["仮払法人税等",half],["未払法人税等",tot-half]],["租税公課","未払金"]),
     JR(`未払法人税等 ${yn(tot-half)}円を普通預金から納付した。`,[["未払法人税等",tot-half]],[["普通預金",tot-half]],["法人税等","仮払法人税等"])]}},
   {id:"c7l3",name:"租税公課と印紙",make:lv=>{const a=A(lv,30000,120000),b=rpick([2000,4000,6000,10000]),c=Math.round(b/2/100)*100||200;return[
     TALK([["tencho","お店の土地や建物にかかる固定資産税、契約書に貼る収入印紙。これは「租税公課」だよ。"]],{n:"租税公課",g:"費用",d:"固定資産税・収入印紙・自動車税など、費用になる税金。"}),
     JR(`固定資産税 ${yn(a)}円を現金で納付した。`,[["租税公課",a]],[["現金",a]],["法人税等","未払金"]),
     JR(`収入印紙 ${yn(b)}円分を購入し、現金で支払った。`,[["租税公課",b]],[["現金",b]],["通信費","消耗品費"]),
     TALK([["luna","…決算のとき使ってない印紙や切手が残ってたら、「貯蔵品」に振り替える。"]],{n:"貯蔵品",g:"資産",d:"決算日に残っている未使用の印紙・切手。資産として次期に繰り越す。"}),
     JR(`決算日に、未使用の収入印紙 ${yn(c)}円分が残っていた。`,[["貯蔵品",c]],[["租税公課",c]],["消耗品費","通信費"]),
     MC("法人税等の中間納付で使う科目は?",["仮払法人税等","租税公課","未払法人税等"],"仮払法人税等","まだ年間の額が決まっていないから「仮払」。")]}}
  ]},
 {id:"c8",no:8,month:"9月",title:"株式会社のしくみ",story:"よね屋を株式会社にすることに!株を発行して、もうけは株主に配当する。",color:"#2a6a3a",
  lessons:[
   {id:"c8l1",name:"株を発行する",make:lv=>{const pr=rpick([10000,20000,50000,60000]),n=rpick([50,100,200,300]),t=pr*n;return[
     TALK([["tencho","会社を作るときは株を発行して、出してもらったお金は「資本金」にするんだよ。"]],{n:"資本金",g:"純資産",d:"株主から出してもらったお金。返さなくていいお金なので純資産。"}),
     CALC(`1株 ${yn(pr)}円で ${n}株を発行した。払い込まれた金額は?`,"資本金",t,`${yn(pr)} × ${n} = ${yn(t)}`),
     JR(`株式 ${n}株を1株 ${yn(pr)}円で発行し、全額が普通預金に払い込まれた。`,[["普通預金",t]],[["資本金",t]],["借入金","繰越利益剰余金"]),
     S("資本金"),
     MC("増資で株式を追加発行し、当座預金に入金された。右(貸方)の科目は?",["資本金","借入金","売上"],"資本金","株主からのお金は資本金。")]}},
   {id:"c8l2",name:"もうけと配当",make:lv=>{const p=A(lv,500000,2000000),d=A(lv,100000,400000),rr=Math.round(d/10);return[
     TALK([["tencho","1年のもうけ(当期純利益)は「繰越利益剰余金」にためていくんだよ。"],["niya","ため込み勢で草"]],{n:"繰越利益剰余金",g:"純資産",d:"会社がためてきたもうけ。ここから株主に配当する。"}),
     JR(`決算。当期純利益 ${yn(p)}円を損益勘定から繰越利益剰余金に振り替えた。`,[["損益",p]],[["繰越利益剰余金",p]],["資本金","売上"]),
     TALK([["luna","…配当するときは、配当額の10分の1を「利益準備金」として積み立てる。決まり。"]],{n:"利益準備金",g:"純資産",d:"配当のときに積み立てる準備金。配当額の1/10(上限あり)。"}),
     CALC(`株主に ${yn(d)}円の配当をする。積み立てる利益準備金は?`,"利益準備金",rr,`${yn(d)} × 1/10 = ${yn(rr)}`),
     JR(`株主総会で、配当 ${yn(d)}円、利益準備金の積み立て ${yn(rr)}円が決まった。`,[["繰越利益剰余金",d+rr]],[["未払配当金",d],["利益準備金",rr]],["資本金","現金"]),
     JR(`未払配当金 ${yn(d)}円を普通預金から支払った。`,[["未払配当金",d]],[["普通預金",d]],["繰越利益剰余金","利益準備金"])]}},
   {id:"c8l3",name:"損失が出たとき",make:lv=>{const l=A(lv,100000,600000);return[
     TALK([["gou","今年は赤字ッス…!"],["luna","…赤字……(ふらっ)"],["tencho","あらまぁ。損失のときは振り替えが逆になるんだよ。"]],null),
     JR(`決算。当期純損失 ${yn(l)}円を繰越利益剰余金に振り替えた。`,[["繰越利益剰余金",l]],[["損益",l]],["資本金","売上"]),
     MC("当期純利益を振り替えるとき、繰越利益剰余金はどっち側?",["右(貸方)","左(借方)"],"右(貸方)","純資産が増えるので右。損失のときは左。"),
     S("利益準備金"),S("未払配当金")]}}
  ]},
 {id:"c9",no:9,month:"10月",title:"伝票と帳簿",story:"取引が増えて、仕訳帳だけでは追いつかない。伝票と補助簿で手分けしよう。",color:"#4a4a6a",
  lessons:[
   {id:"c9l1",name:"3つの伝票",make:lv=>{const a=A(lv,50000,150000),c=Math.round(a*.4/1000)*1000||1000;return[
     TALK([["robo","ピピッ。伝票ハ3種類。入金伝票・出金伝票・振替伝票。"]],{n:"3伝票制",g:"",d:"現金が入った → 入金伝票(借方は必ず現金)<br>現金が出た → 出金伝票(貸方は必ず現金)<br>現金が動かない → 振替伝票"}),
     MC(`「売掛金 ${yn(a)}円を現金で回収した」はどの伝票?`,["入金伝票","出金伝票","振替伝票"],"入金伝票","現金が入ったので入金伝票。"),
     MC(`「消耗品 ${yn(c)}円を現金で買った」はどの伝票?`,["出金伝票","入金伝票","振替伝票"],"出金伝票","現金が出たので出金伝票。"),
     MC(`「商品 ${yn(a)}円を掛けで仕入れた」はどの伝票?`,["振替伝票","出金伝票","入金伝票"],"振替伝票","現金が動かない取引は振替伝票。"),
     TALK([["tencho","一部だけ現金の取引は、いったん全部掛けにして、すぐ現金で払ったと考えると書きやすいよ。"]],null),
     JR(`商品 ${yn(a)}円を仕入れ、${yn(c)}円は現金、残りは掛けとした。振替伝票の仕訳は?(いったん全額掛けとする方法)`,[["仕入",a]],[["買掛金",a]],["現金","売掛金"]),
     MC("入金伝票に「売上」と書いてあった。省略されている借方の科目は?",["現金","売掛金","普通預金"],"現金","入金伝票の借方は必ず現金。")]}},
   {id:"c9l2",name:"補助簿",make:lv=>[
     TALK([["luna","…仕訳帳と総勘定元帳が主要簿。くわしく記録するのが補助簿。"]],{n:"補助簿",g:"",d:"現金出納帳・当座預金出納帳・仕入帳・売上帳・<br>売掛金元帳・買掛金元帳・商品有高帳など"}),

function mvScenario(lv){
  for(let k=0;k<4000;k++){
    const q0=rnd(2,6)*10,p0=rnd(8,30)*(lv>=2?10:100),q1=rnd(2,8)*10,p1=p0+rnd(-4,6)*(lv>=2?10:100);
    if(p1<=0||p1===p0)continue;const Q1=q0+q1,V1=q0*p0+q1*p1;if(V1%Q1)continue;const u1=V1/Q1;
    const q2=rnd(1,Math.floor(Q1/10)-1)*10;if(q2<=0||q2>=Q1)continue;const Qa=Q1-q2,Va=Qa*u1;
    const q3=rnd(2,6)*10,p3=u1+rnd(-3,5)*(lv>=2?10:100);if(p3<=0)continue;const Q2=Qa+q3,V2=Va+q3*p3;if(V2%Q2)continue;const u2=V2/Q2;
    const q4=rnd(1,Math.floor(Q2/10)-1)*10;if(q4<=0||q4>=Q2)continue;
    return{q0,p0,q1,p1,Q1,u1,V1,q2,Qa,Va,q3,p3,Q2,u2,V2,q4,Qb:Q2-q4,Vb:(Q2-q4)*u2,cogs:q2*u1+q4*u2};
  }

}

function j1PLStep(){
  const n=rpick([5,8,10]),r=rpick([2,3]),A=n*rnd(2,8)*1000,dep=rk(40,120),C=dep*n-A,ai=A*r/100;
  const S=rk(100,300),PBO=rnd(50,200)*10000,PA=rnd(30,150)*10000,rf=S+PBO*2/100-PA*3/100;
  const y=rpick([3,4,5]),F=rpick([100,200,300,500])*10000,cp=rpick([1,2]),Pc=F-y*rnd(2,9)*1000,bi=F*cp/100+(F-Pc)/y;
  const Bv=rk(200,600),Hv=rk(40,Bv/1000-40),bd=(Bv-Hv)/2;
  const d=rnd(10,90)*100,r0=rnd(130,150),r1=r0+rpick([-6,-4,-3,3,4,6]),fx=d*(r1-r0);
  const dT=rk(100,500),tx=dT*3/10;
  const b=B_,cols=["損益計算書の科目(当期)","金額"];
  const rows=[["減価償却費(機械)",b(dep)],["利息費用(資産除去債務)",b(ai)],["退職給付費用",b(rf)],["有価証券利息",b(bi)],["貸倒引当金繰入",b(bd)],[fx>0?"為替差益":"為替差損",b(Math.abs(fx))],["法人税等調整額(貸方)",b(tx)]];
  const q=`<b>決算整理事項等</b>(当期首から1年分)<br>① 当期首に機械 ${yn(C)}円を取得。使用後に除去する義務があり、除去費用の割引現在価値 ${yn(A)}円を資産除去債務として計上した(割引率${r}%)。耐用年数${n}年・残存価額ゼロ・定額法。<br>② 退職給付:勤務費用 ${yn(S)}円、期首退職給付債務 ${yn(PBO)}円(割引率2%)、期首年金資産 ${yn(PA)}円(長期期待運用収益率3%)。数理計算上の差異はない。<br>③ 当期首に満期保有目的の社債(額面 ${yn(F)}円・クーポン年${cp}%・残り${y}年)を ${yn(Pc)}円で取得。償却原価法(定額法)を適用する。<br>④ 貸倒懸念債権 ${yn(Bv)}円に財務内容評価法を適用する。担保処分見込額 ${yn(Hv)}円、残額の50%を引き当てる(期首の引当金はない)。<br>⑤ 外貨建売掛金 ${yn(d)}ドル(取引時 1ドル=${r0}円)、決算時レート 1ドル=${r1}円。<br>⑥ 将来減算一時差異が当期に ${yn(dT)}円増えた(税率30%)。<br>損益計算書(一部)の金額を答えなさい。`;
  const ex=`減価償却 (${yn(C)}+${yn(A)})÷${n}=${yn(dep)}<br>利息費用 ${yn(A)}×${r}%=${yn(ai)}<br>退職給付費用 ${yn(S)}+${yn(PBO)}×2%−${yn(PA)}×3%=${yn(rf)}<br>有価証券利息 ${yn(F)}×${cp}%+(${yn(F)}−${yn(Pc)})÷${y}=${yn(bi)}<br>貸倒 (${yn(Bv)}−${yn(Hv)})×50%=${yn(bd)}<br>為替 ${yn(d)}×(${r1}−${r0})=${yn(fx)}<br>税効果 ${yn(dT)}×30%=${yn(tx)}`;
  return TBL(q,cols,rows,ex,"損益計算書(一部)")}
function j1StdStep(){
  for(let t=0;t<500;t++){
    const p=rnd(20,50)*10,qs=rpick([2,3,4]),w=rpick([1000,1200,1500]),hs=rpick([2,3]),v=rpick([300,400,500]),f=rpick([600,800,1000]),N=rnd(20,32)*100,F=f*N;
    const Q=rnd(8,12)*100,Hs=Q*hs,ha=Hs+rnd(-10,15)*10,qa=Q*qs+rnd(-20,30)*10,pa=p+rpick([-10,-5,5,10]),wa=w+rpick([-50,-20,20,50]),Oa=F+v*ha+rnd(-50,50)*1000;
    if(ha===Hs||qa===Q*qs)continue;
    const d1=(p-pa)*qa,d2=p*(Q*qs-qa),d3=(w-wa)*ha,d4=w*(Hs-ha),d5=F+v*ha-Oa,d6=(v+f)*(Hs-ha),d7=f*(ha-N);

   MC("保険金が帳簿価額より多かったときの科目は?",["保険差益","火災損失","固定資産売却益"],"保険差益","差額は保険差益(収益)。少なければ火災損失。")]}}
]});
K2({id:"k5",no:5,month:"株式会社 1年目",title:"リースとソフトウェア",story:"配達車をリースで借りて、レジのソフトも導入。目に見えない資産も記帳しよう。",color:"#1f6f8a",lessons:[
 {id:"k5l1",name:"ファイナンス・リース(利子込み法)",make:lv=>{const yr=rpick([4,5]),pay=r1k(100,300),tot=pay*yr,dep=tot/yr;return[
   TALK([["tencho","途中でやめられないリースは、買ったのと同じように「リース資産」にするんだよ。"]],{n:"ファイナンス・リース",g:"",d:"リース資産(資産)とリース債務(負債)を計上。<br>利子込み法:支払総額で計上する。"}),
   JR(`配達車を年 ${yn(pay)}円・${yr}年のファイナンス・リースで借りた(利子込み法)。`,[["リース資産",tot]],[["リース債務",tot]],["車両運搬具","未払金"]),
   JR(`1年分のリース料 ${yn(pay)}円を普通預金から支払った(利子込み法)。`,[["リース債務",pay]],[["普通預金",pay]],["支払利息","支払家賃"]),
   JR(`決算。リース資産 ${yn(tot)}円を耐用年数 ${yr}年・残存ゼロの定額法で減価償却する。`,[["減価償却費",dep]],[["減価償却累計額",dep]],["リース債務","リース資産"])]}},
 {id:"k5l2",name:"利子抜き法",make:lv=>{const yr=rpick([4,5]),pay=r1k(100,300),cash=pay*yr-r1k(10,40)*yr,prin=cash/yr,it=pay-prin;return[
   TALK([["luna","…利子抜き法は、見積現金購入価額で計上。払うたびに利息を分ける。"]],null),
   JR(`年 ${yn(pay)}円・${yr}年のリース契約(見積現金購入価額 ${yn(cash)}円)を結んだ(利子抜き法)。`,[["リース資産",cash]],[["リース債務",cash]],["支払利息","車両運搬具"]),
   CALC(`リース料 年 ${yn(pay)}円、元本の返済分は ${yn(cash)}÷${yr}年。1年分の利息は?(定額法)`,"支払利息",it,`${yn(pay)}−${yn(prin)}=${yn(it)}`),
   JR(`1年分のリース料 ${yn(pay)}円を普通預金から支払った(利子抜き法、利息は定額法)。`,[["リース債務",prin],["支払利息",it]],[["普通預金",pay]],["リース資産","支払手数料"])]}},
 {id:"k5l3",name:"ソフトウェアと研究開発費",make:lv=>{const sw=r1k(100,500)*5,am=sw/5,rd=A(lv,200000,800000),eq=A(lv,100000,300000);return[
   JR(`レジ用のソフトウェア ${yn(sw)}円を購入し、代金は翌月払いとした。`,[["ソフトウェア",sw]],[["未払金",sw]],["備品","買掛金"]),
   JR(`決算。ソフトウェア ${yn(sw)}円を5年で定額法により償却する(直接法)。`,[["ソフトウェア償却",am]],[["ソフトウェア",am]],["減価償却費","減価償却累計額"]),
   TALK([["gou","新商品の研究で、研究専用の機械も買ったッス!"],["luna","…研究のためだけの支出は、機械でも全部「研究開発費」。"]],{n:"研究開発費",g:"費用",d:"研究開発のための支出。研究専用の機械なども資産にせず、すぐ費用にする。"}),
   JR(`研究所の人件費 ${yn(rd)}円と、研究専用の機械 ${yn(eq)}円を普通預金から支払った。`,[["研究開発費",rd+eq]],[["普通預金",rd+eq]],["機械装置","ソフトウェア"])]}}
]});
K2({id:"k6",no:6,month:"株式会社 1年目",title:"引当金",story:"ボーナス、退職金、修繕…将来のお金の準備も帳簿にのせよう。",color:"#8a2a4a",lessons:[
 {id:"k6l1",name:"賞与引当金",make:lv=>{const a=A(lv,200000,600000),ex=A(lv,10000,80000);return[
   TALK([["gou","ボーナスまだッスか!?"],["tencho","決算までに働いた分は、払う前でも「賞与引当金」にしておくんだよ。"]],{n:"賞与引当金",g:"負債",d:"次期に払うボーナスのうち、当期に負担する分。<br>決算:賞与引当金繰入 / 賞与引当金"}),
   JR(`決算。次期に支給する賞与のうち当期負担分 ${yn(a)}円を引当金に計上する。`,[["賞与引当金繰入",a]],[["賞与引当金",a]],["賞与","未払費用"]),
   JR(`賞与 ${yn(a+ex)}円を普通預金から支給した。このうち ${yn(a)}円は賞与引当金を設定済み。`,[["賞与引当金",a],["賞与",ex]],[["普通預金",a+ex]],["賞与引当金繰入","給料"])]}},
 {id:"k6l2",name:"退職給付・修繕",make:lv=>{const a=A(lv,100000,400000),b=A(lv,50000,200000),c=A(lv,100000,300000),d=c+A(lv,20000,80000);return[
   JR(`決算。退職給付費用 ${yn(a)}円を計上する。`,[["退職給付費用",a]],[["退職給付引当金",a]],["給料","賞与引当金"]),
   JR(`従業員の退職にあたり、退職金 ${yn(b)}円を普通預金から支払った(引当金を取り崩す)。`,[["退職給付引当金",b]],[["普通預金",b]],["退職給付費用","給料"]),
   JR(`決算。次期の大規模修繕にそなえて ${yn(c)}円を引当金に計上する。`,[["修繕引当金繰入",c]],[["修繕引当金",c]],["修繕費","建物"]),
   JR(`修繕を行い ${yn(d)}円を当座預金から支払った。修繕引当金 ${yn(c)}円を取り崩す。`,[["修繕引当金",c],["修繕費",d-c]],[["当座預金",d]],["修繕引当金繰入","建物"])]}},
 {id:"k6l3",name:"商品保証と貸倒の個別評価",make:lv=>{const s=r1k(1000,3000),pc=rpick([1,2]),g=s*pc/100,ar=r1k(300,800),col=Math.round(ar*.4/1000)*1000,ind=(ar-col)/2;return[
   CALC(`当期の売上高 ${yn(s)}円の ${pc}%を商品保証引当金として設定する。金額は?`,"商品保証引当金",g,`${yn(s)}×${pc}%=${yn(g)}`),
   JR(`決算。商品保証引当金 ${yn(g)}円を設定する(前期の残高はない)。`,[["商品保証引当金繰入",g]],[["商品保証引当金",g]],["売上","修繕引当金"]),
   CALC(`経営が悪化したC社への売掛金 ${yn(ar)}円。担保で ${yn(col)}円は回収できる。残りの50%を貸倒引当金に設定する。金額は?`,"貸倒引当金",ind,`(${yn(ar)}−${yn(col)})×50%=${yn(ind)}`)]}}
]});
K2({id:"k7",no:7,month:"株式会社 1年目",title:"外貨建取引",story:"海外の雑貨を輸入することに!ドルの取引は円に直して記帳しよう。",color:"#2a6a3a",lessons:[
 {id:"k7l1",name:"取引日と決済日",make:lv=>{const d=r100(10,50),r1=rnd(105,150),r2=r1+rpick([-4,-3,-2,2,3,4]),y1=d*r1,y2=d*r2,diff=y2-y1;return[
   TALK([["tencho","ドルの取引は、その日のレートで円にするんだよ。"],["niya","円安で草"]],{n:"外貨建取引",g:"",d:"取引日:その日のレートで円に換算<br>決済日のレートとの差 → 為替差損益"}),
   CALC(`商品 ${yn(d)}ドルを掛けで仕入れた。取引日のレートは1ドル=${r1}円。仕入の金額は?`,"仕入",y1,`${yn(d)}×${r1}=${yn(y1)}`),
   JR(`商品 ${yn(d)}ドルを掛けで輸入した(1ドル=${r1}円)。`,[["仕入",y1]],[["買掛金",y1]],["前払金","為替差損益"]),
   JR(`買掛金 ${yn(d)}ドル(取引日 1ドル=${r1}円)を、1ドル=${r2}円で普通預金から支払った。`,[["買掛金",y1]].concat(diff>0?[["為替差損益",diff]]:[]),[["普通預金",y2]].concat(diff<0?[["為替差損益",-diff]]:[]),["仕入","支払手数料"])]}},
 {id:"k7l2",name:"決算の換算",make:lv=>{const d=r100(10,40),r1=rnd(110,145),r3=r1+rpick([-5,-3,3,5]),diff=d*(r3-r1);return[
   TALK([["luna","…決算では「お金で決済するもの」だけ決算日のレートに直す。売掛金・買掛金・現金など。商品や前払金は直さない。"]],null),
   MC("決算日のレートに換算し直すのは?",["買掛金","商品","前払金"],"買掛金","貨幣項目(売掛金・買掛金・外貨預金など)だけ換算替えする。"),
   JR(`決算。外貨建の買掛金 ${yn(d)}ドル(取引日 1ドル=${r1}円)を、決算日のレート1ドル=${r3}円に換算する。`,diff>0?[["為替差損益",diff]]:[["買掛金",-diff]],diff>0?[["買掛金",diff]]:[["為替差損益",-diff]],["仕入","売上"])]}},
 {id:"k7l3",name:"前払金があるとき",make:lv=>{const tot=r100(20,60),pr=Math.max(100,Math.round(tot*rpick([.1,.2,.3])/100)*100),r0=rnd(110,140),r1=r0+rpick([-3,2,4]),py=pr*r0,rest=(tot-pr)*r1;return[
   JR(`商品 ${yn(tot)}ドルの輸入契約をし、手付金 ${yn(pr)}ドルを普通預金から支払った(1ドル=${r0}円)。`,[["前払金",py]],[["普通預金",py]],["仕入","為替差損益"]),
   CALC(`商品を受け取った(1ドル=${r1}円)。前払金は ${yn(py)}円、残り ${yn(tot-pr)}ドルは掛け。仕入の金額は?`,"仕入",py+rest,`前払金 ${yn(py)} + ${yn(tot-pr)}×${r1}=${yn(rest)} → ${yn(py+rest)}`),
   JR(`商品 ${yn(tot)}ドルを受け取り、前払金 ${yn(py)}円を差し引いた残り ${yn(tot-pr)}ドルは掛けとした(1ドル=${r1}円)。`,[["仕入",py+rest]],[["前払金",py],["買掛金",rest]],["為替差損益","普通預金"])]}}
]});
K2({id:"k8",no:8,month:"株式会社 1年目",title:"税効果会計",story:"会計のもうけと税金のもうけはズレる。そのズレを調整する上級テク!",color:"#4a4a6a",lessons:[
 {id:"k8l1",name:"貸倒引当金の損金不算入",make:lv=>{const a=r1k(10,90),t=a*30/100;return[
   TALK([["robo","ピピッ。会計デハ費用、税金ノ計算デハ費用ニナラナイ…ズレ発生"],["luna","…そのズレ×税率を「繰延税金資産」にする。税金の前払いみたいなもの。"]],{n:"税効果会計",g:"",d:"将来の税金が減る差異 × 税率 → 繰延税金資産 / 法人税等調整額<br>(この章では税率30%)"}),
   CALC(`貸倒引当金繰入 ${yn(a)}円が税法上は費用にならなかった。税率30%。繰延税金資産は?`,"繰延税金資産",t,`${yn(a)}×30%=${yn(t)}`),
   JR(`決算。税法上は費用にならなかった貸倒引当金繰入 ${yn(a)}円(将来減算一時差異)について税効果会計を適用する(税率30%)。`,[["繰延税金資産",t]],[["法人税等調整額",t]],["繰延税金負債","法人税等"]),
   MC("法人税等調整額が貸方に出ると、損益計算書の税金は?",["減る","増える","変わらない"],"減る","法人税等から差し引かれる。")]}},
 {id:"k8l2",name:"減価償却の超過",make:lv=>{const book=r1k(100,300),tax=book-r1k(10,60),ex=book-tax,t=ex*30/100;return[
   CALC(`会計上の減価償却費 ${yn(book)}円、税法上の限度額 ${yn(tax)}円。償却超過額は?`,"償却超過額",ex,`${yn(book)}−${yn(tax)}=${yn(ex)}`),
   JR(`決算。償却超過額 ${yn(ex)}円について税効果会計を適用する(税率30%)。`,[["繰延税金資産",t]],[["法人税等調整額",t]],["繰延税金負債","減価償却費"]),
   JR(`その資産を売却し、差異 ${yn(ex)}円が解消した(税率30%)。`,[["法人税等調整額",t]],[["繰延税金資産",t]],["繰延税金負債","法人税等"])]}},
 {id:"k8l3",name:"その他有価証券と税効果",make:lv=>{const bv=r1k(200,500),up=r1k(10,60),t=up*30/100;return[
   TALK([["tencho","その他有価証券の評価差額にも税効果をかけるよ。こっちは法人税等調整額を使わないのがポイント。"]],null),
   JR(`決算。その他有価証券(取得原価 ${yn(bv)}円)の時価は ${yn(bv+up)}円。税効果会計を適用する(税率30%、全部純資産直入法)。`,[["その他有価証券",up]],[["繰延税金負債",t],["その他有価証券評価差額金",up-t]],["法人税等調整額","有価証券評価益"]),
   MC("その他有価証券の評価差額の税効果で使わない科目は?",["法人税等調整額","繰延税金負債","その他有価証券評価差額金"],"法人税等調整額","純資産に直接入れるので、損益の科目(法人税等調整額)は使わない。")]}}
]});
K2({id:"k9",no:9,month:"株式会社 2年目",title:"純資産と配当",story:"株主が増えて、配当のルールもきびしくなった。準備金の計算をマスターしよう。",color:"#6a3a7a",lessons:[
 {id:"k9l1",name:"株式の発行",make:lv=>{const pr=rpick([20000,50000,80000]),n=rpick([100,200,500]),t=pr*n,half=t/2;return[
   TALK([["tencho","株の払込金のうち、最低半分は資本金にしなきゃいけないの。残りは「資本準備金」にできるよ。"]],{n:"資本金と資本準備金",g:"",d:"払込金額のうち 1/2以上 → 資本金<br>残り → 資本準備金(会社法の最低限度)"}),
   CALC(`1株 ${yn(pr)}円で ${n}株を発行。会社法で認められる最低限の資本金は?`,"資本金",half,`${yn(t)}×1/2=${yn(half)}`),
   JR(`株式 ${n}株を1株 ${yn(pr)}円で発行し当座預金に払い込まれた。資本金は会社法の最低限度額とする。`,[["当座預金",t]],[["資本金",half],["資本準備金",t-half]],["利益準備金","繰越利益剰余金"])]}},
 {id:"k9l2",name:"配当と準備金",make:lv=>{const cap=rpick([10000000,20000000]),cr=r1k(500,1200)*1000/1000,div=r1k(500,2000),rr=cap/4-cr-r1k(20,250),need=Math.min(div/10,cap/4-(cr+rr)),bet=r1k(50,300);return[
   TALK([["luna","…配当するとき、準備金は配当の1/10。でも資本準備金と利益準備金の合計が資本金の1/4になったら、そこまで。"]],{n:"利益準備金の積み立て",g:"",d:"積立額 = 配当 × 1/10<br>ただし (資本準備金+利益準備金) が 資本金×1/4 に達するまで"}),
   CALC(`資本金 ${yn(cap)}円、資本準備金 ${yn(cr)}円、利益準備金 ${yn(rr)}円。配当 ${yn(div)}円のとき積み立てる利益準備金は?`,"利益準備金",need,`配当×1/10=${yn(div/10)}、上限 ${yn(cap/4)}−${yn(cr+rr)}=${yn(cap/4-cr-rr)} → 小さいほう ${yn(need)}`),
   JR(`株主総会で、配当 ${yn(div)}円、利益準備金 ${yn(need)}円、別途積立金 ${yn(bet)}円を繰越利益剰余金から処分することが決まった。`,[["繰越利益剰余金",div+need+bet]],[["未払配当金",div],["利益準備金",need],["別途積立金",bet]],["資本準備金","資本金"])]}},
 {id:"k9l3",name:"株主資本等変動計算書",make:lv=>{const cap=r1k(5,9)*1000000/1000,cr=r1k(300,800),rr=r1k(100,400),re=r1k(800,2000),nc=r1k(500,1000),div=r1k(200,600),rv=div/10,ni=r1k(500,1500);return[
   TALK([["tencho","1年間で純資産がどう動いたかをまとめた表だよ。新株発行も配当も利益も全部ここに出てくる。"]],null),
   TBL(`当期:新株を発行し ${yn(nc*2)}円が払い込まれた(1/2を資本金)。配当 ${yn(div)}円(利益準備金 ${yn(rv)}円を積み立て)。当期純利益 ${yn(ni)}円。`,
     ["","資本金","資本準備金","利益準備金","繰越利益剰余金"],
     [["当期首残高",cap,cr,rr,re],["新株の発行",B_(nc),B_(nc),"",""],["剰余金の配当","","",B_(rv),B_(-(div+rv))],["当期純利益","","","",B_(ni)],["当期末残高",B_(cap+nc),B_(cr+nc),B_(rr+rv),B_(re-div-rv+ni)]],
     "減るところはマイナス(−)で入力。電卓で 0 − 金額 = と計算すると入れられる。","株主資本等変動計算書")]}}
]});
K2({id:"k10",no:10,month:"株式会社 2年目",title:"収益認識",story:"商品と保守サービスのセット販売を始めた。売上はいつ計上する?",color:"#2a7a6a",lessons:[
 {id:"k10l1",name:"履行義務が2つ",make:lv=>{const g=A(lv,200000,600000),sv=rnd(1,5)*12000,m=rpick([3,4,6]),rec=sv/12*m;return[
   TALK([["luna","…商品の引き渡しと、1年間の保守サービス。約束(履行義務)が2つ。終わった分だけ売上にする。"]],{n:"契約負債",g:"負債",d:"代金は受け取ったが、まだ果たしていない約束の分。前受金と同じイメージ。"}),
   JR(`商品 ${yn(g)}円と1年間の保守サービス ${yn(sv)}円をセットで販売し、代金は現金で受け取った。商品は引き渡し済み。`,[["現金",g+sv]],[["売上",g],["契約負債",sv]],["前受金","売掛金"]),
   CALC(`保守サービス ${yn(sv)}円(1年分)のうち、決算までに ${m}か月分を提供した。収益にする額は?`,"売上",rec,`${yn(sv)}×${m}/12=${yn(rec)}`),
   JR(`決算。保守サービスのうち当期に提供した ${yn(rec)}円を収益に計上する。`,[["契約負債",rec]],[["売上",rec]],["前受収益","役務収益"])]}},
 {id:"k10l2",name:"契約資産",make:lv=>{const a=A(lv,100000,300000),b=A(lv,100000,300000);return[

   JR(`商品A ${yn(a)}円を引き渡した。代金は商品Bの引き渡し後に請求する契約である。`,[["契約資産",a]],[["売上",a]],["売掛金","前受金"]),

 {id:"k10l3",name:"割戻とサービス業",make:lv=>{const s=A(lv,300000,800000),rb=Math.round(s*.02/100)*100,w=A(lv,100000,300000),rv=w+A(lv,50000,200000);return[

   JR(`配達サービスのための人件費 ${yn(w)}円を仕掛品に振り替えた(給料として計上済み)。`,[["仕掛品",w]],[["給料",w]],["役務原価","製品"]),
   JR(`配達サービスが完了し、代金 ${yn(rv)}円を掛けとした。対応する仕掛品 ${yn(w)}円を役務原価に振り替える。`,[["売掛金",rv],["役務原価",w]],[["役務収益",rv],["仕掛品",w]],["売上","売上原価"])]}}

K2({id:"k11",no:11,month:"株式会社 2年目",title:"本支店会計",story:"となり町に支店ができた!本店と支店のお金のやりとりを記録しよう。",color:"#3a5a8a",lessons:[
 {id:"k11l1",name:"本店勘定と支店勘定",make:lv=>{const a=A(lv,100000,500000),b=A(lv,50000,200000);return[
   TALK([["tencho","本店の帳簿には「支店」、支店の帳簿には「本店」という勘定を作るんだよ。貸し借りのメモみたいなものさ。"]],{n:"本店・支店勘定",g:"",d:"本店側の「支店」勘定と、支店側の「本店」勘定は、<br>貸借が逆で金額が一致する。"}),

 {id:"k11l2",name:"支店間の取引",make:lv=>{const a=A(lv,50000,200000);return[
   TALK([["luna","…支店どうしの取引も、本店を通したことにする。本店集中計算制度。"]],null),
   JR(`(本店の仕訳)A支店がB支店に現金 ${yn(a)}円を送金した。本店集中計算制度による。`,[["B支店",a]],[["A支店",a]],["本店","現金"]),
   JR(`(A支店の仕訳)B支店に現金 ${yn(a)}円を送金した。本店集中計算制度による。`,[["本店",a]],[["現金",a]],["B支店","支店"]),
   MC("合併財務諸表を作るとき、本店勘定と支店勘定はどうする?",["相殺して消す","両方とも表示する","資本金に加える"],"相殺して消す","会社の内部のやりとりなので、外部向けの財務諸表には出さない。")]}},
 {id:"k11l3",name:"合併財務諸表",make:lv=>{const h=A(lv,2000000,4000000),s=A(lv,800000,1500000),hc=A(lv,1000000,2000000),sc=A(lv,400000,800000);return[
   CALC(`本店の売上 ${yn(h)}円、支店の売上 ${yn(s)}円(本支店間の取引はない)。合併損益計算書の売上高は?`,"売上高",h+s,`${yn(h)}+${yn(s)}`),
   CALC(`本店の売上原価 ${yn(hc)}円、支店 ${yn(sc)}円。合併後の売上総利益は?(売上高 ${yn(h+s)}円)`,"売上総利益",h+s-hc-sc,`${yn(h+s)}−${yn(hc+sc)}`),

]});
K2({id:"k12",no:12,month:"株式会社 2年目",title:"連結会計",story:"ついにポン吉商店を子会社に!親子まとめて1つの会社として決算書を作る。",color:"#9a2a2a",lessons:[
 {id:"k12l1",name:"資本連結",make:lv=>{const c=r1k(10,30)*100,re=r1k(2,10)*100,pct=rpick([60,70,80]),eq=c+re,par=eq*pct/100,gw=r1k(2,8)*100,cost=par+gw,nci=eq-par;return[
   TALK([["pon","まさか、ぼくの店が子会社になるとは…ポン"],["tencho","親会社の投資(子会社株式)と、子会社の資本を消し合うのが連結の第一歩だよ。"]],{n:"資本連結",g:"",d:"子会社の資本 × 親の持分 と 子会社株式 の差 → のれん<br>子会社の資本 × 他の株主の持分 → 非支配株主持分"}),
   CALC(`子会社の資本金 ${yn(c)}円・利益剰余金 ${yn(re)}円。親会社が${pct}%を ${yn(cost)}円で取得。のれんは?`,"のれん",gw,`(${yn(c)}+${yn(re)})×${pct}%=${yn(par)}、${yn(cost)}−${yn(par)}=${yn(gw)}`),
   CALC(`子会社の資本金 ${yn(c)}円・利益剰余金 ${yn(re)}円。親会社が${pct}%を取得した。非支配株主持分は?`,"非支配株主持分",nci,`${yn(eq)}×${100-pct}%=${yn(nci)}`),
   JR(`支配獲得日の資本連結の仕訳。子会社の資本金 ${yn(c)}円、利益剰余金 ${yn(re)}円、子会社株式 ${yn(cost)}円(持分${pct}%)。`,[["資本金",c],["利益剰余金",re],["のれん",gw]],[["子会社株式",cost],["非支配株主持分",nci]],["資本準備金","繰越利益剰余金"])]}},
 {id:"k12l2",name:"のれん償却と利益の按分",make:lv=>{const gw=r1k(1,9)*1000,am=gw/10,ni=r1k(100,500),pct=rpick([60,70,80]),nci=ni*(100-pct)/100,dv=r1k(50,200),dp=dv*pct/100,dn=dv-dp;return[
   JR(`連結。のれん ${yn(gw)}円を10年で定額法により償却する。`,[["のれん償却",am]],[["のれん",am]],["減価償却費","利益剰余金"]),
   JR(`連結。子会社の当期純利益 ${yn(ni)}円のうち非支配株主の持分(${100-pct}%)を振り替える。`,[["非支配株主に帰属する当期純利益",nci]],[["非支配株主持分",nci]],["のれん","利益剰余金"]),
   JR(`連結。子会社が配当 ${yn(dv)}円を行った(親会社の持分${pct}%)。`,[["受取配当金",dp],["非支配株主持分",dn]],[["剰余金の配当",dv]],["のれん","未払配当金"])]}},
 {id:"k12l3",name:"内部取引と未実現利益",make:lv=>{const s=A(lv,500000,1500000),inv=r1k(50,200),rate=rpick([20,25,30]),un=inv*rate/100,ar=A(lv,100000,300000);return[
   TALK([["luna","…親子間の売買は、グループの中でお金が回っただけ。外部に売ってないから消す。"]],{n:"内部取引の消去",g:"",d:"親子間の売上と仕入(売上原価)を相殺<br>親子間の売掛金と買掛金を相殺<br>子会社の在庫に残る親の利益(未実現利益)も消す"}),
   JR(`連結。親会社から子会社への売上高 ${yn(s)}円を相殺消去する。`,[["売上高",s]],[["売上原価",s]],["売掛金","仕入"]),
   JR(`連結。親会社の子会社に対する売掛金 ${yn(ar)}円を相殺消去する。`,[["買掛金",ar]],[["売掛金",ar]],["売上高","未払金"]),
   CALC(`子会社の期末在庫のうち ${yn(inv)}円は親会社から仕入れたもの。親会社の利益率は${rate}%。未実現利益は?`,"未実現利益",un,`${yn(inv)}×${rate}%=${yn(un)}`),
   JR(`連結。子会社の期末商品に含まれる、親会社が付けた利益(未実現利益)${yn(un)}円を消去する(ダウンストリーム)。`,[["売上原価",un]],[["商品",un]],["売上高","繰越商品"])]}}
]});

K2({id:"k13",no:13,month:"工場編",title:"工業簿記のしくみ",story:"よね屋がオリジナル商品の工場を作った!材料・労務・経費で製品の原価を計算しよう。",color:"#8a5a14",lessons:[
 {id:"k13l1",name:"材料費",make:lv=>{const q=r10(10,50)*10,p=r10(10,50),fr=q*rnd(1,5),cost=q*p+fr,dq=Math.round(q*.7/10)*10,iq=Math.round(q*.2/10)*10,u=cost/q,pp=p+rpick([-3,-2,2,3])*1;return[
   TALK([["robo","ピピッ。工業簿記。材料ヲ買ッテ、使ッテ、製品ニシマス"],["gou","材料を使って筋肉…じゃなくて製品を作るッス!"]],{n:"材料費の流れ",g:"",d:"購入:材料 / 買掛金(引取費用も含める)<br>消費:直接材料費 → 仕掛品、間接材料費 → 製造間接費"}),
   CALC(`材料 ${q}kgを @${yn(p)}円で買い、引取運賃 ${yn(fr)}円を払った。材料の購入原価は?`,"材料",cost,`${q}×${yn(p)}+${yn(fr)}=${yn(cost)}`),
   JR(`材料 ${q}kg(@${yn(p)}円)を掛けで購入し、引取運賃 ${yn(fr)}円を現金で支払った。`,[["材料",cost]],[["買掛金",q*p],["現金",fr]],["仕掛品","製造間接費"]),
   ...(Number.isInteger(u)?[JR(`材料を消費した:直接材料 ${dq}kg、間接材料 ${iq}kg(消費単価 @${yn(u)}円)。`,[["仕掛品",dq*u],["製造間接費",iq*u]],[["材料",(dq+iq)*u]],["製品","賃金"])]:[]),
   MC("製品に直接使った材料の費用は、どの勘定に振り替える?",["仕掛品","製造間接費","製品"],"仕掛品","直接材料費は仕掛品へ。間接材料費は製造間接費へ。")]}},
 {id:"k13l2",name:"労務費と経費",make:lv=>{const rate=r100(10,20),dh=rnd(200,500),ih=rnd(30,100),dep=A(lv,50000,200000);return[
   TALK([["luna","…工場の人の給料は「賃金」。製品を作った時間の分が直接労務費。"]],{n:"労務費",g:"",d:"直接労務費 = 賃率 × 直接作業時間 → 仕掛品<br>間接作業・手待時間など → 製造間接費"}),
   CALC(`賃率 @${yn(rate)}円/時間、直接作業時間 ${dh}時間。直接労務費は?`,"直接労務費",rate*dh,`${yn(rate)}×${dh}=${yn(rate*dh)}`),
   JR(`賃金を消費した:直接作業 ${dh}時間、間接作業 ${ih}時間(賃率 @${yn(rate)}円)。`,[["仕掛品",rate*dh],["製造間接費",rate*ih]],[["賃金",rate*(dh+ih)]],["製品","材料"]),
   JR(`工場の機械の減価償却費 ${yn(dep)}円を計上する(製造間接費として処理)。`,[["製造間接費",dep]],[["減価償却累計額",dep]],["仕掛品","減価償却費"])]}},
 {id:"k13l3",name:"製品ができるまで",make:lv=>{const oh=A(lv,100000,300000),fin=A(lv,500000,1200000),sold=Math.round(fin*.8/1000)*1000;return[
   TALK([["tencho","材料・労務・経費 → 仕掛品 → 製品 → 売上原価。この流れが工業簿記の全部だよ。"]],null),
   JR(`製造間接費 ${yn(oh)}円を製品に配賦した。`,[["仕掛品",oh]],[["製造間接費",oh]],["製品","売上原価"]),
   JR(`製品 ${yn(fin)}円が完成した。`,[["製品",fin]],[["仕掛品",fin]],["売上原価","材料"]),
   JR(`製品のうち原価 ${yn(sold)}円分を販売した(売上原価の振り替え)。`,[["売上原価",sold]],[["製品",sold]],["仕掛品","売上"]),
   MC("完成した製品の原価は、どの勘定からどの勘定へ?",["仕掛品 → 製品","製品 → 仕掛品","材料 → 製品"],"仕掛品 → 製品","作りかけ(仕掛品)が完成して製品になる。")]}}
]});
K2({id:"k14",no:14,month:"工場編",title:"個別原価計算と部門別",story:"お客さんの注文ごとに原価を計算しよう。工場の部門ごとの費用の分け方も。",color:"#5a3a8a",lessons:[
 {id:"k14l1",name:"予定配賦",make:lv=>{const base=rpick([1000,1200,1500,2000]),rate=r100(5,15),bud=base*rate,act=Math.round(base*rpick([.85,.9,.95])),app=act*rate;return[
   TALK([["robo","ピピッ。製造間接費ハ、予定ノ配賦率デ先ニ配リマス"]],{n:"予定配賦",g:"",d:"予定配賦率 = 年間予算 ÷ 基準操業度<br>予定配賦額 = 予定配賦率 × 実際操業度"}),
   CALC(`製造間接費の予算 ${yn(bud)}円、基準操業度 ${yn(base)}時間。予定配賦率は?`,"予定配賦率",rate,`${yn(bud)}÷${yn(base)}=${yn(rate)}`),
   CALC(`予定配賦率 @${yn(rate)}円/時間、実際の直接作業時間 ${yn(act)}時間。予定配賦額は?`,"予定配賦額",app,`${yn(rate)}×${yn(act)}=${yn(app)}`),
   JR(`製造間接費 ${yn(app)}円を予定配賦した。`,[["仕掛品",app]],[["製造間接費",app]],["製品","製造間接費配賦差異"])]}},
 {id:"k14l2",name:"配賦差異の分析",make:lv=>{const base=rpick([1000,2000]),vr=r100(2,6),fix=r1k(250,750)*2,fr=fix/base,act=Math.round(base*rpick([.8,.9])),real=vr*act+fix+(r1k(-30,50)||12000),app=(vr+fr)*act,diff=app-real,allow=vr*act+fix,bud=allow-real,op=fr*(act-base);return[
   TALK([["luna","…予定と実際の差が配賦差異。予算差異と操業度差異に分ける。公式法。"]],{n:"差異分析(公式法)",g:"",d:"予算差異 = 予算許容額 − 実際発生額<br>操業度差異 = 固定費率 × (実際操業度 − 基準操業度)<br>マイナスは不利差異"}),
   ...(Number.isInteger(fr)?[
   CALC(`変動費率 @${yn(vr)}円、固定費予算 ${yn(fix)}円、実際操業度 ${yn(act)}時間。予算許容額は?`,"予算許容額",allow,`${yn(vr)}×${yn(act)}+${yn(fix)}=${yn(allow)}`),
   CALC(`予算許容額 ${yn(allow)}円、実際発生額 ${yn(real)}円。予算差異は?(不利ならマイナスで)`,"予算差異",bud,`${yn(allow)}−${yn(real)}=${yn(bud)}`),
   CALC(`固定費率 @${yn(fr)}円、実際 ${yn(act)}時間、基準 ${yn(base)}時間。操業度差異は?(不利ならマイナスで)`,"操業度差異",op,`${yn(fr)}×(${yn(act)}−${yn(base)})=${yn(op)}`)]:[]),
   MC("予定配賦額より実際発生額が多いとき、その差異は?",["不利差異(借方差異)","有利差異(貸方差異)"],"不利差異(借方差異)","思ったより費用がかかった=不利。")]}},
 {id:"k14l3",name:"部門別配賦",make:lv=>{const aux=r1k(100,300),a=rnd(1,4),b=5-a,toA=aux*a/5;return[
   TALK([["tencho","工場には、製品を作る部門(切削・組立)と、それを助ける部門(修繕・動力)があるんだ。助ける部門の費用を作る部門に配るよ。"]],{n:"直接配賦法",g:"",d:"補助部門費を、製造部門だけに配賦する方法。<br>補助部門どうしのやりとりは無視する。"}),
   CALC(`修繕部門費 ${yn(aux)}円を、切削部門と組立部門に修繕時間の比 ${a}:${b} で配賦する。切削部門への配賦額は?`,"切削部門",toA,`${yn(aux)}×${a}/5=${yn(toA)}`),
   MC("直接配賦法で、補助部門から補助部門への用役提供は?",["無視する","配賦する","2回配賦する"],"無視する","製造部門にだけ配る。")]}}
]});
K2({id:"k15",no:15,month:"工場編",title:"総合原価計算",story:"人気商品を大量生産!同じものを作り続けるときの原価計算。",color:"#1f5a7a",lessons:[
 {id:"k15l1",name:"平均法",make:lv=>{const bq=rnd(1,4)*100,cq=rnd(8,15)*100,eq=rnd(1,4)*100,tot=bq+cq,fq=tot-eq,unit=r10(30,80),bm=bq*(unit-r10(1,5)),cm=unit*tot-bm;
   const em=Number.isInteger(unit)?unit*eq:Math.round(unit*eq);return[
   TALK([["robo","ピピッ。総合原価計算。月初ト当月ノ原価ヲ、完成品ト月末仕掛品ニ分ケマス"],["luna","…材料が最初に全部入るなら、材料費は数量の比でそのまま分ける。"]],{n:"平均法",g:"",d:"(月初+当月)の原価 ÷ (完成品+月末)の数量<br>= 平均単価 → 月末仕掛品にかける"}),
   ...(Number.isInteger(unit)?[TBL("仕掛品のボックス図(材料費・始点投入・平均法)をうめよう。",["","数量","材料費"],[["月初仕掛品",bq,bm],["当月投入",cq,cm],["完成品",fq,B_(bm+cm-em)],["月末仕掛品",eq,B_(em)]],`平均単価 (${yn(bm)}+${yn(cm)})÷${tot}個=${yn(unit)}円`,"総合原価計算")]:[
     CALC(`月初 ${bq}個 ${yn(bm)}円、当月投入 ${cq}個 ${yn(cm)}円、月末 ${eq}個(材料は始点投入・平均法)。月末仕掛品の材料費は?(円未満四捨五入)`,"月末仕掛品",em,`(${yn(bm)}+${yn(cm)})÷${tot}×${eq}`)]),

 {id:"j9l2",name:"新株予約権",make:lv=>{const n=rpick([10,20,50]),w=r1k(1,5)*10,ex=r1k(10,50)*10,tw=n*w,tx=n*ex,tot=tw+tx;return[
   TALK([["tencho","「決まった値段で株を買える権利」を売ったら「新株予約権」。権利が使われたら資本金に振り替えるよ。"]],{n:"新株予約権",g:"純資産",d:"発行:当座預金 / 新株予約権<br>権利行使:新株予約権+払込金 → 資本金(・資本準備金)"}),
   JR(`新株予約権 ${n}個を1個 ${yn(w)}円で発行し、払込金は当座預金とした。`,[["当座預金",tw]],[["新株予約権",tw]],["資本金","前受金"]),
   JR(`新株予約権 ${n}個すべてが行使され、払込金 ${yn(tx)}円が当座預金に入金された。全額を資本金とする。`,[["当座預金",tx],["新株予約権",tw]],[["資本金",tot]],["資本準備金","自己株式"])]}},
 {id:"j9l3",name:"ストック・オプション",make:lv=>{const n=rpick([50,100,200]),pr=r100(5,20)*3,per=rpick([24,36]),m=12,cost=n*pr*m/per;return[
   TALK([["gou","社員にストック・オプションが配られたッス!"],["luna","…会社側は、権利が確定するまでの勤務期間にわたって費用にする。株式報酬費用。"]],{n:"ストック・オプション",g:"",d:"各期の費用 = 公正な評価単価 × 付与数 × 経過月数 ÷ 対象勤務期間"}),
   CALC(`ストック・オプション ${n}個、公正な評価単価 ${yn(pr)}円、対象勤務期間 ${per}か月。当期(12か月)の費用は?`,"株式報酬費用",cost,`${yn(pr)}×${n}×12/${per}=${yn(cost)}`),
   JR(`決算。株式報酬費用 ${yn(cost)}円を計上する。`,[["株式報酬費用",cost]],[["新株予約権",cost]],["給料","資本金"])]}}
]});
K1({id:"j10",no:10,month:"上場編",title:"社債",story:"工場の増設資金を社債で調達。利息法で帳簿価額を追いかけよう。",color:"#2a7a6a",lessons:[
 {id:"j10l1",name:"発行と利息法",make:lv=>{const F=rpick([10000000,20000000]),c=rpick([1,2]),e=c+1,P=F-r1k(10,90)*10,int=P*e/100,cp=F*c/100,am=int-cp;return[
   TALK([["tencho","額面より安く発行した社債は、満期までに帳簿価額を額面に近づけていく。1級は利息法だよ。"]],null),
   JR(`額面 ${yn(F)}円の社債を ${yn(P)}円で発行し、当座預金に入金された。`,[["当座預金",P]],[["社債",P]],["社債利息","資本金"]),
   CALC(`帳簿価額 ${yn(P)}円、実効利子率 ${e}%。利息配分額(社債利息)は?`,"社債利息",int,`${yn(P)}×${e}%=${yn(int)}`),
   JR(`利払日。クーポン ${yn(cp)}円を当座預金から支払い、償却額 ${yn(am)}円を計上する(社債利息 ${yn(int)}円)。`,[["社債利息",int]],[["当座預金",cp],["社債",am]],["支払利息","社債発行費"])]}},
 {id:"j10l2",name:"定額法と月割",make:lv=>{const F=10000000,P=F-r1k(12,60)*5,y=5,m=rpick([6,9]),am=(F-P)/y*m/12;return[
   CALC(`額面 ${yn(F)}円を ${yn(P)}円で発行(償還期間 ${y}年、定額法)。期中に発行し、決算まで ${m}か月。当期の償却額は?`,"償却額",am,`(${yn(F)}−${yn(P)})÷${y}×${m}/12=${yn(am)}`),
   JR(`決算。社債の償却額 ${yn(am)}円を計上する。`,[["社債利息",am]],[["社債",am]],["社債発行費償却","支払利息"])]}},
 {id:"j10l3",name:"買入償還",make:lv=>{const bv=r1k(450,490)*10,pay=bv+(r1k(-80,80)||20000),gl=bv-pay;return[
   TALK([["luna","…満期前に市場から社債を買い戻したら、帳簿価額と支払額の差が社債償還益(損)。"]],null),
   CALC(`買入償還する社債の帳簿価額 ${yn(bv)}円、支払額 ${yn(pay)}円。社債償還損益は?(益は+、損は−)`,"社債償還損益",gl,`${yn(bv)}−${yn(pay)}=${yn(gl)}`),
   JR(`社債(帳簿価額 ${yn(bv)}円)を ${yn(pay)}円で買入償還し、当座預金から支払った。`,[["社債",bv]].concat(gl<0?[["社債償還損",-gl]]:[]),[["当座預金",pay]].concat(gl>0?[["社債償還益",gl]]:[]),[gl>0?"社債償還損":"社債償還益","社債利息"])]}}
]});
K1({id:"j11",no:11,month:"M&A編",title:"企業結合",story:"ポン吉商店に続いて、ライバルの問屋を合併!企業結合の会計へ。",color:"#3a5a8a",lessons:[
 {id:"j11l1",name:"合併とのれん",make:lv=>{const n=rpick([1000,2000,5000]),p=r100(5,20)*10,cost=n*p,as=Math.round(cost*rpick([1.4,1.6,1.8])/10000)*10000,li=Math.round(as*rpick([.4,.5])/10000)*10000,net=as-li,gw=cost-net;return[
   TALK([["pon","ぼくの店に続いて、となりの問屋まで…ポン"],["tencho","合併したら、受け入れた資産・負債は時価で、払った対価との差がのれんだよ。"]],{n:"取得の会計処理",g:"",d:"取得原価 = 交付した株式の時価<br>のれん = 取得原価 − (資産の時価 − 負債の時価)"}),
   CALC(`株式 ${yn(n)}株(時価 @${yn(p)}円)を交付して合併した。取得原価は?`,"取得原価",cost,`${yn(n)}×${yn(p)}=${yn(cost)}`),
   CALC(`受け入れた資産の時価 ${yn(as)}円、負債の時価 ${yn(li)}円。のれんは?(負ののれんならマイナス)`,"のれん",gw,`${yn(cost)}−(${yn(as)}−${yn(li)})=${yn(gw)}`),
   ...(gw>0?[JR(`合併の仕訳(諸資産 ${yn(as)}円、諸負債 ${yn(li)}円、増加する資本はすべて資本金)。`,[["諸資産",as],["のれん",gw]],[["諸負債",li],["資本金",cost]],["負ののれん発生益","資本準備金"])]:[])]}},
 {id:"j11l2",name:"負ののれん",make:lv=>{const net=r1k(500,900)*10,cost=net-r1k(20,100)*10;return[
   TALK([["niya","安く買えたら得とか当たり前で草"],["luna","…取得原価が純資産の時価より小さいときは「負ののれん発生益」。発生した年の利益にする。"]],null),
   CALC(`取得原価 ${yn(cost)}円、受け入れた純資産の時価 ${yn(net)}円。負ののれん発生益は?`,"負ののれん発生益",net-cost,`${yn(net)}−${yn(cost)}=${yn(net-cost)}`),
   MC("負ののれん発生益の表示区分は?",["特別利益","営業外収益","純資産"],"特別利益","発生した期の特別利益として処理する。")]}},
 {id:"j11l3",name:"株式交換",make:lv=>{const n=rpick([1000,2000]),p=r100(10,30)*10,cost=n*p;return[
   TALK([["tencho","株式交換なら、相手の会社の株を全部もらって、こっちの株を渡す。もらった株は子会社株式だよ。"]],null),
   JR(`株式交換によりC社を完全子会社とし、自社株式 ${yn(n)}株(時価 @${yn(p)}円)を交付した。増加する資本はすべて資本金とする。`,[["子会社株式",cost]],[["資本金",cost]],["のれん","その他有価証券"]),
   MC("株式交換で完全親会社が受け入れる子会社株式の取得原価は?(取得のケース)",["交付した株式の時価","子会社の純資産の帳簿価額","子会社株式の額面"],"交付した株式の時価","取得の場合は対価の時価で測定する。")]}}
]});
K1({id:"j12",no:12,month:"M&A編",title:"連結会計の応用",story:"子会社・関連会社が増えてグループ経営へ。持分法や段階取得もマスターしよう。",color:"#9a2a2a",lessons:[
 {id:"j12l1",name:"子会社の時価評価",make:lv=>{const lnd=r1k(50,200)*10,fv=lnd+r1k(10,80)*10,d=fv-lnd,t=d*30/100;return[
   TALK([["luna","…支配を獲得したら、子会社の資産・負債を時価に評価し直す。評価差額には税効果も。"]],null),
   CALC(`子会社の土地(帳簿価額 ${yn(lnd)}円)の時価は ${yn(fv)}円。税率30%。評価差額(税効果後)は?`,"評価差額",d-t,`${yn(d)}×(1−30%)=${yn(d-t)}`),
   JR(`連結。子会社の土地を時価評価する(税率30%)。`,[["土地",d]],[["繰延税金負債",t],["評価差額",d-t]],["のれん","利益剰余金"])]}},
 {id:"j12l2",name:"持分法",make:lv=>{const ni=r1k(100,500)*10,r=rpick([20,25,30,40]),sh=ni*r/100,dv=r1k(20,100)*10,dsh=dv*r/100;return[
   TALK([["tencho","20%以上の関連会社は、連結せずに「持分法」で、利益の持分だけ投資の金額に足すんだよ。"]],{n:"持分法",g:"",d:"関連会社の純利益 × 持分 → 投資有価証券を増やす<br>(持分法による投資損益)<br>配当を受けたら投資有価証券を減らす"}),
   CALC(`関連会社の当期純利益 ${yn(ni)}円、持分 ${r}%。持分法による投資利益は?`,"投資利益",sh,`${yn(ni)}×${r}%=${yn(sh)}`),
   JR(`持分法。関連会社の当期純利益のうち持分 ${yn(sh)}円を計上する。`,[["投資有価証券",sh]],[["持分法による投資損益",sh]],["受取配当金","子会社株式"]),
   JR(`持分法。関連会社から配当 ${yn(dsh)}円を受け取った(受取配当金として計上済み)。`,[["受取配当金",dsh]],[["投資有価証券",dsh]],["持分法による投資損益","利益剰余金"])]}},
 {id:"j12l3",name:"段階取得",make:lv=>{const bv=r1k(100,400)*10,fv=bv+r1k(10,80)*10;return[
   TALK([["robo","ピピッ。前カラ持ッテイタ株ニ買イ増シテ子会社ニ。前ノ株ハ時価ニ評価シ直シマス"]],{n:"段階取得",g:"",d:"支配獲得日の時価で、以前から持っていた株式を評価し直す。<br>差額 → 段階取得に係る差益(差損)"}),
   CALC(`以前から持っていたS社株式(帳簿価額 ${yn(bv)}円)の支配獲得日の時価は ${yn(fv)}円。段階取得に係る差益は?`,"段階取得に係る差益",fv-bv,`${yn(fv)}−${yn(bv)}=${yn(fv-bv)}`),
   JR(`連結。段階取得により、以前から持っていたS社株式(帳簿価額 ${yn(bv)}円)を支配獲得日の時価 ${yn(fv)}円に評価替えする。`,[["子会社株式",fv-bv]],[["段階取得に係る差益",fv-bv]],["のれん","その他有価証券評価差額金"])]}}
]});
/* ---------- 工業簿記・原価計算 ---------- */
K1({id:"j13",no:13,month:"工場拡大編",title:"費目別計算の応用",story:"工場が3つに増えた!材料副費、予定賃率、相互配賦…細かい計算に強くなろう。",color:"#8a5a14",lessons:[
 {id:"j13l1",name:"材料副費",make:lv=>{const pr=r1k(500,2000),r=rpick([3,4,5]),app=pr*r/100,act=app+(r100(-50,80)||300);return[
   TALK([["robo","ピピッ。材料副費(引取運賃・検収費ナド)ヲ予定配賦シマス"]],null),
   CALC(`材料の購入代価 ${yn(pr)}円、材料副費の予定配賦率 ${r}%。予定配賦額は?`,"予定配賦額",app,`${yn(pr)}×${r}%=${yn(app)}`),
   CALC(`材料の購入代価 ${yn(pr)}円、材料副費の予定配賦率 ${r}%。材料副費の実際発生額は ${yn(act)}円。材料副費差異は?(有利+・不利−)`,"材料副費差異",app-act,`${yn(app)}−${yn(act)}=${yn(app-act)}`)]}},
 {id:"j13l2",name:"予定賃率と賃率差異",make:lv=>{const r=r100(12,20),h=rnd(400,900),app=r*h,act=app+(r100(-60,60)||2000),pre=r1k(50,150),cur=r1k(50,150),paid=act+pre-cur,diff=app-act;return[
   TALK([["luna","…実際の賃金 = 当月支払 − 前月未払 + 当月未払。予定賃率で消費した額との差が賃率差異。"]],null),
   CALC(`当月支払高 ${yn(paid)}円、前月未払 ${yn(pre)}円、当月未払 ${yn(cur)}円。当月の実際消費賃金は?`,"実際消費額",act,`${yn(paid)}−${yn(pre)}+${yn(cur)}=${yn(act)}`),
   CALC(`予定賃率 @${yn(r)}円、実際作業時間 ${h}時間。賃率差異は?(有利+・不利−、実際消費額 ${yn(act)}円)`,"賃率差異",diff,`${yn(r)}×${h}=${yn(app)}、${yn(app)}−${yn(act)}=${yn(diff)}`)]}},
 {id:"j13l3",name:"相互配賦法(簡便法)",make:lv=>{const A=r1k(100,300)*100,B=r1k(100,300)*100,ab=rpick([10,20]),toB=A*ab/100;return[
   TALK([["tencho","補助部門どうしもお互いに助け合ってる。1回目はお互いにも配って、2回目は製造部門だけに配るのが簡便法だよ。"]],{n:"相互配賦法(簡便法)",g:"",d:"第1次配賦:補助部門にも配賦する<br>第2次配賦:受け取った分を製造部門だけに配賦"}),
   CALC(`動力部門費 ${yn(A)}円。第1次配賦で修繕部門に ${ab}%を配賦する。修繕部門への配賦額は?`,"配賦額",toB,`${yn(A)}×${ab}%=${yn(toB)}`),
   MC("相互配賦法(簡便法)の第2次配賦は?",["製造部門だけに配賦","補助部門にも配賦","配賦しない"],"製造部門だけに配賦","第2次配賦は直接配賦法と同じ。")]}}
]});
K1({id:"j14",no:14,month:"工場拡大編",title:"総合原価計算の応用",story:"工程が2つ、製品も等級ごとに…総合原価計算の1級バージョン。",color:"#5a3a8a",lessons:[
 {id:"j14l1",name:"工程別(累加法)",make:lv=>{const q=rnd(5,10)*100,u1=r10(20,60),u2=r10(10,40),f1=q*u1,f2=q*(u1+u2);return[
   TALK([["robo","ピピッ。第1工程ノ完成品ハ、第2工程デ「前工程費」ニナリマス"]],{n:"累加法",g:"",d:"第1工程の完成品原価 → 第2工程の前工程費として加算<br>(始点投入の材料と同じ扱い)"}),
   CALC(`第1工程の完成品 ${q}個、単位原価 @${yn(u1)}円。第2工程に振り替える前工程費は?`,"前工程費",f1,`${q}×${yn(u1)}=${yn(f1)}`),
   CALC(`第1工程から前工程費 ${yn(f1)}円(${q}個分)を受け入れた。第2工程で1個あたり ${yn(u2)}円の加工費がかかり、${q}個すべて完成(仕掛品なし)。完成品原価は?`,"完成品原価",f2,`${yn(f1)}+${q}×${yn(u2)}=${yn(f2)}`)]}},
 {id:"j14l2",name:"等級別計算",make:lv=>{const qa=rnd(2,6)*100,qb=rnd(2,6)*100,ka=1,kb=rpick([0.5,0.8]),pa=qa*ka,pb=qb*kb,unit=r10(10,50),tot=(pa+pb)*unit;return[
   TALK([["luna","…大きさ違いの製品は等価係数で重みをつけて、積数の比で原価を分ける。"]],{n:"等級別総合原価計算",g:"",d:"積数 = 完成品数量 × 等価係数<br>各等級の原価 = 完成品原価 × 積数の比"}),
   CALC(`1級品 ${qa}個(等価係数 ${ka})、2級品 ${qb}個(等価係数 ${kb})。2級品の積数は?`,"積数",pb,`${qb}×${kb}=${pb}`),
   CALC(`完成品原価 ${yn(tot)}円を積数の比(${pa}:${pb})で分ける。2級品の原価は?`,"2級品",pb*unit,`${yn(tot)}×${pb}/${pa+pb}=${yn(pb*unit)}`)]}},
 {id:"j14l3",name:"仕損(度外視法)",make:lv=>{const in_=rnd(10,20)*100,sp=rnd(1,4)*10,eq=rnd(2,5)*100,fq=in_-sp-eq,u=r10(20,50),cost=in_*u,good=fq+eq,unit=cost/good,emv=Math.round(unit*eq);return[
   TALK([["tencho","仕損が工程の始点や途中の早い段階で出たら、完成品と月末仕掛品の両方で負担するんだよ(度外視法)。"]],null),
   CALC(`材料費 ${yn(cost)}円(始点投入)、完成品 ${fq}個、月末仕掛品 ${eq}個、正常仕損 ${sp}個(始点発生・度外視法)。月末仕掛品の材料費は?(円未満四捨五入)`,"月末仕掛品",emv,`${yn(cost)}÷(${fq}+${eq})×${eq}=${yn(emv)}`),
   MC("度外視法とは?",["仕損品の数量を無視して計算し、自動的に良品に負担させる","仕損費を別に計算する","仕損品を製品として売る"],"仕損品の数量を無視して計算し、自動的に良品に負担させる","非度外視法は、正常仕損費を別に計算して配分する。")]}}
]});
K1({id:"j15",no:15,month:"工場拡大編",title:"標準原価計算の応用",story:"差異分析をもっとくわしく。どこで、なぜ、損したのかを突き止めよう。",color:"#1f5a7a",lessons:[
 {id:"j15l1",name:"製造間接費の四分法",make:lv=>{const base=rpick([1000,2000]),vr=r100(2,5),fr=r100(2,6),fix=fr*base,ah=base-rnd(1,4)*50,sh=ah-rnd(1,4)*20,act=vr*ah+fix+(r1k(-30,30)||8000),bud=vr*ah+fix-act,ve=vr*(sh-ah),fe=fr*(sh-ah),op=fr*(ah-base);return[
   TALK([["luna","…四分法。予算差異・変動費能率差異・固定費能率差異・操業度差異。"]],{n:"四分法",g:"",d:"予算差異 = 予算許容額(実際時間) − 実際発生額<br>能率差異 = 配賦率 × (標準時間 − 実際時間)<br>操業度差異 = 固定費率 × (実際時間 − 基準操業度)"}),

/* ===== 大きな表は「1問=空欄4つまで」に分ける(模擬試験は分けない) ===== */
const TBL_MAX=4,TBL_PARTS=3;
function rdTblSplit(s){
  if(!s||s.t!=="tbl"||s.sec)return[s];
  const bl=[];s.rows.forEach((r,ri)=>r.forEach((c,ci)=>{if(c&&typeof c==="object")bl.push([ri,ci])}));
  if(bl.length<=TBL_MAX)return[Object.assign({},s,{hiR:[...new Set(bl.map(x=>x[0]))]})];
  const groups=[];let cur=[];
  const rowsB={};bl.forEach(x=>(rowsB[x[0]]=rowsB[x[0]]||[]).push(x));
  Object.keys(rowsB).map(Number).sort((a,b)=>a-b).forEach(ri=>{let rb=rowsB[ri];
    while(rb.length>TBL_MAX){if(cur.length){groups.push(cur);cur=[]}groups.push(rb.slice(0,TBL_MAX));rb=rb.slice(TBL_MAX)}
    if(cur.length+rb.length>TBL_MAX){groups.push(cur);cur=[]}cur=cur.concat(rb)});
  if(cur.length)groups.push(cur);
  let pick=groups.map((_,i)=>i);
  if(groups.length>TBL_PARTS){const st=(groups.length-1)/(TBL_PARTS-1);pick=Array.from({length:TBL_PARTS},(_,i)=>Math.round(i*st))}
  return pick.map((gi,k)=>{const g=groups[gi],key=new Set(g.map(x=>x[0]+"-"+x[1]));
    const rows=s.rows.map((r,ri)=>r.map((c,ci)=>c&&typeof c==="object"&&!key.has(ri+"-"+ci)?c.a:c));
    return Object.assign({},s,{rows,hiR:[...new Set(g.map(x=>x[0]))],part:[k+1,pick.length],
      q:s.q.replace(/を完成させよう。|の空欄をうめよう。|をうめよう。/,"の<b>光っている行</b>をうめよう。")})});
}
/* ===== 取引の文章を表にする(「5日 仕入 40個 @290円」のような並び) ===== */
function txTable(q){
  const re=/(前月繰越|前期繰越|\d+日\s*(?:仕入|売上|払出|受入|返品))\s*(\d[\d,]*)個(?:\s*@\s*([\d,]+)円)?/g;
  const m=[...String(q).matchAll(re)];if(m.length<3)return q;
  const head=q.slice(0,m[0].index).replace(/[、。\s]+$/,""),tail=q.slice(m[m.length-1].index+m[m.length-1][0].length).replace(/^[、。\s]+/,"");
  const rows=m.map(x=>{const lab=x[1].replace(/\s+/," ");const d=(lab.match(/^(\d+)日/)||[])[1]||"1",kind=lab.replace(/^\d+日\s*/,"");
    return`<tr class="${/売上|払出/.test(kind)?"out":""}"><td>${d}日</td><td>${kind}</td><td class="n">${x[2]}個</td><td class="n">${x[3]?"@"+x[3]:"―"}</td></tr>`}).join("");
  return`${head?`<div class="txh">${head}</div>`:""}<table class="txt"><thead><tr><th>日付</th><th>内容</th><th>数量</th><th>単価</th></tr></thead><tbody>${rows}</tbody></table>${tail?`<div class="txq">${tail}</div>`:""}`}

    const img=cv.width?cv.getContext("2d").getImageData(0,0,cv.width,cv.height):null;cv.width=Math.round(w*r);cv.height=Math.round(hh*r);wrap.style.height=hh+"px";const x=cv.getContext("2d");x.setTransform(r,0,0,r,0,0);if(img)x.putImageData(img,0,0)};

function babDur(ch,text){const P=BAB[ch];if(!P)return 0;let t=0;for(const s of babParse(text)){if(s.p){t+=P.d*1.6*s.p;continue}const d=P.d*(s.long?1.9:1)*(s.laugh?.7:1)*(s.ex?1.25:1);t+=d*(s.laugh?1.05:1.12)}return t}

/* el に html を1文字ずつ表示。戻り値 {skip()} */
function typeOut(el,html,who,done){
  el.innerHTML=html;const nodes=[];const walk=n=>{n.childNodes.forEach(c=>{if(c.nodeType===3){nodes.push([c,c.nodeValue]);c.nodeValue=""}else walk(c)})};walk(el);
  const plain=nodes.map(x=>x[1]).join(""),total=plain.length;
  const vk=voiceKey(who),voiceOn=vk&&sndOn("voice")&&SND.ctx;
  if(voiceOn)try{vSay(vk,plain)}catch(e){}
  const dur=voiceOn?babDur(vk,plain)*1000:total*38;const per=Math.max(18,Math.min(90,dur/Math.max(1,total)));
  let k=0,fin=false,tm=null;el.classList.add("typing");
  const put=n=>{let left=n;for(const [node,full] of nodes){const L=full.length;if(left>=L){node.nodeValue=full;left-=L}else{node.nodeValue=full.slice(0,Math.max(0,left));left=0}}};
  const end=()=>{if(fin)return;fin=true;clearTimeout(tm);put(total);el.classList.remove("typing");done&&done()};
  const step=()=>{if(fin)return;k++;put(k);if(k>=total)return end();const c=plain[k-1];tm=setTimeout(step,per*(/[、。!?!?…]/.test(c)?3.2:1))};
  if(!total)end();else tm=setTimeout(step,per);
  return{skip:()=>{if(!fin){try{if(_babG)_babG.gain.value=0}catch(e){}end()}},get done(){return fin}};
}

function rdChId(){return RD&&RD.o&&RD.o.ci!=null?ROAD[RD.o.ci].id:null}
function rdSpotWho(s){const c=CHCAST[rdChId()];return (c&&c.spot)||s.who||"robo"}
function rdReact(ok){if(boss3())return"";const c=CHCAST[rdChId()];const who=(c&&c.react)||rpick(Object.keys(REACT));const R=REACT[who];if(!R)return"";const [t,f]=rpick(ok?R.ok:R.ng);
  return`<div class="rdrx">${castFace(who,f,"sm")}<div class="rdbb">${t}</div></div>`}
function rdRowName(s,r){const row=s.rows[r];return s.cols[0]==="日付"?`${row[0]}日 ${row[1]}`:(row[0]||row[1]||"")}
function rdTblScore(s,v){let ok=0,n=0;s.rows.forEach((row,ri)=>row.forEach((c,ci)=>{if(c&&typeof c==="object"){n++;if(v&&Math.abs((v[ri+"-"+ci]??NaN)-c.a)<0.5)ok++}}));return[ok,n]}
function rdAnswerText(s,v){

    const [a,b]=rdTblScore(s,v);return`<div style="font-size:13px">${a}/${b} か所 正解</div>`+out.slice(0,8).join("<br>")+(out.length>8?`<br>ほか ${out.length-8}か所`:"")}
  const jt=(L,R)=>`${L.map(x=>`${x[0]} ${yn(x[1])}`).join("<br>")}<span class="rdsl">/</span>${R.map(x=>`${x[0]} ${yn(x[1])}`).join("<br>")}`;
  if(s.t==="sort")return`${s.acct} は <b>${ACCT[s.acct]}</b>(${GSIDE[ACCT[s.acct]]==="左"?"増えたら左":"増えたら右"})`;
  if(s.t==="mc")return s.ans;
  if(s.t==="lr")return`左:${s.L.join("・")} / 右:${s.R.join("・")}`;

  if(s.t==="calc")return`${yn(s.ans)}円`;
  if(s.t==="spot")return`まちがいは「${s.rows[s.bad[0]][s.bad[1]]}」`;
  return"";
}
function rdGrade(s,v){
  if(s.t==="sort")return v===ACCT[s.acct];
  if(s.t==="mc")return v===s.ans;
  if(s.t==="lr"){const L=[],R=[];for(const i in v)(v[i]==="L"?L:R).push(s.ch[i]);const eq=(a,b)=>a.length===b.length&&a.slice().sort().join()===b.slice().sort().join();return eq(L,s.L)&&eq(R,s.R)}
  if(s.t==="jr"){const pairs=sd=>{const o=[];for(let i=0;i<v.length;i+=2)if(v[i].sd===sd)o.push(v[i].v+":"+v[i+1].v);return o.sort().join()};
    return pairs("L")===s.L.map(x=>x[0]+":"+x[1]).sort().join()&&pairs("R")===s.R.map(x=>x[0]+":"+x[1]).sort().join()}
  if(s.t==="calc")return Math.abs(v-s.ans)<0.5;
  if(s.t==="spot")return v[0]===s.bad[0]&&v[1]===s.bad[1];
  if(s.t==="tbl"){const [a,b]=rdTblScore(s,v);return a===b}
