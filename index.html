<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ボキバトル 1級</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1424;--panel:#172036;--panel2:#1f2a44;--line:#2c3a5c;--ink:#eef3ff;--mute:#8d9bbd;
--neon:#39ff9a;--gold:#ffd23f;--red:#ff5d6c;--blue:#4da3ff;--pink:#ff6ec7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"M PLUS Rounded 1c",system-ui,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font-family:inherit;cursor:pointer}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.wrap{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
/* title */
.title{padding:28px 20px 30px}
.logo{text-align:center;margin:10px 0 6px}
.logo h1{margin:0;font-size:40px;font-weight:800;letter-spacing:.04em;background:linear-gradient(90deg,var(--neon),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo p{margin:4px 0 0;color:var(--mute);font-weight:700;font-size:13px;letter-spacing:.2em}
.mode{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--panel);border-radius:18px;padding:16px 18px;margin-top:14px;color:var(--ink);position:relative;overflow:hidden}
.mode:active{transform:scale(.985)}
.mode b{display:block;font-size:20px}
.mode span{font-size:13px;color:var(--mute);line-height:1.6;display:block;margin-top:2px}
.mode .best{position:absolute;right:16px;top:16px;font-size:13px;color:var(--gold)}
.mode.ta{border-color:#2f6b55}.mode.ta b{color:var(--neon)}
.mode.sa{border-color:#6b2f5f}.mode.sa b{color:var(--pink)}
.code{margin-top:22px;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:14px 16px}
.code label{font-size:13px;color:var(--mute);font-weight:700}
.code .row{display:flex;gap:10px;margin-top:8px;align-items:center}
.code input{flex:1;min-width:0;background:var(--bg);border:2px solid var(--line);border-radius:12px;color:var(--ink);font:800 22px "JetBrains Mono",monospace;padding:8px 12px;letter-spacing:.2em}
.code small{display:block;color:var(--mute);font-size:12px;margin-top:8px;line-height:1.6}
.sbtn{border:2px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:12px;padding:10px 12px;font-weight:800;font-size:13px}
.recs{margin-top:22px}
.recs h3{font-size:14px;color:var(--mute);margin:0 0 8px}
.rec{display:flex;justify-content:space-between;padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px}
.rec .r{font-weight:800}
.empty{color:var(--mute);font-size:13px;padding:8px 0}
.rules{margin-top:22px;color:var(--mute);font-size:12px;line-height:1.8}
/* countdown */
.cd{flex:1;display:flex;align-items:center;justify-content:center;font:800 120px "JetBrains Mono",monospace;color:var(--neon)}
.cd span{animation:cdp .9s ease-out}
@keyframes cdp{0%{transform:scale(2);opacity:0}30%{opacity:1}100%{transform:scale(.9);opacity:.6}}
/* game */
.game{display:flex;flex-direction:column;height:100vh;height:100dvh}
.game,.game *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.game textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
.game button,.game canvas{touch-action:manipulation}
.game #cv{touch-action:none}
.hud{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#0a0f1c;border-bottom:2px solid var(--line)}
.hud .t{font:800 30px "JetBrains Mono",monospace;color:var(--neon);letter-spacing:.02em}
.hud .t.warn{color:var(--red)}
.hud .p{font-weight:800;color:var(--mute);font-size:14px;text-align:right;line-height:1.3}
.hud .p b{color:var(--ink);font-size:18px}
.hud .x{background:none;border:none;color:var(--mute);font-size:22px;padding:0 6px}
.pen{color:var(--red);font-size:12px}
.prob{flex:1;overflow-y:auto;padding:12px 14px 8px;-webkit-overflow-scrolling:touch}
.cat{display:inline-block;font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--panel2);color:var(--blue);margin-bottom:6px}
.ptitle{font-size:16px;font-weight:800;margin:2px 0 10px;line-height:1.5;white-space:pre-line}
.data{width:100%;border-collapse:collapse;background:var(--panel);border-radius:12px;overflow:hidden;font-size:14px;margin-bottom:12px}
.data td{padding:7px 10px;border-bottom:1px solid var(--line)}
.data td:last-child{text-align:right;font-family:"JetBrains Mono",monospace;font-weight:600}
.data tr:last-child td{border-bottom:none}
.sheet{background:#fdfcf6;color:#1e2433;border-radius:12px;padding:6px 12px}
.ln{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px dashed #d9d4bd;font-weight:700;font-size:14px;flex-wrap:wrap}
.ln:last-child{border-bottom:none}
.ln .lab{flex:1 1 auto}
.blank{min-width:120px;min-height:38px;border:2px solid #b9c3d8;background:#fff;border-radius:8px;font:800 17px "JetBrains Mono",monospace;color:#1e2433;text-align:right;padding:4px 10px;display:inline-flex;flex-direction:column;align-items:flex-end;justify-content:center}
.blank.ch{min-width:72px;text-align:center;align-items:center;font-family:"M PLUS Rounded 1c",sans-serif}
.blank.on{border-color:var(--blue);box-shadow:0 0 0 3px rgba(77,163,255,.35)}
.blank .pv{font-size:11px;color:#6b7590;font-weight:600}
.blank.ok{border-color:#1fbf6c;background:#e6fff1}
.blank.ng{border-color:var(--red);background:#ffecee}
.blank .ca{font-size:12px;color:#1fbf6c;font-weight:800}
.unit{font-size:12px;color:#6b7590;margin-left:2px}
.note{font-size:11.5px;color:var(--mute);margin:8px 2px 0;line-height:1.6}
/* keypad */
.pad{background:#0a0f1c;border-top:2px solid var(--line);padding:8px 8px 10px}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.k{border:none;border-radius:10px;background:var(--panel2);color:var(--ink);font:800 20px "JetBrains Mono",monospace;padding:11px 0}
.k:active{background:var(--line)}
.k.op{color:var(--blue);background:#18233c}
.k.fn{font-size:14px;font-family:"M PLUS Rounded 1c",sans-serif;color:var(--mute)}
.acts{display:flex;gap:6px;margin-top:6px}
.acts .k{flex:1;font-size:15px;font-family:"M PLUS Rounded 1c",sans-serif}
.k.go{background:var(--neon);color:#062413}
.k.nx{background:#24365d;color:var(--ink)}
.chs{display:flex;gap:8px;margin-bottom:6px}
.chs .k{flex:1;font-family:"M PLUS Rounded 1c",sans-serif;font-size:17px;background:#2a3554}
/* feedback */
.fb{position:fixed;inset:auto 0 0 0;max-width:560px;margin:0 auto;background:var(--panel);border-top:3px solid var(--neon);border-radius:20px 20px 0 0;padding:16px 18px 22px;z-index:20;animation:up .25s ease-out;max-height:70vh;overflow-y:auto}
.fb.bad{border-color:var(--red)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.fb h3{margin:0 0 6px;font-size:20px}
.fb.good h3{color:var(--neon)}.fb.bad h3{color:var(--red)}
.fb .meta{font-size:13px;color:var(--mute);margin-bottom:8px}
.fb pre{white-space:pre-wrap;font:600 13px/1.7 "M PLUS Rounded 1c",sans-serif;color:var(--ink);background:var(--bg);border-radius:10px;padding:10px 12px;margin:0 0 12px}
.big{display:block;width:100%;border:none;border-radius:14px;padding:15px;font-size:17px;font-weight:800;background:var(--neon);color:#062413}
.big.sec{background:var(--panel2);color:var(--ink);border:2px solid var(--line)}
.pop{position:fixed;left:50%;top:84px;transform:translateX(-50%);font:800 22px "JetBrains Mono",monospace;pointer-events:none;z-index:30;animation:pp 1s ease-out forwards}
@keyframes pp{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-30px)}}
/* result */
.res{padding:30px 20px;text-align:center}
.rank{font:800 110px "JetBrains Mono",monospace;line-height:1;margin:6px 0;animation:rk .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes rk{from{transform:scale(.2) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
.rank.S{color:var(--gold);text-shadow:0 0 30px rgba(255,210,63,.5)}.rank.A{color:var(--neon)}.rank.B{color:var(--blue)}.rank.C{color:var(--mute)}
.final{font:800 44px "JetBrains Mono",monospace;margin:4px 0}
.nb{display:inline-block;background:var(--gold);color:#2b2100;font-weight:800;font-size:13px;padding:4px 12px;border-radius:99px;margin-bottom:8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.st{background:var(--panel);border-radius:14px;padding:12px}
.st span{display:block;font-size:12px;color:var(--mute);font-weight:700}
.st b{font:800 20px "JetBrains Mono",monospace}
.share{width:100%;height:110px;background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:10px;font:600 13px/1.6 "M PLUS Rounded 1c",sans-serif;resize:none;margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;font-weight:800;opacity:0;transition:opacity .3s;pointer-events:none;z-index:40}
.toast.on{opacity:1}

/* ===== layout: 問題 | 右:メモ+電卓 ===== */
.gbody{flex:1;display:flex;min-height:0}
.gleft{flex:1;min-width:0;display:flex;flex-direction:column}
.gleft .prob{flex:1}
.gright{width:44%;max-width:300px;display:flex;flex-direction:column;background:#0a0f1c;border-left:2px solid var(--line);min-height:0}
.abar{display:flex;gap:6px;padding:8px;background:#0a0f1c;border-top:2px solid var(--line)}
.ab{flex:1;border:none;border-radius:10px;padding:12px 4px;font-weight:800;font-size:14px}
.ab.nx{background:#24365d;color:var(--ink)}.ab.go{background:var(--neon);color:#062413}
.memo2{flex:1;display:flex;flex-direction:column;min-height:90px;padding:6px 6px 0}
.mhead{display:flex;gap:4px;margin-bottom:4px}
.mhead button{flex:1;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:8px;padding:4px 0;font-size:12px;font-weight:800}
.mhead button.on{background:var(--blue);border-color:var(--blue)}
#cv,#mt{flex:1;width:100%;min-height:0;border-radius:8px;background:#fdfcf6;touch-action:none;
  background-image:linear-gradient(#ece6cc 1px,transparent 1px);background-size:100% 22px}
#mt{display:none;border:none;padding:6px;font:600 13px/22px "M PLUS Rounded 1c",sans-serif;color:#1e2433;resize:none}
.calc{padding:6px;background:linear-gradient(#2b2f38,#1d2027);border-top:2px solid var(--line)}
.cdisp{background:#c9d3b8;border-radius:6px;padding:3px 8px 4px;margin-bottom:6px;box-shadow:inset 0 2px 4px rgba(0,0,0,.35)}
.cind{display:flex;gap:8px;height:12px;font:800 10px "JetBrains Mono",monospace;color:#2b3324}
.cnum{text-align:right;font-size:22px;color:#1d2418;line-height:1.15;overflow:hidden;white-space:nowrap}
.ckeys2{display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:minmax(34px,1fr);gap:4px}
.ck{border:none;border-radius:6px;background:#eceef2;color:#1d2027;font:800 16px "JetBrains Mono",monospace;padding:0;box-shadow:0 2px 0 #9aa0ab;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.ck.dn{transform:translateY(2px);box-shadow:none;filter:brightness(.9)}
.ck.op{background:#5b6170;color:#fff;box-shadow:0 2px 0 #34383f}
.ck.eq{background:#5b6170;color:#fff;box-shadow:0 2px 0 #34383f}
.ck.fn{background:#454a55;color:#e6e9ef;font-size:13px;box-shadow:0 2px 0 #2a2d33}
.ck.mem{background:#454a55;color:#cfd5df;font-size:11px;box-shadow:0 2px 0 #2a2d33}
.ck.clr{background:#e8584f;color:#fff;font-size:13px;box-shadow:0 2px 0 #9b2f29}
.ck.in{background:var(--neon);color:#062413;font:800 13px "M PLUS Rounded 1c",sans-serif;box-shadow:0 2px 0 #1c8a52}
.blank.flash{animation:fl .4s}
@keyframes fl{0%{background:#c9ffe0}100%{background:#fff}}
.chrow{flex-basis:100%;display:flex;gap:6px;justify-content:flex-end}
.cho{border:2px solid #b9c3d8;background:#fff;border-radius:8px;padding:5px 14px;font-weight:800;font-size:14px;color:#1e2433}
.cho.sel{border-color:var(--blue);background:#e8f2ff}
.ln{gap:6px}
.blank{min-width:96px}
@media (max-width:560px){
  .ptitle{font-size:14px}.data{font-size:12px}.data td{padding:5px 7px}
  .ln{font-size:12.5px}.blank{min-width:84px;font-size:15px;min-height:34px;padding:3px 7px}
  .gright{width:47%}
  .ck{font-size:15px}
}
@media (min-width:900px){ .wrap:has(.game){max-width:1100px} .gright{max-width:380px;width:36%} .ckeys2{grid-auto-rows:minmax(46px,1fr)} .ck{font-size:20px} .cnum{font-size:30px} }

.sw{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:8px;font-size:16px;font-weight:800;padding:3px 8px}
.hand{margin-top:22px;display:flex;align-items:center;justify-content:space-between;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:12px 16px;font-weight:800;font-size:14px;color:var(--mute)}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px}
.seg button{border:none;background:none;color:var(--mute);font-weight:800;font-size:14px;padding:7px 16px;border-radius:9px}
.seg button.on{background:var(--neon);color:#062413}
/* 左手モード:電卓とメモを左へ */
.gbody.lefty{flex-direction:row-reverse}
.gbody.lefty .gright{border-left:none;border-right:2px solid var(--line)}
/* 広い画面の左手モード:電卓(左)|問題(中)|メモ(右)→右手で書ける */
@media (min-width:900px){
  .gbody.lefty{flex-direction:row}
  .gbody.lefty .gright{display:contents}
  .gbody.lefty .calc{order:0;width:330px;border-top:none;border-right:2px solid var(--line);display:flex;flex-direction:column;justify-content:flex-end}
  .gbody.lefty .gleft{order:1}
  .gbody.lefty .memo2{order:2;width:300px;flex:none;background:#0a0f1c;border-left:2px solid var(--line);padding:8px}
}

.mode.vs{border-color:#6b5a2f}.mode.vs b{color:var(--gold)}
.back{background:none;border:none;color:var(--mute);font-weight:800;font-size:15px;padding:4px 0}
.howto{background:var(--panel);border-radius:16px;padding:12px 14px;font-size:13px;line-height:1.7;margin-top:12px}
.howto b{color:var(--gold)}
.itemlist{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.il{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border-radius:14px;padding:10px 12px;font-size:14px}
.il .ii{font-size:26px;line-height:1}
.il em{font-style:normal;font-size:11px;background:#1f4d3a;color:var(--neon);padding:2px 7px;border-radius:99px;margin-left:6px}
.il em.atk{background:#4d1f2a;color:var(--red)}
.il small{color:var(--mute);font-size:12px}
.h3{margin:22px 0 8px;font-size:15px}
.cpus{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cpu{border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:14px;padding:12px 4px}
.cpu b{display:block;font-size:15px}.cpu small{color:var(--mute);font-size:12px}
.lobby{text-align:center;margin-top:20px}
.lc{color:var(--mute);font-weight:800}.lc b{color:var(--ink);font-size:28px;letter-spacing:.15em;margin-left:6px}
.ls{color:var(--mute);font-size:13px;margin-top:16px;line-height:1.7}
.pl{display:flex;align-items:center;gap:10px;margin:20px 0}
.pc{flex:1;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:14px 6px;display:flex;flex-direction:column;gap:2px;min-height:110px;justify-content:center}
.pc.rd{border-color:var(--neon)}
.pc b{font-size:18px}.pc small{color:var(--mute);font-size:11px}.pc span{font-size:12px;font-weight:800;color:var(--gold)}
.vsx{font:800 22px "JetBrains Mono",monospace;color:var(--red)}
.big:disabled{opacity:.4}
/* battle HUD */
.vsh{gap:8px}
.hpwrap{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.hpl{display:flex;align-items:center;gap:6px}
.hpn{width:64px;font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mute)}
.hpbar{flex:1;height:12px;background:#2a1520;border-radius:99px;overflow:hidden}
.hpbar i{display:block;height:100%;border-radius:99px;transition:width .4s}
.hpbar.me i{background:linear-gradient(90deg,#28c76f,var(--neon))}
.hpbar.op i{background:linear-gradient(90deg,#ff9f43,var(--gold))}
.hpbar i.low{background:var(--red)!important}
.hpv{width:38px;text-align:right;font-size:12px}
.stk{font-size:11px;color:var(--gold);white-space:nowrap}.stk b{color:var(--ink)}
.itembar{display:flex;gap:6px;padding:6px 10px;background:#0a0f1c;border-bottom:2px solid var(--line);align-items:center}
.slot{width:64px;height:46px;border-radius:10px;border:2px solid var(--gold);background:#2a2412;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;}
.slot.new{animation:sl .3s}
.slot span{font-size:18px;line-height:1}.slot small{font-size:9px;font-weight:800;white-space:nowrap}
.slot.empty{border:2px dashed var(--line);background:none;color:var(--line);animation:none}
@keyframes sl{from{transform:scale(.5)}to{transform:none}}
.fxs{flex:1;text-align:right;font-size:11px;font-weight:800;color:var(--blue);line-height:1.4}
.cat.messy{background:#4d1f2a;color:var(--red);margin-left:6px}
.guide{display:none;background:#10223d;border:1px solid var(--blue);border-radius:8px;padding:5px 7px;margin-bottom:6px}
.gh{font-size:11px;font-weight:800;color:var(--blue);display:flex;justify-content:space-between}
.gt{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px;font:700 12px "JetBrains Mono",monospace}
.gt span{padding:1px 5px;border-radius:5px;background:#1d2b46;color:#9fb3d6}
.gt span.dn{opacity:.35}
.gt span.cu{background:var(--blue);color:#fff}
.goff{font-size:11px;color:var(--red);font-weight:800;margin-top:3px}
.ck.hint{outline:3px solid var(--blue);outline-offset:-1px;box-shadow:0 0 14px var(--blue)!important;animation:hb .7s infinite alternate}
@keyframes hb{to{filter:brightness(1.25)}}
.ck.shuf{background:#ffe7a8;color:#5a3b00}
.shufb{display:none;text-align:center;font-size:11px;font-weight:800;color:var(--gold);margin-top:4px}
.banner{position:fixed;left:50%;top:120px;transform:translateX(-50%);z-index:50;padding:12px 18px;border-radius:14px;font-weight:800;font-size:15px;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:bn .3s cubic-bezier(.2,1.5,.4,1);transition:opacity .4s}
.banner.hit{background:var(--red);color:#fff}.banner.atk{background:var(--gold);color:#2b2100}
.banner.self{background:var(--blue);color:#fff}.banner.info{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.banner.out{opacity:0}
@keyframes bn{from{transform:translate(-50%,-20px) scale(.8);opacity:0}to{transform:translateX(-50%);opacity:1}}
.wl{font:800 84px "JetBrains Mono",monospace;line-height:1;margin:20px 0 8px;animation:rk .6s cubic-bezier(.2,1.6,.4,1)}
.wl.w{color:var(--gold);text-shadow:0 0 30px rgba(255,210,63,.5)}.wl.l{color:var(--mute)}
@media (max-width:560px){.hpn{width:44px}.slot{width:58px}}

.cnum.egg{letter-spacing:.35em;font-weight:800;animation:egg .25s steps(2) 3}
@keyframes egg{50%{opacity:.15}}

.ab.sk{flex:0 0 56px;background:#3a2a4d;color:#e0ccff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 0;line-height:1.1}.ab.sk small{font-size:9px}
.ab{white-space:nowrap}

<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<script>
/* ================================================================
   ボキバトル 1級  —  タイムアタック / スコアアタック / 対戦(CPU・オンライン)
   ================================================================ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
const yen=n=>Number(n).toLocaleString("ja-JP");
const sgn=n=>(n>0?"+":n<0?"−":"±")+yen(Math.abs(n));
const OFF=(n)=>{const a=[];for(let i=-n;i<=n;i++)if(i)a.push(i);return a};

/* ---------- 問題を作るための乱数コンテキスト ----------
   構造(比率・方向など)は sr、数字の「細かさ」だけ mr で変える。
   → 端数地獄で同じ問題のまま数字だけ細かくできる */
function ctx(seed,messySeed,mu){
  const sr=mulberry32(seed),mr=messySeed?mulberry32(messySeed):null;
  const c={
    messy:!!mr,
    ri:(a,b)=>a+Math.floor(sr()*(b-a+1)),
    pick:a=>a[Math.floor(sr()*a.length)],
    rnd:()=>sr(),
    M:(a,b,k)=>{const base=a+Math.floor(sr()*(b-a+1));if(!mr)return base*k;
      let v=base*k+Math.round((mr()-.5)*Math.abs(k)*.9);v=Math.round(v/mu)*mu;return v===0?mu:v},
    R:(x,u)=>mr?Math.round(x):Math.round(x/u)*u,
    ok:true
  };
  return c;
}
const K=(...a)=>a;

/* ---------- 問題ジェネレーター ----------
   blank: {t:"num",ans,g:[電卓ガイド]} / {t:"ch",opts,ans} */
const GENS=[
function consA(c){
  const r=c.pick([60,70,75,80,90]),C=c.M(5,15,1000),E=c.M(1,6,1000),T=C+E,g=c.M(1,10,100),PI=T*r/100,P=PI+g,nci=T*(100-r)/100;
  return{cat:"連結会計",title:`P社はS社の発行済株式の${r}%を${yen(P)}で取得し、支配を獲得した。\n支配獲得日の連結修正について答えなさい。`,
  data:[["S社 資本金",C],["S社 利益剰余金",E],["取得原価(S社株式)",P],["P社の持分比率",r+"%"]],
  lines:[["のれん",0],["非支配株主持分",1]],
  blanks:[{t:"num",ans:g,g:K("AC",T,"*",r,"%","NEG","+",P,"=")},{t:"num",ans:nci,g:K("AC",T,"*",100-r,"%")}],
  ex:`S社資本 ${yen(T)}\nP社持分 ${yen(T)}×${r}%=${yen(PI)}\nのれん ${yen(P)}−${yen(PI)}=${yen(g)}\n非支配株主持分 ${yen(T)}×${100-r}%=${yen(nci)}`,chk:[PI]};
},
function consB(c){
  const r=c.pick([60,70,75,80,90]),C=c.M(5,15,1000),E=c.M(1,6,1000),T=C+E,g=c.M(1,10,200),P=T*r/100+g,NI=c.M(4,30,100);
  const am=g/20,ncNI=NI*(100-r)/100,nci=(T+NI)*(100-r)/100;
  return{cat:"連結会計",title:`前期末にP社はS社株式の${r}%を${yen(P)}で取得した。\n当期のS社の当期純利益は${yen(NI)}(配当なし)。のれんは20年で定額償却する。`,
  data:[["取得時 S社資本金",C],["取得時 S社利益剰余金",E],["取得原価",P],["S社 当期純利益",NI]],
  lines:[["のれん償却額",0],["非支配株主に帰属する当期純利益",1],["当期末の非支配株主持分",2]],
  blanks:[{t:"num",ans:am,g:K("AC",T,"*",r,"%","NEG","+",P,"=","/",20,"=")},{t:"num",ans:ncNI,g:K("AC",NI,"*",100-r,"%")},{t:"num",ans:nci,g:K("AC",T,"+",NI,"=","*",100-r,"%")}],
  ex:`のれん ${yen(P)}−${yen(T)}×${r}%=${yen(g)} → ÷20=${yen(am)}\n非支配株主に帰属 ${yen(NI)}×${100-r}%=${yen(ncNI)}\n期末非支配株主持分 (${yen(T)}+${yen(NI)})×${100-r}%=${yen(nci)}`,chk:[P]};
},
function consC(c){
  const r=c.pick([60,70,75,80]),S=c.M(1,10,2000),p=c.pick([20,25,30]),up=c.rnd()<.6,U=S*p/100,nc=up?U*(100-r)/100:0;
  return{cat:"連結会計",title:`${up?"S社(子会社)がP社(親会社)":"P社(親会社)がS社(子会社)"}に商品を販売している。\n売上総利益率は売価の${p}%。P社のS社に対する持分比率は${r}%。`,
  data:[[up?"P社の期末商品(S社から仕入)":"S社の期末商品(P社から仕入)",S],["売上総利益率",p+"%"],["期首商品の未実現利益","なし"]],
  lines:[["期末商品に含まれる未実現利益",0],["非支配株主持分への負担額",1]],
  blanks:[{t:"num",ans:U,g:K("AC",S,"*",p,"%")},{t:"num",ans:nc,g:up?K("AC",S,"*",p,"%","*",100-r,"%"):K("AC",0)}],
  ex:`未実現利益 ${yen(S)}×${p}%=${yen(U)}\n${up?`アップストリームなので非支配株主も負担:${yen(U)}×${100-r}%=${yen(nc)}`:"ダウンストリームなので全額親会社負担。非支配株主の負担は0"}`};
},
function taxA(c){
  const X=c.M(5,30,1000),Kx=c.M(1,9,100),A=c.M(1,9,100),tax=(X+Kx+A)*30/100,adj=A*30/100,NI=X-tax+adj;
  return{cat:"税効果会計",title:"次の資料から、損益計算書の金額を求めなさい。\n法定実効税率は30%。",
  data:[["税引前当期純利益",X],["交際費の損金不算入額",Kx],["貸倒引当金の繰入限度超過額(当期発生)",A]],
  lines:[["法人税、住民税及び事業税",0],["法人税等調整額(△で表示)",1],["当期純利益",2]],
  blanks:[{t:"num",ans:tax,g:K("AC",X,"+",Kx,"+",A,"=","*",30,"%")},{t:"num",ans:-adj,g:K("AC",A,"*",30,"%","NEG")},{t:"num",ans:NI,g:K("AC",X,"+",Kx,"=","*",30,"%","NEG","+",X,"=")}],
  ex:`課税所得 ${yen(X)}+${yen(Kx)}+${yen(A)}=${yen(X+Kx+A)} → ×30%=${yen(tax)}\n法人税等調整額 ${yen(A)}×30%=△${yen(adj)}(交際費は永久差異なので対象外)\n当期純利益 ${yen(X)}−${yen(tax)}+${yen(adj)}=${yen(NI)}`,note:"△はマイナス(電卓の +/−)で入力"};
},
function taxB(c){
  const s=c.rnd()<.65?1:-1,cost=s>0?c.M(10,50,100):c.M(20,50,100),dm=s>0?c.M(1,15,100):c.M(1,6,100),d=dm*s,fv=cost+d,dt=dm*30/100,oci=d*70/100;
  if(fv<=0||dm<=0)c.ok=false;
  return{cat:"税効果会計",title:"その他有価証券を期末に時価評価する(全部純資産直入法)。\n法定実効税率は30%。",
  data:[["取得原価",cost],["期末時価",fv]],
  lines:[["計上する繰延税金",0],["その金額",1],["その他有価証券評価差額金(借方なら−)",2]],
  blanks:[{t:"ch",opts:["資産","負債"],ans:d>0?"負債":"資産"},{t:"num",ans:dt,g:d>0?K("AC",fv,"-",cost,"=","*",30,"%"):K("AC",cost,"-",fv,"=","*",30,"%")},{t:"num",ans:oci,g:K("AC",fv,"-",cost,"=","*",70,"%")}],
  ex:`評価差額 ${yen(fv)}−${yen(cost)}=${d>0?"":"△"}${yen(dm)}\n${d>0?"評価差益→将来加算一時差異→繰延税金負債":"評価差損→将来減算一時差異→繰延税金資産"} ${yen(dm)}×30%=${yen(dt)}\n評価差額金 ${sgn(oci)}(70%分)`};
},
function ret(c){
  const PBO=c.M(10,50,1000),dr=c.pick([1,1.5,2]),PA=c.M(5,9,1000),er=c.pick([2,2.5,3]),SC=c.M(5,20,100),Kc=c.M(3,15,100);
  const it=PBO*dr/100,ex=PA*er/100,cost=SC+it-ex,end=PBO-PA+cost-Kc;
  if(PA>=PBO)c.ok=false;
  return{cat:"退職給付会計",title:"次の資料から当期の金額を求めなさい。\n未認識の差異はない。",
  data:[["期首 退職給付債務",PBO],["期首 年金資産",PA],["勤務費用",SC],["割引率",dr+"%"],["長期期待運用収益率",er+"%"],["年金掛金の拠出額",Kc]],
  lines:[["利息費用",0],["期待運用収益",1],["退職給付費用",2],["期末 退職給付引当金",3]],
  blanks:[{t:"num",ans:it,g:K("AC",PBO,"*",dr,"%")},{t:"num",ans:ex,g:K("AC",PA,"*",er,"%")},
    {t:"num",ans:cost,g:K("MC","AC",PBO,"*",dr,"%","M+",SC,"M+",PA,"*",er,"%","M-","MR")},
    {t:"num",ans:end,g:K("MC","AC",PBO,"M+",PA,"M-",PBO,"*",dr,"%","M+",SC,"M+",PA,"*",er,"%","M-",Kc,"M-","MR")}],
  ex:`利息費用 ${yen(PBO)}×${dr}%=${yen(it)}\n期待運用収益 ${yen(PA)}×${er}%=${yen(ex)}\n退職給付費用 ${yen(SC)}+${yen(it)}−${yen(ex)}=${yen(cost)}\n期末引当金 (${yen(PBO)}−${yen(PA)})+${yen(cost)}−${yen(Kc)}=${yen(end)}`};
},
function imp(c){
  const BV=c.M(10,60,1000),impd=c.rnd()<.75;
  let a,b,d;if(impd){a=c.ri(70,95);b=c.ri(35,65);d=c.ri(40,68)}else{a=c.ri(102,130);b=c.ri(50,85);d=c.ri(55,90)}
  if(d===b)d++;
  const CF=c.R(BV*a/100,100),N=c.R(BV*b/100,100),V=c.R(BV*d/100,100),RA=Math.max(N,V),loss=CF<BV?BV-RA:0;
  return{cat:"減損会計",title:"減損の兆候がある固定資産について答えなさい。",
  data:[["帳簿価額",BV],["割引前将来キャッシュ・フロー",CF],["正味売却価額",N],["使用価値",V]],
  lines:[["回収可能価額",0],["減損損失",1]],
  blanks:[{t:"num",ans:RA,g:K("AC",RA)},{t:"num",ans:loss,g:CF<BV?K("AC",BV,"-",RA,"="):K("AC",0)}],
  ex:`回収可能価額=max(${yen(N)}, ${yen(V)})=${yen(RA)}\n${CF<BV?`割引前CF ${yen(CF)}<帳簿価額 ${yen(BV)} → 認識\n減損損失 ${yen(BV)}−${yen(RA)}=${yen(loss)}`:`割引前CF ${yen(CF)}≧帳簿価額 ${yen(BV)} → 認識しない(減損損失0)`}`};
},
function fx(c){
  const D=c.M(1,20,100),HR=c.ri(100,150),CR=HR+c.pick(OFF(10)),ar=c.rnd()<.5,item=ar?"売掛金":"買掛金";
  const yenCR=D*CR,diff=(CR-HR)*D,gain=ar?diff>0:diff<0;
  return{cat:"外貨換算",title:`決算にあたり、外貨建の${item}を換算替えする。`,
  data:[[item,yen(D)+"ドル"],["取引時の為替相場",HR+"円"],["決算時の為替相場",CR+"円"]],
  lines:[["貸借対照表価額",0],["為替差",1],["その金額",2]],
  blanks:[{t:"num",ans:yenCR,g:K("AC",D,"*",CR,"=")},{t:"ch",opts:["益","損"],ans:gain?"益":"損"},{t:"num",ans:Math.abs(diff),g:K("AC",Math.max(CR,HR),"-",Math.min(CR,HR),"=","*",D,"=")}],
  ex:`B/S価額 ${yen(D)}ドル×${CR}=${yen(yenCR)}\n差額 ${yen(D)}×(${CR}−${HR})=${sgn(diff)}\n${item}が${diff>0?"増える":"減る"}→${ar?(diff>0?"資産増=差益":"資産減=差損"):(diff>0?"負債増=差損":"負債減=差益")}`};
},
function mat(c){
  const SP=c.M(10,50,10),AP=SP+c.pick(OFF(5))*10,SQ=c.M(5,20,100),AQ=SQ+c.pick(OFF(10))*10;
  const pv=(SP-AP)*AQ,qv=(SQ-AQ)*SP,tv=pv+qv;

let ROOM=null;
/* ===== オンライン設定(GitHub Pages版)=====
   Supabase の Project URL と anon(public)キーを貼る。空ならオンライン対戦はオフ。 */
const SB_URL="";
const SB_KEY="";
function makeSbRoom(){
  const client=window.supabase.createClient(SB_URL,SB_KEY,{realtime:{params:{eventsPerSecond:10}}});
  const myKey=Math.random().toString(36).slice(2,10)+Date.now().toString(36);
  return{join:(name)=>new Promise((res,rej)=>{
    const ch=client.channel(name,{config:{presence:{key:myKey}}});
    let pres={},fns=[],last=0,timer=null;
    const peers=()=>{const st=ch.presenceState()||{};const out=[];
      for(const k in st){const arr=st[k]||[];const p=arr[arr.length-1]||{};const o={};for(const f in p)if(f!=="presence_ref")o[f]=p[f];
        out.push({peer:k,sameTab:k===myKey,isMe:k===myKey,presence:k===myKey?pres:o})}
      if(!out.some(p=>p.sameTab))out.push({peer:myKey,sameTab:true,isMe:true,presence:pres});return out};
    ch.on("presence",{event:"sync"},()=>{const ps=peers();fns.forEach(f=>{try{f({peers:ps})}catch(e){}})});
    const flush=()=>{timer=null;last=Date.now();Promise.resolve(ch.track(pres)).catch(()=>{})};
    const api={
      presence:async(patch)=>{pres=Object.assign({},pres,patch);for(const k in patch)if(patch[k]===null)delete pres[k];
        if(!timer)timer=setTimeout(flush,Math.max(0,250-(Date.now()-last)))},
      onPeers:(f)=>{fns.push(f);setTimeout(()=>f({peers:peers()}),0);return()=>{fns=fns.filter(x=>x!==f)}},
      leave:async()=>{try{await ch.untrack()}catch(e){}try{client.removeChannel(ch)}catch(e){}}
    };
    let done=false;
    ch.subscribe(st=>{if(st==="SUBSCRIBED"&&!done){done=true;res(api)}else if((st==="CHANNEL_ERROR"||st==="TIMED_OUT"||st==="CLOSED")&&!done){done=true;rej({code:st})}});
    setTimeout(()=>{if(!done){done=true;rej({code:"timeout"})}},10000);
  })};
}
(async()=>{try{
  if(SB_URL&&SB_KEY&&window.supabase){ROOM=makeSbRoom();return}
  if(window.claude&&window.claude.use)ROOM=await window.claude.use("room");
}catch(e){ROOM=null}})();

function startSolo(mode){
  if(!CODE)CODE=newCode();resetDesk();
  G={mode,code:CODE,base:mode+":"+CODE,qi:0,elapsed:0,running:false,t0:0,pen:0,missBlanks:0,okBlanks:0,perfect:0,pts:0,combo:0,maxCombo:0,fx:{}};

function countdown(cb){
  let n=3;const tick=()=>{if(!G)return;if(n===0){cb();return}app.innerHTML=`<div class="cd"><span>${n}</span></div>`;n--;setTimeout(tick,800)};tick();
}
function now(){return G.elapsed+(G.running?performance.now()-G.t0:0)}
function pause(){if(G.running){G.elapsed+=performance.now()-G.t0;G.running=false}}
function resume(){if(!G.running){G.t0=performance.now();G.running=true}}
function startTimer(){stopTimer();timerId=setInterval(tick,100)}
function stopTimer(){if(timerId)clearInterval(timerId);timerId=null}
const isVS=()=>G&&(G.mode==="cpu"||G.mode==="online");
function tick(){
  if(!G)return;
  drawHud();
  autoGuideTick();
  drainTick();
  fxTick();
}
function autoGuideTick(){
  if(!G||!P||P.locked||G.ended||REC.noAuto)return;
  if(G.fx.auto===P.active)return;
  const bl=P.blanks[P.active];if(!bl||bl.t!=="num"||!bl.g||P.vals[P.active]!=="")return;
  if(now()-(G.lastProg||0)>AUTO_MS){G.fx.auto=P.active;G.fx.gstep={b:-1,s:0};toast("🧮 お助けガイドを表示");paintGuide()}
}
function progress(){if(G){G.lastProg=now();G.fx.auto=-1}}
function drawHud(){
  if(!G)return;const t=$("#hudt");
  if(G.mode==="ta"){if(t)t.textContent=fmtT(now()+G.pen)}
  else if(G.mode==="sa"){const left=SA_MS-now();if(t){t.textContent=fmtT(left);t.classList.toggle("warn",left<30000)}if(left<=0&&!G.ended){G.ended=true;pause();finishSolo()}}
  else{if(t)t.textContent=fmtT(now());paintHP()}
}
function deskReset(){if(TAPE.lines.length&&!TAPE.lines[TAPE.lines.length-1].startsWith("──"))tapePush("── 次の問題 ──");TAPE.cur="";if(REC.noReset)return;Object.assign(C,{disp:"0",acc:null,op:null,fresh:true,mem:0,lastOp:null,lastArg:null,err:false,k:null,lastKey:"",hist:[]})}
function nextProblem(){deskReset();P=makeProblem(G.base,G.qi);G.qi++;G.fx.gstep={b:-1,s:0};progress();if(G.fx.guideNext){G.fx.guideNext=false;G.fx.guideUntil=now()+20000}if(isVS()&&G.fx.messyNext){G.fx.messyNext=false;const m=makeProblem(P.base,P.idx,1);if(m)P=m}renderGame()}
function skipProblem(){
  if(!G||!P||P.locked||G.ended)return;
  G.skips=(G.skips||0)+1;
  const np=makeProblem(G.base+":skip"+G.skips,G.qi);if(!np)return;
  const lost=isVS()?G.streak:G.mode==="sa"?G.combo:0;
  if(isVS())G.streak=0;if(G.mode==="sa")G.combo=0;
  deskReset();P=np;G.fx.gstep={b:-1,s:0};progress();renderGame();
  toast(lost>0?`⏭ スキップ!${isVS()?"連鎖":"コンボ"}は0に`:"⏭ 問題を引き直した");
}

let quitArmed=0,skipArmed=0;
function skipArm(){const n=Date.now();if(n-skipArmed<2000){skipArmed=0;return true}skipArmed=n;toast(isVS()&&G.streak>0?`もう一度押すとスキップ(${G.streak}連鎖が0になる)`:"もう一度押すとスキップ");return false}
function confirmQuit(){const n=Date.now();if(n-quitArmed<2000)return true;quitArmed=n;toast("もう一度✕で中断");return false}
function evalExpr(s){
  if(s==null)return NaN;
  const e=String(s).replace(/,/g,"").replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-");
  if(!e.trim()||!/^[0-9+\-*/().\s]+$/.test(e))return NaN;
  try{const v=Function('"use strict";return ('+e+')')();return typeof v==="number"&&isFinite(v)?v:NaN}catch(_){return NaN}
}
function paintBlanks(){
  app.querySelectorAll(".blank").forEach(b=>{
    const i=+b.dataset.b,bl=P.blanks[i],v=P.vals[i];

  });

    r.querySelectorAll(".cho").forEach(c=>c.classList.toggle("sel",P.vals[i]===c.dataset.c))});
}
function advance(wrap){

}

const CALC_KEYS=[
 {k:"MC",c:"mem"},{k:"MR",c:"mem"},{k:"M-",l:"M−",c:"mem"},{k:"M+",c:"mem"},{k:"AC",c:"clr"},
 {k:"BS",l:"▶",c:"fn"},{k:"C",c:"clr"},{k:"NEG",l:"+/−",c:"fn"},{k:"SQ",l:"√",c:"fn"},{k:"/",l:"÷",c:"op"},
 {k:"7"},{k:"8"},{k:"9"},{k:"%",c:"fn"},{k:"*",l:"×",c:"op"},
 {k:"4"},{k:"5"},{k:"6"},{k:"IN",l:"入力",c:"in"},{k:"-",l:"−",c:"op"},
 {k:"1"},{k:"2"},{k:"3"},{k:"+",c:"op"},
 {k:"0"},{k:"00"},{k:".",l:"・"},{k:"=",c:"eq"}
];
const CALC_POS={"IN":"grid-column:4;grid-row:4 / span 2","+":"grid-column:5;grid-row:5 / span 2","=":"grid-column:4;grid-row:6"};
const C={disp:"0",acc:null,op:null,fresh:true,mem:0,lastOp:null,lastArg:null,err:false,k:null,lastKey:"",hist:[],egg:0};
const HELD=new Set();
function shufActive(){return G&&G.fx&&G.fx.shufUntil&&now()<G.fx.shufUntil}
function renderCalcKeys(){
  const box=$("#ckeys");if(!box)return;
  const sh=shufActive(),perm=sh?G.fx.perm:null;
  box.innerHTML=CALC_KEYS.map(k=>{let key=k.k,lab=k.l||k.k;if(sh&&/^\d$/.test(key)){key=String(perm[+key]);lab=key}
    return`<button class="ck ${k.c||""} ${sh&&/^\d$/.test(k.k)?"shuf":""}" data-k="${key}" style="${CALC_POS[k.k]||""}">${lab}</button>`}).join("");
  box.querySelectorAll(".ck").forEach(b=>{b.addEventListener("pointerdown",e=>{e.preventDefault();b.classList.add("dn");HELD.add(b.dataset.k);calcKey(b.dataset.k)});
    ["pointerup","pointerleave","pointercancel"].forEach(t=>b.addEventListener(t,()=>{b.classList.remove("dn");HELD.delete(b.dataset.k)}))});
  paintGuide();
}
function cur(){return Number(C.disp)}
function setNum(v){if(!isFinite(v)||Math.abs(v)>=1e12){C.err=true;C.disp="0";return}v=Math.round(v*1e8)/1e8;C.disp=String(v)}
function apply(a,op,b){return op==="+"?a+b:op==="-"?a-b:op==="*"?a*b:b===0?NaN:a/b}
function finish_eq(){
  if(C.k){const a=C.k.a,x=cur(),o=C.k.op;setNum(o==="*"?a*x:o==="+"?x+a:o==="-"?x-a:(a===0?NaN:x/a));C.fresh=true;return}
  if(C.op){const arg=C.fresh&&C.lastArg!==null&&C.acc===null?C.lastArg:cur();
    const r=apply(C.acc,C.op,arg);C.lastOp=C.op;C.lastArg=arg;setNum(r);C.acc=null;C.op=null}
  else if(C.lastOp){setNum(apply(cur(),C.lastOp,C.lastArg))}
  C.fresh=true;
}

const PHONE_MQ=window.matchMedia?matchMedia("(max-width:600px) and (orientation:portrait)"):null;
function isPhone(){return !!(PHONE_MQ&&PHONE_MQ.matches)}
if(PHONE_MQ&&PHONE_MQ.addEventListener)PHONE_MQ.addEventListener("change",()=>{if(G&&P&&!G.ended&&$("#calc")){const ib=$("#itembar");if(ib)ib.classList.remove("inbar");renderGame();if(P.locked){const ab=$("#abar");if(ab)ab.style.visibility="hidden"}}});
const TAPE={lines:[],cur:""};
const SYM={"+":"+","-":"−","*":"×","/":"÷"};
function fnum(v){if(!isFinite(v))return"E";const neg=v<0;let s=String(Math.abs(Math.round(v*1e8)/1e8));let[ip,fp]=s.split(".");ip=Number(ip).toLocaleString("en-US");return(neg?"−":"")+ip+(fp?"."+fp:"")}
function tapePush(s){TAPE.lines.push(s);if(TAPE.lines.length>60)TAPE.lines.shift()}
function calcKey(k){
  if(!P)return;
  const preD=cur(),preF=C.fresh,preK=!!C.k,preV=P.vals[P.active],pa=P.active,preM=C.mem;
  calcKey0(k);
  try{
    if("+-*/".includes(k)&&k.length===1){
      if(C.k&&!preK){TAPE.cur=TAPE.cur.trim()+SYM[k]+" (定数) "}
      else if(!preF||!TAPE.cur)TAPE.cur+=fnum(preD)+" "+SYM[k]+" ";
      else TAPE.cur=TAPE.cur.replace(/[+−×÷] $/,SYM[k]+" ");
    }else if(k==="="){tapePush((TAPE.cur||"")+(preF&&!TAPE.cur?fnum(preD)+" ":TAPE.cur?fnum(preD)+" ":"")+"= "+fnum(cur()));TAPE.cur=""}
    else if(k==="%"){if(TAPE.cur){tapePush(TAPE.cur+fnum(preD)+"% = "+fnum(cur()));TAPE.cur=""}}
    else if(k==="SQ"){tapePush("√"+fnum(preD)+" = "+fnum(cur()))}
    else if(k==="M+"||k==="M-"){tapePush((k==="M+"?"M+ ":"M− ")+fnum(cur())+"  (M="+fnum(C.mem)+")");TAPE.cur=""}
    else if(k==="AC"){if(TAPE.cur){TAPE.cur=""}}
    else if(k==="IN"&&P.vals[pa]!==preV){const ln=P.lines.find(l=>l[1]===pa);tapePush("→ "+(ln?ln[0]:"欄")+":"+fnum(evalExpr(P.vals[pa])))}
  }catch(e){}
  paintTape();
}
function paintTape(){
  const b=$("#tbody");if(!b)return;
  const ls=TAPE.lines.slice(-30);
  b.innerHTML=ls.map(s=>`<div class="tl ${s.startsWith("→")?"in":s.startsWith("──")?"sep":""}">${esc(s)}</div>`).join("")+(TAPE.cur?`<div class="tl cur">${esc(TAPE.cur)}</div>`:"");
  b.scrollTop=b.scrollHeight;
}
function calcKey0(k){
  if(!P)return;
  if(P.locked&&k==="IN")return;
  guideTrack(k);
  C.hist.push(k);if(C.hist.length>5)C.hist.shift();
  if(C.egg){C.egg=0}
  if(C.err&&k!=="AC"&&k!=="C"){paintGuide();return}
  if(/^\d$/.test(k)||k==="00"){
    if(C.fresh){C.disp=k==="00"?"0":k;C.fresh=false}
    else{const digits=C.disp.replace(/[-.]/g,"").length;if(digits>=12)return;C.disp=C.disp==="0"?(k==="00"?"0":k):C.disp+k}
  }else if(k==="."){if(C.fresh){C.disp="0.";C.fresh=false}else if(!C.disp.includes("."))C.disp+="."}
  else if("+-*/".includes(k)){
    if(C.lastKey===k&&C.op===k&&C.fresh){/* 同じ演算キー2回 → 定数計算(K) */C.k={op:k,a:C.acc};C.op=null;C.acc=null;C.fresh=true}
    else{C.k=null;if(C.op&&!C.fresh)setNum(apply(C.acc,C.op,cur()));C.acc=cur();C.op=k;C.fresh=true}}
  else if(k==="="){finish_eq()}
  else if(k==="%"){if(C.op){const a=C.acc,b=cur();let r;
      if(C.op==="*")r=a*b/100;else if(C.op==="/")r=a/b*100;else if(C.op==="+")r=a+a*b/100;else r=a-a*b/100;
      setNum(r);C.acc=null;C.op=null;C.fresh=true}}
  else if(k==="SQ"){setNum(Math.sqrt(Math.abs(cur())));C.fresh=true}
  else if(k==="NEG"){if(C.disp!=="0")C.disp=C.disp.startsWith("-")?C.disp.slice(1):"-"+C.disp}
  else if(k==="BS"){if(!C.fresh){C.disp=C.disp.slice(0,-1);if(C.disp===""||C.disp==="-")C.disp="0"}}
  else if(k==="C"){C.disp="0";C.fresh=true;C.err=false}
  else if(k==="AC"){C.disp="0";C.acc=null;C.op=null;C.fresh=true;C.lastOp=null;C.lastArg=null;C.err=false;C.k=null;
    const seq=C.hist.join(",")==="1,3,7,9,AC",held=["1","3","7","9"].every(x=>HELD.has(x));
    if(seq||held){C.egg=Date.now()+2500;setTimeout(()=>{if(C.egg&&Date.now()>=C.egg){C.egg=0;paintCalc()}},2600)}}
  else if(k==="M+"||k==="M-"){if(C.op)finish_eq();C.mem+=(k==="M+"?1:-1)*cur();C.fresh=true}
  else if(k==="MR"){setNum(C.mem);C.fresh=true}
  else if(k==="MC"){C.mem=0}
  else if(k==="IN"){
    if(C.op&&!C.fresh)finish_eq();
    const bl=P.blanks[P.active];
    if(bl.t==="ch"){toast("この欄は選択肢から選んでね");return}
    if(P.judged&&P.judged[P.active]!==undefined){advance();paintCalc();return}
    P.vals[P.active]=String(cur());C.acc=null;C.op=null;C.fresh=true;progress();
    if(isVS()&&G.fx.typoPending){G.fx.typoPending=false;P.vals[P.active]=typoOf(P.vals[P.active])}
    const b=app.querySelector(`.blank[data-b="${P.active}"]`);if(b){b.classList.remove("flash");void b.offsetWidth;b.classList.add("flash")}
    if(isVS())judgeBlank(P.active);
    advance();
  }
  C.lastKey=k;
  paintCalc();paintGuide();
}
function paintCalc(){
  const n=$("#cnum"),ind=$("#cind");if(!n)return;
  n.classList.toggle("egg",!!C.egg);
  if(C.egg){n.textContent="CASIO";ind.innerHTML="";return}
  let s=C.disp;const neg=s.startsWith("-");if(neg)s=s.slice(1);
  let [ip,fp]=s.split(".");ip=Number(ip).toLocaleString("en-US");
  n.textContent=(neg?"−":"")+ip+(fp!==undefined?"."+fp:"");
  const tl=P&&!P.locked&&P.lines?(P.lines.find(l=>l[1]===P.active)||[""])[0]:"";
  ind.innerHTML=`<span class="tgt">${tl?"→ "+esc(tl.replace(/\(.*?\)/g,"")):""}</span><span>${C.k?"K":""}</span><span>${C.mem!==0?"M":""}</span><span>${C.err?"E":""}</span><span>${C.op?{"+":"+","-":"−","*":"×","/":"÷"}[C.op]:""}</span>`;
}

/* ================= 検算ガイド ================= */
const KLAB={"*":"×","/":"÷","-":"−","NEG":"+/−","IN":"入力","M-":"M−","BS":"▶"};
function guideKeys(seq){const out=[];seq.concat(["IN"]).forEach((t,ti)=>{if(typeof t==="number"){String(t).split("").forEach(ch=>out.push({k:ch,t:ti}))}else out.push({k:t,t:ti})});return out}
function guideOn(){return !!(G&&P&&!P.locked&&G.fx&&((G.fx.guideUntil&&now()<G.fx.guideUntil)||G.fx.auto===P.active))}
function guideTimed(){return G.fx.guideUntil&&now()<G.fx.guideUntil}
function guideTrack(k){
  if(!guideOn())return;
  const bl=P.blanks[P.active];if(bl.t!=="num"||!bl.g)return;
  const gs=G.fx.gstep;if(gs.b!==P.active){gs.b=P.active;gs.s=0;gs.off=false}
  const keys=guideKeys(bl.g),exp=keys[gs.s];
  if(exp&&k===exp.k&&!gs.off){gs.s++;if(k==="IN"){gs.b=-1}}
  else if(k==="AC"){const i=keys.findIndex(x=>x.k==="AC");gs.s=i+1;gs.off=false}
  else if(k==="MC"&&keys[0].k==="MC"){gs.s=1;gs.off=false}
  else gs.off=true;
}
function paintGuide(){
  const box=$("#guide");if(!box)return;
  app.querySelectorAll(".ck.hint").forEach(x=>x.classList.remove("hint"));
  if(!guideOn()){box.style.display="none";return}
  box.style.display="block";
  const left=guideTimed()?Math.ceil((G.fx.guideUntil-now())/1000)+"s":"自動";
  const bl=P.blanks[P.active];
  if(bl.t!=="num"||!bl.g){box.innerHTML=`<div class="gh">🧮 検算ガイド <span>${left}</span></div><div class="gt">この欄は選択式(ガイドなし)</div>`;return}
  const gs=G.fx.gstep;if(gs.b!==P.active){gs.b=P.active;gs.s=0;gs.off=false}
  const keys=guideKeys(bl.g),seq=bl.g.concat(["IN"]);
  const curT=gs.off?-1:(keys[gs.s]?keys[gs.s].t:seq.length);
  box.innerHTML=`<div class="gh">🧮 ${guideTimed()?"検算ガイド":"お助けガイド"} <span>${left}</span></div><div class="gt">${seq.map((t,i)=>`<span class="${i<curT?"dn":i===curT?"cu":""}">${typeof t==="number"?yen(t):(KLAB[t]||t)}</span>`).join("")}</div>${gs.off?`<div class="goff">ずれたよ → AC から打ち直し</div>`:""}`;
  if(!gs.off&&keys[gs.s]){const b=app.querySelector(`.ck[data-k="${CSS.escape(keys[gs.s].k)}"]`);if(b)b.classList.add("hint")}
  else if(gs.off){const b=app.querySelector('.ck[data-k="AC"]');if(b)b.classList.add("hint")}
}

/* ================= メモ ================= */
let cv,cx,drawing=false,last=null;
function initMemo(){
  cv=$("#cv");cx=cv.getContext("2d");const mt=$("#mt");
  mt.value=MEMO.text;mt.oninput=()=>MEMO.text=mt.value;
  const setTab=t=>{MEMO.tab=t;app.querySelectorAll(".mhead [data-t]").forEach(b=>b.classList.toggle("on",b.dataset.t===t));cv.style.display=t==="draw"?"block":"none";mt.style.display=t==="text"?"block":"none";if(t==="draw")fitCv()};
  app.querySelectorAll(".mhead [data-t]").forEach(b=>b.onclick=()=>setTab(b.dataset.t));
  $("#mclr").onclick=()=>{if(MEMO.tab==="draw"){cx.clearRect(0,0,cv.width,cv.height);MEMO.img=null}else{mt.value="";MEMO.text=""}};
  const pos=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
  cv.addEventListener("pointerdown",e=>{e.preventDefault();drawing=true;last=pos(e);try{cv.setPointerCapture(e.pointerId)}catch(_){}stroke(last,last)});
  cv.addEventListener("pointermove",e=>{if(!drawing)return;e.preventDefault();
    const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];(evs.length?evs:[e]).forEach(ev=>{const p=pos(ev);stroke(last,p);last=p})});
  ["touchstart","touchmove","touchend"].forEach(t=>cv.addEventListener(t,e=>e.preventDefault(),{passive:false}));
  ["pointerup","pointercancel"].forEach(t=>cv.addEventListener(t,()=>{if(drawing){drawing=false;MEMO.img=cv.toDataURL()}}));
  setTab(MEMO.tab);
}
function stroke(a,b){cx.strokeStyle="#1e2433";cx.lineWidth=2;cx.lineCap="round";cx.lineJoin="round";cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x+.01,b.y);cx.stroke()}
function fitCv(){
  if(!cv||!cv.isConnected)return;const r=cv.getBoundingClientRect();if(r.width<10)return;
  const d=window.devicePixelRatio||1;cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);cx.setTransform(d,0,0,d,0,0);
  if(MEMO.img){const im=new Image();im.onload=()=>{cx.drawImage(im,0,0,r.width,r.height)};im.src=MEMO.img}
}
window.addEventListener("resize",()=>setTimeout(fitCv,60));
function inGame(t){const el=t&&t.nodeType===1?t:t&&t.parentElement;return el&&el.closest&&el.closest(".game")&&!el.closest("textarea,input")}
document.addEventListener("selectstart",e=>{if(inGame(e.target))e.preventDefault()});
document.addEventListener("contextmenu",e=>{if(inGame(e.target))e.preventDefault()});
document.addEventListener("selectionchange",()=>{const s=document.getSelection();if(s&&s.rangeCount&&inGame(s.anchorNode))s.removeAllRanges()});

document.addEventListener("keydown",e=>{
  if(!G||!P||!$("#calc"))return;
  const tg=document.activeElement&&document.activeElement.tagName;
  if(tg==="INPUT"||tg==="TEXTAREA")return;
  if(P.locked){if(e.key==="Enter"){e.preventDefault();const b=$("#fbn");b&&b.click()}return}
  if(e.key==="Tab"){e.preventDefault();calcKey("IN");return}
  if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){e.preventDefault();submit();return}
  const bl=P.blanks[P.active];
  if(bl.t==="ch"&&/^[1-9]$/.test(e.key)){const n=+e.key;if(n<=bl.opts.length){P.vals[P.active]=bl.opts[n-1];advance()}return}
  if(/^[0-9]$/.test(e.key)){e.preventDefault();calcKey(shufActive()?String(G.fx.perm[+e.key]):e.key);return}
  if(/^[.+\-*/]$/.test(e.key)){e.preventDefault();calcKey(e.key);return}
  const map={"Enter":"=","=":"=","Backspace":"BS","Escape":"AC","Delete":"C","%":"%"};
  if(map[e.key]){e.preventDefault();calcKey(map[e.key])}
});

/* ================= 採点 ================= */
function submit(){
  if(!P||P.locked)return;
  if(isVS())return;
  if(!P.vals.every(v=>v!=="")){const j=P.vals.findIndex(v=>v==="");P.active=j;paintBlanks();paintGuide();toast("空欄があるよ");return}
  P.locked=true;
  P.res=P.blanks.map((bl,i)=>bl.t==="ch"?P.vals[i]===bl.ans:Math.abs(evalExpr(P.vals[i])-bl.ans)<0.5);
  const nOk=P.res.filter(Boolean).length,nNg=P.res.length-nOk,all=nNg===0;
  G.okBlanks+=nOk;G.missBlanks+=nNg;
  paintBlanks();paintGuide();
  if(isVS())return submitVS(nOk,nNg,all);
  pause();
  let gain=0;
  if(G.mode==="ta"){G.pen+=nNg*PEN_MS;if(all)G.perfect++}
  else{if(all){G.combo++;G.perfect++;G.maxCombo=Math.max(G.maxCombo,G.combo)}else G.combo=0;
    gain=nOk*100-nNg*30+(all?50*G.combo:0);G.pts=Math.max(0,G.pts+gain)}
  drawHud();
  pop(G.mode==="ta"?(all?"PERFECT!":`+${nNg*10}s`):(gain>=0?"+":"")+gain+"pt",all?"var(--neon)":"var(--red)");
  const last=G.mode==="ta"&&G.qi>=TA_N;
  sheet(all,`<div class="meta">${G.mode==="ta"?(nNg?`ペナルティ +${nNg*10}秒 ・ `:"")+"タイマー停止中":`${gain>=0?"+":""}${gain}pt${G.combo>1?` ・ 🔥${G.combo}コンボ`:""} ・ タイマー停止中`}</div>`,
    last?"結果を見る":"次の問題 ▶",()=>{if(last){finishSolo();return}if(G.mode==="sa"&&SA_MS-now()<=0){G.ended=true;finishSolo();return}resume();nextProblem()});
}
function pop(text,color,anchor){
  const el=document.createElement("div");el.className="pop";el.style.color=color;el.textContent=text;
  if(anchor){const a=$(anchor);if(a){const r=a.getBoundingClientRect();el.style.top=(r.bottom+4)+"px";el.style.left=(r.left+r.width/2)+"px"}}
  document.body.appendChild(el);setTimeout(()=>el.remove(),1100);
}
function sheet(good,meta,btn,cb){
  const fb=document.createElement("div");fb.className="fb "+(good?"good":"bad");
  const nNg=P.res.filter(x=>!x).length;
  fb.innerHTML=`<h3>${good?"✓ 全欄正解":`✗ ${nNg}欄ミス`}</h3>${meta}<pre>${P.ex}</pre><button class="big" id="fbn">${btn}</button>`;
  document.body.appendChild(fb);
  $("#fbn").onclick=()=>{fb.remove();cb()};
  const ab=$("#abar");if(ab)ab.style.visibility="hidden";
}
function finishSolo(){
  stopTimer();pause();
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  const ta=G.mode==="ta";
  const total=G.okBlanks+G.missBlanks,acc=total?Math.round(G.okBlanks/total*100):0;
  let rec,rank,isBest=false,main;
  if(ta){const ms=Math.round(G.elapsed+G.pen);rank=rankTA(ms);rec={ms,rank,code:G.code,miss:G.missBlanks,d:Date.now()};
    isBest=!REC.ta.length||ms<REC.ta[0].ms;REC.ta.push(rec);REC.ta.sort((a,b)=>a.ms-b.ms);REC.ta=REC.ta.slice(0,10);main=fmtT(ms)}
  else{rank=rankSA(G.pts);rec={pts:G.pts,rank,code:G.code,solved:G.qi,d:Date.now()};
    isBest=!REC.sa.length||G.pts>REC.sa[0].pts;REC.sa.push(rec);REC.sa.sort((a,b)=>b.pts-a.pts);REC.sa=REC.sa.slice(0,10);main=G.pts+"pt"}
  saveRec();
  const share=ta?`🧮ボキバトル 簿記1級\n⏱タイムアタック ${main}(ミス${G.missBlanks}欄・+${G.pen/1000}秒)\nランク${rank} / 正答率${acc}%\n対戦コード:${G.code}\nこのコードで勝負しよう!`
   :`🧮ボキバトル 簿記1級\n⚡スコアアタック ${main}\nランク${rank} / ${G.qi}題・最大${G.maxCombo}コンボ\n対戦コード:${G.code}\nこのコードで勝負しよう!`;
  app.innerHTML=`<div class="res">
   ${isBest?`<div class="nb">🏆 自己ベスト更新!</div>`:""}
   <div style="color:var(--mute);font-weight:800">${ta?"タイムアタック":"スコアアタック"} 結果</div>
   <div class="rank ${rank}">${rank}</div><div class="final">${main}</div>
   <div class="stats">
    ${ta?`<div class="st"><span>解答タイム</span><b>${fmtT(G.elapsed)}</b></div><div class="st"><span>ペナルティ</span><b>+${G.pen/1000}s</b></div>`
        :`<div class="st"><span>解いた問題</span><b>${G.qi}題</b></div><div class="st"><span>最大コンボ</span><b>${G.maxCombo}</b></div>`}
    <div class="st"><span>正答率(欄)</span><b>${acc}%</b></div><div class="st"><span>全欄正解</span><b>${G.perfect}題</b></div>
   </div>
   <textarea class="share" id="sh" readonly>${share}</textarea>
   <button class="big" id="cp" style="margin-bottom:10px">📋 結果をコピー</button>
   <button class="big sec" id="again" style="margin-bottom:10px">🔁 同じコードで再挑戦</button>
   <button class="big sec" id="home">ホームへ</button></div>`;
  $("#cp").onclick=async()=>{const t=$("#sh");try{await navigator.clipboard.writeText(t.value);toast("コピーした!")}catch(e){t.select();toast("選択したのでコピーしてね")}};
  $("#again").onclick=()=>{CODE=G.code;startSolo(G.mode)};
  $("#home").onclick=()=>{CODE=newCode();title()};
  window.scrollTo(0,0);
}

/* ================= HPバトル ================= */
const CPU_LV=[{n:"見習い",read:14,spd:24,acc:.7,itm:.3},{n:"経理部員",read:10,spd:15,acc:.8,itm:.45},{n:"公認会計士",read:6,spd:9,acc:.9,itm:.6}];
function startBattle(mode,opt){
  resetDesk();
  G={mode,base:"vs:"+opt.seed,qi:0,elapsed:0,running:false,t0:0,okBlanks:0,missBlanks:0,perfect:0,
     hp:HP0,oppHp:HP0,oppPub:null,lastT:0,phase:0,lastPub:0,healed:0,oppHealed:0,streak:0,maxStreak:0,oppStreak:0,items:[],fx:{gstep:{b:-1,s:0}},
     myName:opt.myName||"あなた",oppName:opt.oppName,lv:opt.lv,gid:opt.gid||0,
     myAtks:[],blocked:[],seen:new Set(),seenBl:new Set(),ended:false};
  countdown(()=>{if(!G)return;G.running=true;G.t0=performance.now();G.lastT=0;nextProblem();startTimer();if(mode==="cpu")startCpu();if(mode==="online")netPub()});
}
function myHP(){return Math.max(0,G.hp)}
function oppDisp(){
  if(G.mode==="online"){if(!G.oppPub)return HP0;return Math.max(0,G.oppPub.hp-rateAt(now())*(now()-G.oppPub.at)/1000)}
  return Math.max(0,G.oppHp)}
function oppHP(){return oppDisp()}
function drainTick(){
  if(!G||!isVS()||!G.running||G.ended)return;
  if(G.mode==="online"&&G.oppPub&&oppDisp()<=0&&now()-G.oppPub.at>8000){endBattle(true,"相手の応答がなく体力が尽きた");return}
  const t=now(),dt=(t-G.lastT)/1000;if(dt<=0)return;
  const r=rateAt(t);G.hp-=r*dt*(boosted()?2:1);if(G.mode==="cpu")G.oppHp-=r*dt*(CPU.boostUntil&&t<CPU.boostUntil?2:1);G.lastT=t;
  const ph=phaseAt(t);if(ph!==G.phase){G.phase=ph;banner(`⏰ ${PHASE[ph]}!体力の減りが速くなった`,"hit")}
  if(G.mode==="online"&&t-G.lastPub>1000)netPub();
  paintHP();
}
function paintHP(){
  if(!G||!isVS())return;
  const a=$("#hpme"),b=$("#hpop"),mh=myHP(),oh=oppDisp();
  if(a){a.style.width=(mh/MAXHP*100)+"%";a.classList.toggle("low",mh<=8);$("#hpmev").textContent=Math.ceil(mh)}
  if(b){b.style.width=(oh/MAXHP*100)+"%";b.classList.toggle("low",oh<=8);$("#hpopv").textContent=Math.ceil(oh)}
  const g=$("#gb");if(g)g.classList.toggle("danger",mh<=8&&mh>0);

function applyMessy(){

function typoOf(v){
  let neg=v.startsWith("-"),s=neg?v.slice(1):v;
  const d=s.split("");const idx=[];for(let i=0;i<d.length-1;i++)if(/\d/.test(d[i])&&/\d/.test(d[i+1])&&d[i]!==d[i+1])idx.push(i);
  if(idx.length){const i=idx[Math.floor(Math.random()*idx.length)];[d[i],d[i+1]]=[d[i+1],d[i]]}
  else{const ds=[];d.forEach((c,i)=>{if(/\d/.test(c))ds.push(i)});const i=ds[ds.length-1];d[i]=String((+d[i]+3)%10)}
  s=d.join("").replace(/^0+(?=\d)/,"");return(neg?"-":"")+s;
}

const CPU={timer:null,qi:0,next:0,streak:0,shield:false,typo:false};
function startCpu(){Object.assign(CPU,{qi:0,streak:0,shield:false,typo:false,boostUntil:0});cpuSchedule();stopCpu();CPU.timer=setInterval(cpuStep,200)}
function stopCpu(){if(CPU.timer)clearInterval(CPU.timer);CPU.timer=null}
function cpuSchedule(){const L=CPU_LV[G.lv],p=makeProblem(G.base,CPU.qi);CPU.n=p.blanks.length;CPU.next=now()+(L.read+CPU.n*L.spd)*(0.75+Math.random()*.5)*1000}
function cpuStep(){
  if(!G||G.mode!=="cpu"||G.ended||!G.running)return;
  if(now()<CPU.next)return;
  const L=CPU_LV[G.lv];let ok=0,dmg=0;
  const res=[];for(let i=0;i<CPU.n;i++)res.push(Math.random()<L.acc);
  if(CPU.typo){const k=res.indexOf(true);if(k>=0)res[k]=false;CPU.typo=false}
  const s0=CPU.streak;let atk=0;
  res.forEach(r=>{if(r){ok++;CPU.streak++;dmg+=dmgFor(CPU.streak);if(CHAIN_ATK(CPU.streak))atk=CPU.streak}else CPU.streak=0});
  G.oppStreak=CPU.streak;
  if(CPU.streak>s0)oppChainFx(Math.max(s0+1,CPU.streak-ok+1),CPU.streak);
  if(dmg){G.oppHp=Math.min(MAXHP,G.oppHp+dmg);G.oppHealed+=dmg;setTimeout(()=>pop(`+${dmg}`,"var(--gold)","#hpop"),ok*280)}
  if(atk)setTimeout(()=>receiveAttack("chain",null,atk),ok*280+200);
  if(ok===CPU.n&&Math.random()<L.itm){
    if(Math.random()<.18&&!CPU.shield){CPU.shield=true;banner(`相手が🛡️内部統制を整備した`,"info")}
    else{const t=["messy","shuffle","typo"][Math.floor(Math.random()*3)];setTimeout(()=>receiveAttack(t),300)}
  }
  CPU.qi++;cpuSchedule();paintHP();
}
function cpuReceive(t){
  if(CPU.shield){CPU.shield=false;setTimeout(()=>banner("相手の🛡️内部統制にブロックされた…","info"),700);return}
  if(t==="messy")CPU.next+=8000;else if(t==="shuffle")CPU.next+=4000;else if(t==="typo")CPU.typo=true;
}

function leaveNet(){
  if(NET.nr){try{NET.unsub&&NET.unsub()}catch(e){}NET.nr.leave().catch(()=>{});}
  NET.nr=null;NET.opp=null;NET.unsub=null;NET.screen="";
}
function setPres(patch){Object.assign(NET.pres,patch);if(NET.nr)NET.nr.presence(patch).catch(()=>{})}
async function lobby(code,name){
  stopCpu();leaveNet();
  NET.code=code;NET.name=name;
  app.innerHTML=`<div class="title"><button class="back" id="bk">← もどる</button><div class="lobby"><div class="lc">部屋 <b class="mono">${esc(code)}</b></div><div class="ls">接続中…</div></div></div>`;
  $("#bk").onclick=()=>{leaveNet();vsMenu()};
  if(!ROOM){await new Promise(r=>setTimeout(r,1500))}
  if(!ROOM){
    app.querySelector(".ls").innerHTML=`オンライン対戦につながらなかったよ。<br>(公開版:index.html の SB_URL / SB_KEY が未設定か、通信がブロックされています)<br>CPU対戦・タイムアタック・スコアアタックは遊べるよ。<br><br><button class="big sec" id="tocpu">CPU対戦で遊ぶ</button>`;
    $("#tocpu").onclick=vsMenu;return;
  }
  try{NET.nr=await ROOM.join("bb-"+code)}catch(e){
    app.querySelector(".ls").innerHTML=`部屋に入れなかった(${esc(e&&e.code||"error")})。少し待ってもう一度ためしてね。`;return}
  NET.pres={nm:name,st:"lobby",rd:false,ra:0,gid:0,hp:HP0,dead:false,at:[],bl:[],sk:0,ff:0};
  NET.nr.presence(NET.pres).catch(()=>{});
  NET.unsub=NET.nr.onPeers(ch=>netPeers(ch.peers));
  NET.screen="lobby";renderLobby();
}
function renderLobby(){
  if(NET.screen!=="lobby")return;
  const o=NET.opp,op=o&&o.presence||{};
  const me=NET.pres;
  app.innerHTML=`<div class="title"><button class="back" id="bk">← もどる</button>
   <div class="lobby">
    <div class="lc">部屋 <b class="mono">${esc(NET.code)}</b></div>
    <div class="pl"><div class="pc ${me.rd?"rd":""}"><b>${esc(me.nm)}</b><small>あなた</small><span>${me.rd?"準備OK":"待機中"}</span></div>
     <div class="vsx">VS</div>
     <div class="pc ${op.rd?"rd":""}">${o?`<b>${esc(op.nm||"?")}</b><small>相手</small><span>${op.st==="play"?"対戦中…":op.rd?"準備OK":"待機中"}</span>`:`<b>…</b><small>相手を待っています</small><span>同じ部屋コードで入室してもらってね</span>`}</div></div>
    <button class="big ${me.rd?"sec":""}" id="rdy" ${o?"":"disabled"}>${me.rd?"準備OKを取り消す":"準備OK!"}</button>
    <div class="ls" style="margin-top:12px">2人とも「準備OK」で対戦スタート</div>
   </div></div>`;
  $("#bk").onclick=()=>{leaveNet();vsMenu()};
  $("#rdy").onclick=()=>{setPres(me.rd?{rd:false}:{rd:true,ra:Date.now()});renderLobby();checkStart()};
}
function netPeers(peers){
  if(!NET.nr)return;
  const others=peers.filter(p=>!p.sameTab&&p.presence&&typeof p.presence.nm==="string").sort((a,b)=>a.peer<b.peer?-1:1);
  const prev=NET.opp;
  NET.opp=others.find(p=>prev&&p.peer===prev.peer)||others[0]||null;
  if(NET.screen==="lobby"){renderLobby();checkStart();return}
  if(G&&G.mode==="online"&&!G.ended){
    const o=NET.opp;
    if(!o){if(!NET.goneAt)NET.goneAt=Date.now();setTimeout(()=>{if(NET.goneAt&&Date.now()-NET.goneAt>=2900&&G&&!G.ended&&G.mode==="online"&&!NET.opp)endBattle(true,"相手が退出した")},3000);return}
    NET.goneAt=0;
    const op=o.presence;
    if(op.ff&&op.ff===G.gid){endBattle(true,"相手が降参した");return}
    if(op.gid!==G.gid)return;
    if(typeof op.hp==="number")G.oppPub={hp:op.hp,at:now()};
    if(op.dead){endBattle(true,"相手の体力が0になった");return}
    const nsk=Number(op.sk)||0;if(nsk>(G.oppStreak||0))oppChainFx((G.oppStreak||0)+1,nsk);G.oppStreak=nsk;
    (Array.isArray(op.at)?op.at:[]).forEach(a=>{if(a&&typeof a.id==="string"&&!G.seen.has(a.id)){G.seen.add(a.id);receiveAttack(a.t,a.id,a.n)}});
    const mine=new Set(G.myAtks.map(a=>a.id));
    (Array.isArray(op.bl)?op.bl:[]).forEach(id=>{if(mine.has(id)&&!G.seenBl.has(id)){G.seenBl.add(id);banner("相手の🛡️内部統制にブロックされた…","info")}});
    paintHP();
  }
}
function checkStart(){
  const o=NET.opp;if(!o||NET.screen!=="lobby")return;
  const op=o.presence,me=NET.pres;
  const gid0=Math.max(Number(me.ra)||0,Number(op.ra)||0);
  /* 相手が先に始めた(準備OK→対戦中が同時に届いた)場合も一緒に始める */
  if(me.rd&&me.st==="lobby"&&((op.rd&&op.st==="lobby")||(op.st==="play"&&op.gid===gid0&&gid0>0))){
    const gid=gid0;
    NET.screen="play";
    setPres({st:"play",rd:false,gid,hp:HP0,dead:false,at:[],bl:[],sk:0,ff:0});
    startBattle("online",{seed:NET.code+":"+gid,gid,myName:me.nm,oppName:op.nm||"相手"});
  }
}
function netPub(){
  if(!G||G.mode!=="online")return;
  G.lastPub=now();setPres({st:G.ended?"end":"play",gid:G.gid,hp:Math.max(0,Math.round(G.hp*10)/10),dead:G.hp<=0,at:G.myAtks.slice(-8),bl:G.blocked.slice(-8),sk:G.streak});
}
function netForfeit(){if(NET.nr&&G){setPres({st:"lobby",rd:false,ff:G.gid});NET.screen="";leaveNet()}}
function backToLobby(){G=null;setPres({st:"lobby",rd:false,ff:0});NET.screen="lobby";renderLobby()}

title();

</script>
</body>
