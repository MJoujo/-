   CALC(`期首の退職給付債務 ${yn(pbo)}円、割引率 ${dr}%。利息費用は?`,"利息費用",ic,`${yn(pbo)}×${dr}%=${yn(ic)}`),
   CALC(`期首の年金資産 ${yn(asst)}円、期待運用収益率 ${er}%。期待運用収益は?`,"期待運用収益",ex,`${yn(asst)}×${er}%=${yn(ex)}`),
   CALC(`勤務費用 ${yn(sc)}円。当期の退職給付費用は?(利息費用 ${yn(ic)}円、期待運用収益 ${yn(ex)}円)`,"退職給付費用",cost,`${yn(sc)}+${yn(ic)}−${yn(ex)}=${yn(cost)}`),
   JR(`決算。退職給付費用 ${yn(cost)}円を計上する。`,[["退職給付費用",cost]],[["退職給付引当金",cost]],["給料","賞与引当金"])]}},
 {id:"j6l2",name:"数理計算上の差異",make:lv=>{const d=r1k(10,90)*1000,y=10,am=d/y;return[
   TALK([["robo","ピピッ。予想ト実際ノ退職給付債務ガ ズレマシタ"],["tencho","そのズレ(数理計算上の差異)は、平均残存勤務期間で少しずつ費用にするんだよ。"]],null),
   CALC(`当期末に数理計算上の差異(不利差異)${yn(d)}円が発生。翌期から10年で定額法により償却する。翌期の償却額は?`,"償却額",am,`${yn(d)}÷10=${yn(am)}`),
   MC("不利差異の償却額は、退職給付費用を?",["増やす","減らす","変えない"],"増やす","不利差異(債務が予想より大きい)は費用を増やす。")]}},
 {id:"j6l3",name:"掛金と一時金",make:lv=>{const a=r1k(50,200)*10,b=r1k(20,100)*10;return[
   JR(`年金基金に掛金 ${yn(a)}円を普通預金から拠出した。`,[["退職給付引当金",a]],[["普通預金",a]],["退職給付費用","年金資産"].slice(0,1).concat(["前払費用"])),
   JR(`従業員の退職にあたり、退職一時金 ${yn(b)}円を現金で支払った。`,[["退職給付引当金",b]],[["現金",b]],["退職給付費用","給料"]),
   MC("連結財務諸表で、退職給付引当金に相当する科目は?",["退職給付に係る負債","退職給付引当金","未払退職金"],"退職給付に係る負債","連結では「退職給付に係る負債」と表示する。")]}}
]});
K1({id:"j7",no:7,month:"海外展開編",title:"外貨換算の応用",story:"海外の取引先が増え、為替予約で円安・円高に備えることに。",color:"#2a6a3a",lessons:[
 {id:"j7l1",name:"為替予約(取引前)",make:lv=>{const d=r100(10,90),fr=rnd(105,150),y=d*fr;return[
   TALK([["tencho","取引の前に為替予約をしていたら、予約したレートで換算してしまえばいいんだよ(振当処理)。"]],{n:"為替予約(振当処理)",g:"",d:"取引発生時までに予約 → 予約レート(先物レート)で換算。<br>決済時に差損益は出ない。"}),
   CALC(`商品 ${yn(d)}ドルを掛けで輸入。取引前に1ドル=${fr}円で為替予約済み。仕入の金額は?`,"仕入",y,`${yn(d)}×${fr}=${yn(y)}`),
   JR(`商品 ${yn(d)}ドルを掛けで輸入した。取引前に1ドル=${fr}円で為替予約をしている(振当処理)。`,[["仕入",y]],[["買掛金",y]],["為替差損益","前払費用"])]}},
 {id:"j7l2",name:"為替予約(取引後)",make:lv=>{const d=r100(10,50),s0=rnd(110,140),s1=s0+rpick([-3,-2,2,3]),f1=s1+rpick([-2,-1,1,2]),dd=(s1-s0)*d,df=(f1-s1)*d;return[
   TALK([["luna","…取引のあとで予約したら、ズレを2つに分ける。直直差額(取引日→予約日の直物)は当期の損益、直先差額(予約日の直物→先物)は期間配分。"]],null),
   CALC(`買掛金 ${yn(d)}ドル。取引日の直物 ${s0}円、予約日の直物 ${s1}円。直直差額は?(買掛金が増える向きを+)`,"直直差額",dd,`(${s1}−${s0})×${yn(d)}=${yn(dd)}`),
   CALC(`予約日の直物 ${s1}円、先物レート ${f1}円。直先差額は?(買掛金が増える向きを+)`,"直先差額",df,`(${f1}−${s1})×${yn(d)}=${yn(df)}`),
   MC("直先差額の処理は?",["予約日から決済日までの期間に配分","全額を当期の損益","資本に直接計上"],"予約日から決済日までの期間に配分","未経過分は前払費用・前受収益として繰り延べる。")]}},
 {id:"j7l3",name:"外貨建有価証券",make:lv=>{const d=r100(50,200),fd=d+r100(1,20),cr=rnd(110,150),hr=cr-rpick([3,5,8]);return[
   TALK([["robo","ピピッ。外貨建ノ その他有価証券ハ、外貨ノ時価 × 決算日レート"]],null),
   CALC(`その他有価証券(取得 ${yn(d)}ドル、取得時 1ドル=${hr}円)。決算日の時価 ${yn(fd)}ドル、決算日レート ${cr}円。貸借対照表価額は?`,"貸借対照表価額",fd*cr,`${yn(fd)}×${cr}=${yn(fd*cr)}`),
   CALC(`その他有価証券(取得 ${yn(d)}ドル、取得時 1ドル=${hr}円)。決算日の時価 ${yn(fd)}ドル、決算日レート ${cr}円。評価差額(時価の円額 − 取得原価の円額)は?`,"評価差額",fd*cr-d*hr,`${yn(fd*cr)}−${yn(d)}×${hr}=${yn(fd*cr-d*hr)}`),
   MC("外貨建の子会社株式の決算時の換算レートは?",["取得時の為替相場","決算日の為替相場","期中平均相場"],"取得時の為替相場","子会社株式・関連会社株式は取得時レートのまま。")]}}
]});
K1({id:"j8",no:8,month:"海外展開編",title:"税効果会計の応用",story:"税率の変更、回収できるかどうかの判断…税効果の上級テク。",color:"#4a4a6a",lessons:[

   JR(`決算。税率変更で繰延税金資産を ${yn(a0-a1)}円減額する。`,[["法人税等調整額",a0-a1]],[["繰延税金資産",a0-a1]],["法人税等","繰延税金負債"])]}},
 {id:"j8l2",name:"回収可能性",make:lv=>{const t=r1k(200,800)*10,ok=Math.round(t*rpick([.5,.6,.7])/1000)*1000,dta=ok*30/100;return[

   CALC(`将来減算一時差異 ${yn(t)}円のうち、回収可能と判断されたのは ${yn(ok)}円。繰延税金資産は?(税率30%)`,"繰延税金資産",dta,`${yn(ok)}×30%=${yn(dta)}`),

 {id:"j8l3",name:"連結の税効果",make:lv=>{const u=r1k(10,90)*10,t=u*30/100;return[

   JR(`連結。消去した棚卸資産の未実現利益 ${yn(u)}円について税効果会計を適用する(税率30%)。`,[["繰延税金資産",t]],[["法人税等調整額",t]],["繰延税金負債","法人税等"])]}}
]});
K1({id:"j9",no:9,month:"上場編",title:"純資産の応用",story:"ついに上場!自己株式、新株予約権、ストック・オプション…株主との関係が複雑に。",color:"#6a3a7a",lessons:[
 {id:"j9l1",name:"自己株式",make:lv=>{const n=rpick([100,200,500]),p=r100(5,20),fee=r1k(1,9),cost=n*p,sp=p+r100(1,5),sn=n/2;return[
   TALK([["luna","…自社の株を買い戻したら「自己株式」。純資産のマイナス。手数料は取得原価に入れない。"]],{n:"自己株式",g:"",d:"取得:自己株式 / 当座預金(手数料は支払手数料)<br>処分差益 → その他資本剰余金"}),
   JR(`自己株式 ${n}株を @${yn(p)}円で取得し、手数料 ${yn(fee)}円とともに当座預金から支払った。`,[["自己株式",cost],["支払手数料",fee]],[["当座預金",cost+fee]],["資本金","その他資本剰余金"]),
   JR(`自己株式 ${sn}株(帳簿価額 @${yn(p)}円)を @${yn(sp)}円で処分し、当座預金に入金された。`,[["当座預金",sp*sn]],[["自己株式",p*sn],["その他資本剰余金",(sp-p)*sn]],["資本金","自己株式処分益"].slice(0,1).concat(["利益剰余金"]))]}},
 {id:"j9l2",name:"新株予約権",make:lv=>{const n=rpick([10,20,50]),w=r1k(1,5)*10,ex=r1k(10,50)*10,tw=n*w,tx=n*ex,tot=tw+tx;return[
   TALK([["tencho","「決まった値段で株を買える権利」を売ったら「新株予約権」。権利が使われたら資本金に振り替えるよ。"]],{n:"新株予約権",g:"純資産",d:"発行:当座預金 / 新株予約権<br>権利行使:新株予約権+払込金 → 資本金(・資本準備金)"}),
   JR(`新株予約権 ${n}個を1個 ${yn(w)}円で発行し、払込金は当座預金とした。`,[["当座預金",tw]],[["新株予約権",tw]],["資本金","前受金"]),
   JR(`新株予約権 ${n}個すべてが行使され、払込金 ${yn(tx)}円が当座預金に入金された。全額を資本金とする。`,[["当座預金",tx],["新株予約権",tw]],[["資本金",tot]],["資本準備金","自己株式"])]}},
 {id:"j9l3",name:"ストック・オプション",make:lv=>{const n=rpick([50,100,200]),pr=r100(5,20)*3,per=rpick([24,36]),m=12,cost=n*pr*m/per;return[
   TALK([["gou","社員にストック・オプションが配られたッス!"],["luna","…会社側は、権利が確定するまでの勤務期間にわたって費用にする。株式報酬費用。"]],{n:"ストック・オプション",g:"",d:"各期の費用 = 公正な評価単価 × 付与数 × 経過月数 ÷ 対象勤務期間"}),
   CALC(`ストック・オプション ${n}個、公正な評価単価 ${yn(pr)}円、対象勤務期間 ${per}か月。当期(12か月)の費用は?`,"株式報酬費用",cost,`${yn(pr)}×${n}×12/${per}=${yn(cost)}`),
   JR(`決算。株式報酬費用 ${yn(cost)}円を計上する。`,[["株式報酬費用",cost]],[["新株予約権",cost]],["給料","資本金"])]}}
]});
K1({id:"j10",no:10,month:"上場編",title:"社債",story:"工場の増設資金を社債で調達。利息法で帳簿価額を追いかけよう。",color:"#2a7a6a",lessons:[
 {id:"j10l1",name:"発行と利息法",make:lv=>{const F=rpick([10000000,20000000]),c=rpick([1,2]),e=c+1,P=F-r1k(10,90)*10,int=P*e/100,cp=F*c/100,am=int-cp;return[
   TALK([["tencho","額面より安く発行した社債は、満期までに帳簿価額を額面に近づけていく。1級は利息法だよ。"]],null),
   JR(`額面 ${yn(F)}円の社債を ${yn(P)}円で発行し、当座預金に入金された。`,[["当座預金",P]],[["社債",P]],["社債利息","資本金"]),
   CALC(`帳簿価額 ${yn(P)}円、実効利子率 ${e}%。利息配分額(社債利息)は?`,"社債利息",int,`${yn(P)}×${e}%=${yn(int)}`),
   JR(`利払日。クーポン ${yn(cp)}円を当座預金から支払い、償却額 ${yn(am)}円を計上する(社債利息 ${yn(int)}円)。`,[["社債利息",int]],[["当座預金",cp],["社債",am]],["支払利息","社債発行費"])]}},
 {id:"j10l2",name:"定額法と月割",make:lv=>{const F=10000000,P=F-r1k(12,60)*5,y=5,m=rpick([6,9]),am=(F-P)/y*m/12;return[
   CALC(`額面 ${yn(F)}円を ${yn(P)}円で発行(償還期間 ${y}年、定額法)。期中に発行し、決算まで ${m}か月。当期の償却額は?`,"償却額",am,`(${yn(F)}−${yn(P)})÷${y}×${m}/12=${yn(am)}`),
   JR(`決算。社債の償却額 ${yn(am)}円を計上する。`,[["社債利息",am]],[["社債",am]],["社債発行費償却","支払利息"])]}},
 {id:"j10l3",name:"買入償還",make:lv=>{const bv=r1k(450,490)*10,pay=bv+(r1k(-80,80)||20000),gl=bv-pay;return[
   TALK([["luna","…満期前に市場から社債を買い戻したら、帳簿価額と支払額の差が社債償還益(損)。"]],null),
   CALC(`買入償還する社債の帳簿価額 ${yn(bv)}円、支払額 ${yn(pay)}円。社債償還損益は?(益は+、損は−)`,"社債償還損益",gl,`${yn(bv)}−${yn(pay)}=${yn(gl)}`),
   JR(`社債(帳簿価額 ${yn(bv)}円)を ${yn(pay)}円で買入償還し、当座預金から支払った。`,[["社債",bv]].concat(gl<0?[["社債償還損",-gl]]:[]),[["当座預金",pay]].concat(gl>0?[["社債償還益",gl]]:[]),[gl>0?"社債償還損":"社債償還益","社債利息"])]}}
]});
K1({id:"j11",no:11,month:"M&A編",title:"企業結合",story:"ポン吉商店に続いて、ライバルの問屋を合併!企業結合の会計へ。",color:"#3a5a8a",lessons:[
 {id:"j11l1",name:"合併とのれん",make:lv=>{const n=rpick([1000,2000,5000]),p=r100(5,20)*10,cost=n*p,as=Math.round(cost*rpick([1.4,1.6,1.8])/10000)*10000,li=Math.round(as*rpick([.4,.5])/10000)*10000,net=as-li,gw=cost-net;return[
   TALK([["pon","ぼくの店に続いて、となりの問屋まで…ポン"],["tencho","合併したら、受け入れた資産・負債は時価で、払った対価との差がのれんだよ。"]],{n:"取得の会計処理",g:"",d:"取得原価 = 交付した株式の時価<br>のれん = 取得原価 − (資産の時価 − 負債の時価)"}),
   CALC(`株式 ${yn(n)}株(時価 @${yn(p)}円)を交付して合併した。取得原価は?`,"取得原価",cost,`${yn(n)}×${yn(p)}=${yn(cost)}`),
   CALC(`受け入れた資産の時価 ${yn(as)}円、負債の時価 ${yn(li)}円。のれんは?(負ののれんならマイナス)`,"のれん",gw,`${yn(cost)}−(${yn(as)}−${yn(li)})=${yn(gw)}`),
   ...(gw>0?[JR(`合併の仕訳(諸資産 ${yn(as)}円、諸負債 ${yn(li)}円、増加する資本はすべて資本金)。`,[["諸資産",as],["のれん",gw]],[["諸負債",li],["資本金",cost]],["負ののれん発生益","資本準備金"])]:[])]}},
 {id:"j11l2",name:"負ののれん",make:lv=>{const net=r1k(500,900)*10,cost=net-r1k(20,100)*10;return[
   TALK([["niya","安く買えたら得とか当たり前で草"],["luna","…取得原価が純資産の時価より小さいときは「負ののれん発生益」。発生した年の利益にする。"]],null),
   CALC(`取得原価 ${yn(cost)}円、受け入れた純資産の時価 ${yn(net)}円。負ののれん発生益は?`,"負ののれん発生益",net-cost,`${yn(net)}−${yn(cost)}=${yn(net-cost)}`),
   MC("負ののれん発生益の表示区分は?",["特別利益","営業外収益","純資産"],"特別利益","発生した期の特別利益として処理する。")]}},
 {id:"j11l3",name:"株式交換",make:lv=>{const n=rpick([1000,2000]),p=r100(10,30)*10,cost=n*p;return[
   TALK([["tencho","株式交換なら、相手の会社の株を全部もらって、こっちの株を渡す。もらった株は子会社株式だよ。"]],null),
   JR(`株式交換によりC社を完全子会社とし、自社株式 ${yn(n)}株(時価 @${yn(p)}円)を交付した。増加する資本はすべて資本金とする。`,[["子会社株式",cost]],[["資本金",cost]],["のれん","その他有価証券"]),
   MC("株式交換で完全親会社が受け入れる子会社株式の取得原価は?(取得のケース)",["交付した株式の時価","子会社の純資産の帳簿価額","子会社株式の額面"],"交付した株式の時価","取得の場合は対価の時価で測定する。")]}}
]});
K1({id:"j12",no:12,month:"M&A編",title:"連結会計の応用",story:"子会社・関連会社が増えてグループ経営へ。持分法や段階取得もマスターしよう。",color:"#9a2a2a",lessons:[
 {id:"j12l1",name:"子会社の時価評価",make:lv=>{const lnd=r1k(50,200)*10,fv=lnd+r1k(10,80)*10,d=fv-lnd,t=d*30/100;return[
   TALK([["luna","…支配を獲得したら、子会社の資産・負債を時価に評価し直す。評価差額には税効果も。"]],null),
   CALC(`子会社の土地(帳簿価額 ${yn(lnd)}円)の時価は ${yn(fv)}円。税率30%。評価差額(税効果後)は?`,"評価差額",d-t,`${yn(d)}×(1−30%)=${yn(d-t)}`),
   JR(`連結。子会社の土地を時価評価する(税率30%)。`,[["土地",d]],[["繰延税金負債",t],["評価差額",d-t]],["のれん","利益剰余金"])]}},
 {id:"j12l2",name:"持分法",make:lv=>{const ni=r1k(100,500)*10,r=rpick([20,25,30,40]),sh=ni*r/100,dv=r1k(20,100)*10,dsh=dv*r/100;return[
   TALK([["tencho","20%以上の関連会社は、連結せずに「持分法」で、利益の持分だけ投資の金額に足すんだよ。"]],{n:"持分法",g:"",d:"関連会社の純利益 × 持分 → 投資有価証券を増やす<br>(持分法による投資損益)<br>配当を受けたら投資有価証券を減らす"}),
   CALC(`関連会社の当期純利益 ${yn(ni)}円、持分 ${r}%。持分法による投資利益は?`,"投資利益",sh,`${yn(ni)}×${r}%=${yn(sh)}`),
   JR(`持分法。関連会社の当期純利益のうち持分 ${yn(sh)}円を計上する。`,[["投資有価証券",sh]],[["持分法による投資損益",sh]],["受取配当金","子会社株式"]),
   JR(`持分法。関連会社から配当 ${yn(dsh)}円を受け取った(受取配当金として計上済み)。`,[["受取配当金",dsh]],[["投資有価証券",dsh]],["持分法による投資損益","利益剰余金"])]}},
 {id:"j12l3",name:"段階取得",make:lv=>{const bv=r1k(100,400)*10,fv=bv+r1k(10,80)*10;return[
   TALK([["robo","ピピッ。前カラ持ッテイタ株ニ買イ増シテ子会社ニ。前ノ株ハ時価ニ評価シ直シマス"]],{n:"段階取得",g:"",d:"支配獲得日の時価で、以前から持っていた株式を評価し直す。<br>差額 → 段階取得に係る差益(差損)"}),
   CALC(`以前から持っていたS社株式(帳簿価額 ${yn(bv)}円)の支配獲得日の時価は ${yn(fv)}円。段階取得に係る差益は?`,"段階取得に係る差益",fv-bv,`${yn(fv)}−${yn(bv)}=${yn(fv-bv)}`),
   JR(`連結。段階取得により、以前から持っていたS社株式(帳簿価額 ${yn(bv)}円)を支配獲得日の時価 ${yn(fv)}円に評価替えする。`,[["子会社株式",fv-bv]],[["段階取得に係る差益",fv-bv]],["のれん","その他有価証券評価差額金"])]}}
]});
/* ---------- 工業簿記・原価計算 ---------- */
K1({id:"j13",no:13,month:"工場拡大編",title:"費目別計算の応用",story:"工場が3つに増えた!材料副費、予定賃率、相互配賦…細かい計算に強くなろう。",color:"#8a5a14",lessons:[
 {id:"j13l1",name:"材料副費",make:lv=>{const pr=r1k(500,2000),r=rpick([3,4,5]),app=pr*r/100,act=app+(r100(-50,80)||300);return[
   TALK([["robo","ピピッ。材料副費(引取運賃・検収費ナド)ヲ予定配賦シマス"]],null),
   CALC(`材料の購入代価 ${yn(pr)}円、材料副費の予定配賦率 ${r}%。予定配賦額は?`,"予定配賦額",app,`${yn(pr)}×${r}%=${yn(app)}`),
   CALC(`材料の購入代価 ${yn(pr)}円、材料副費の予定配賦率 ${r}%。材料副費の実際発生額は ${yn(act)}円。材料副費差異は?(有利+・不利−)`,"材料副費差異",app-act,`${yn(app)}−${yn(act)}=${yn(app-act)}`)]}},
 {id:"j13l2",name:"予定賃率と賃率差異",make:lv=>{const r=r100(12,20),h=rnd(400,900),app=r*h,act=app+(r100(-60,60)||2000),pre=r1k(50,150),cur=r1k(50,150),paid=act+pre-cur,diff=app-act;return[
   TALK([["luna","…実際の賃金 = 当月支払 − 前月未払 + 当月未払。予定賃率で消費した額との差が賃率差異。"]],null),
   CALC(`当月支払高 ${yn(paid)}円、前月未払 ${yn(pre)}円、当月未払 ${yn(cur)}円。当月の実際消費賃金は?`,"実際消費額",act,`${yn(paid)}−${yn(pre)}+${yn(cur)}=${yn(act)}`),
   CALC(`予定賃率 @${yn(r)}円、実際作業時間 ${h}時間。賃率差異は?(有利+・不利−、実際消費額 ${yn(act)}円)`,"賃率差異",diff,`${yn(r)}×${h}=${yn(app)}、${yn(app)}−${yn(act)}=${yn(diff)}`)]}},
 {id:"j13l3",name:"相互配賦法(簡便法)",make:lv=>{const A=r1k(100,300)*100,B=r1k(100,300)*100,ab=rpick([10,20]),toB=A*ab/100;return[
   TALK([["tencho","補助部門どうしもお互いに助け合ってる。1回目はお互いにも配って、2回目は製造部門だけに配るのが簡便法だよ。"]],{n:"相互配賦法(簡便法)",g:"",d:"第1次配賦:補助部門にも配賦する<br>第2次配賦:受け取った分を製造部門だけに配賦"}),
   CALC(`動力部門費 ${yn(A)}円。第1次配賦で修繕部門に ${ab}%を配賦する。修繕部門への配賦額は?`,"配賦額",toB,`${yn(A)}×${ab}%=${yn(toB)}`),
   MC("相互配賦法(簡便法)の第2次配賦は?",["製造部門だけに配賦","補助部門にも配賦","配賦しない"],"製造部門だけに配賦","第2次配賦は直接配賦法と同じ。")]}}
]});
K1({id:"j14",no:14,month:"工場拡大編",title:"総合原価計算の応用",story:"工程が2つ、製品も等級ごとに…総合原価計算の1級バージョン。",color:"#5a3a8a",lessons:[
 {id:"j14l1",name:"工程別(累加法)",make:lv=>{const q=rnd(5,10)*100,u1=r10(20,60),u2=r10(10,40),f1=q*u1,f2=q*(u1+u2);return[
   TALK([["robo","ピピッ。第1工程ノ完成品ハ、第2工程デ「前工程費」ニナリマス"]],{n:"累加法",g:"",d:"第1工程の完成品原価 → 第2工程の前工程費として加算<br>(始点投入の材料と同じ扱い)"}),
   CALC(`第1工程の完成品 ${q}個、単位原価 @${yn(u1)}円。第2工程に振り替える前工程費は?`,"前工程費",f1,`${q}×${yn(u1)}=${yn(f1)}`),
   CALC(`第1工程から前工程費 ${yn(f1)}円(${q}個分)を受け入れた。第2工程で1個あたり ${yn(u2)}円の加工費がかかり、${q}個すべて完成(仕掛品なし)。完成品原価は?`,"完成品原価",f2,`${yn(f1)}+${q}×${yn(u2)}=${yn(f2)}`)]}},
 {id:"j14l2",name:"等級別計算",make:lv=>{const qa=rnd(2,6)*100,qb=rnd(2,6)*100,ka=1,kb=rpick([0.5,0.8]),pa=qa*ka,pb=qb*kb,unit=r10(10,50),tot=(pa+pb)*unit;return[
   TALK([["luna","…大きさ違いの製品は等価係数で重みをつけて、積数の比で原価を分ける。"]],{n:"等級別総合原価計算",g:"",d:"積数 = 完成品数量 × 等価係数<br>各等級の原価 = 完成品原価 × 積数の比"}),
   CALC(`1級品 ${qa}個(等価係数 ${ka})、2級品 ${qb}個(等価係数 ${kb})。2級品の積数は?`,"積数",pb,`${qb}×${kb}=${pb}`),
   CALC(`完成品原価 ${yn(tot)}円を積数の比(${pa}:${pb})で分ける。2級品の原価は?`,"2級品",pb*unit,`${yn(tot)}×${pb}/${pa+pb}=${yn(pb*unit)}`)]}},
 {id:"j14l3",name:"仕損(度外視法)",make:lv=>{const in_=rnd(10,20)*100,sp=rnd(1,4)*10,eq=rnd(2,5)*100,fq=in_-sp-eq,u=r10(20,50),cost=in_*u,good=fq+eq,unit=cost/good,emv=Math.round(unit*eq);return[
   TALK([["tencho","仕損が工程の始点や途中の早い段階で出たら、完成品と月末仕掛品の両方で負担するんだよ(度外視法)。"]],null),
   CALC(`材料費 ${yn(cost)}円(始点投入)、完成品 ${fq}個、月末仕掛品 ${eq}個、正常仕損 ${sp}個(始点発生・度外視法)。月末仕掛品の材料費は?(円未満四捨五入)`,"月末仕掛品",emv,`${yn(cost)}÷(${fq}+${eq})×${eq}=${yn(emv)}`),
   MC("度外視法とは?",["仕損品の数量を無視して計算し、自動的に良品に負担させる","仕損費を別に計算する","仕損品を製品として売る"],"仕損品の数量を無視して計算し、自動的に良品に負担させる","非度外視法は、正常仕損費を別に計算して配分する。")]}}
]});
K1({id:"j15",no:15,month:"工場拡大編",title:"標準原価計算の応用",story:"差異分析をもっとくわしく。どこで、なぜ、損したのかを突き止めよう。",color:"#1f5a7a",lessons:[
 {id:"j15l1",name:"製造間接費の四分法",make:lv=>{const base=rpick([1000,2000]),vr=r100(2,5),fr=r100(2,6),fix=fr*base,ah=base-rnd(1,4)*50,sh=ah-rnd(1,4)*20,act=vr*ah+fix+(r1k(-30,30)||8000),bud=vr*ah+fix-act,ve=vr*(sh-ah),fe=fr*(sh-ah),op=fr*(ah-base);return[

function rdInit(){REC.road=REC.road||{done:{},boss:{},rv:[],st:{d:"",n:0},xp:0};const r=REC.road;ROAD=r.grade==="2"?ROAD2:r.grade==="1"?ROAD1:ROAD3;r.done=r.done||{};r.boss=r.boss||{};r.rv=r.rv||[];r.st=r.st||{d:"",n:0};return r}
function rdUnlocked(ci,li){/* li=-1 ボス */
  const r=rdInit();
  if(ci>0&&!r.boss[ROAD[ci-1].id])return false;
  const ch=ROAD[ci];
  if(li===-1)return ch.lessons.every(l=>r.done[l.id]);
  for(let i=0;i<li;i++)if(!r.done[ch.lessons[i].id])return false;
  return true;
}
function rdStreakTick(){const r=rdInit(),d=new Date().toDateString();if(r.st.d===d)return false;

let RD=null;
function rdRun(o){
  audioInit();const r=rdInit();let steps=[],title="",hp=5;
  if(o.kind==="lesson"){const l=ROAD[o.ci].lessons[o.li];steps=l.make(Math.min(r.done[l.id]||0,4));title=l.name}
  else if(o.kind==="boss"){const ch=ROAD[o.ci];let pool=[];ch.lessons.forEach(l=>pool=pool.concat(l.make(2).filter(s=>s.t!=="talk")));steps=rshuf(pool).slice(0,8);title="ボス戦";hp=3}
  else if(o.kind==="exam"){steps=examSteps();title="3級模擬試験";hp=999}
  else if(o.kind==="jump"){const pv=ROAD[o.ci-1];let pool=[];for(let k=0;k<4&&pool.length<JUMP_N*2;k++)pv.lessons.forEach(l=>pool=pool.concat(l.make(k?2:1).filter(s=>s.t!=="talk")));
    {const seen=new Set();pool=rshuf(pool).filter(s=>{const key=s.t+(s.acct||"")+String(s.q).replace(/[\d,]/g,"");if(seen.has(key)&&pool.length>JUMP_N)return false;seen.add(key);return true})}
    if(pool.length<JUMP_N){let extra=[];for(let k=0;k<3;k++)pv.lessons.forEach(l=>extra=extra.concat(l.make(2).filter(s=>s.t!=="talk")));const have=new Set(pool.map(s=>s.q));const fresh=rshuf(extra).filter(s=>!have.has(s.q)),dup=rshuf(extra).filter(s=>have.has(s.q));pool=pool.concat(fresh,dup)}
    steps=rshuf(pool).slice(0,JUMP_N);title="飛び級テスト";hp=JUMP_MISS+1}
  else{steps=r.rv.slice(0,10).map(x=>JSON.parse(JSON.stringify(x)));title="復習";if(!steps.length)return}
  RD={o,steps,i:0,hp,hp0:hp,ok:0,ng:0,title,t0:Date.now(),retry:[],total:steps.filter(s=>s.t!=="talk").length,cleared:[]};
  const old=$("#rdov");if(old)old.remove();const ov=document.createElement("div");ov.className="rd";ov.id="rdov";document.body.appendChild(ov);
  if(o.kind==="exam"){RD.exam={t0:Date.now(),lim:3600,got:{1:0,2:0,3:0}};RD.tick=setInterval(()=>{const el=$("#rdtime");if(!RD||!RD.exam){return}const left=RD.exam.lim-Math.floor((Date.now()-RD.exam.t0)/1000);if(el)el.textContent=fmtMS(left);if(left<=0)rdExamEnd(true)},500)}
  rdRender();
}
function fmtMS(t){t=Math.max(0,t);return Math.floor(t/60)+":"+String(t%60).padStart(2,"0")}
function rdClose(){if(RD&&RD.tick)clearInterval(RD.tick);const ov=$("#rdov");if(ov)ov.remove();RD=null;roadScreen()}

  const done=RD.steps.slice(0,RD.i).filter(x=>x.t!=="talk").length;

  const boss=RD.o.kind==="boss";
  ov.innerHTML=`<div class="rdin">
   <div class="rdtop"><button class="rdx" id="rdx" aria-label="やめる">✕</button><div class="rdpb"><i style="width:${prog}%"></i></div>${RD.exam?`<div class="rdtime">⏱ <b id="rdtime">${fmtMS(RD.exam.lim-Math.floor((Date.now()-RD.exam.t0)/1000))}</b></div>`:`<div class="rdhp">❤️<b>${RD.hp}</b></div>`}</div>
   ${RD.exam?`<div class="rdexh">第${s.sec}問 ${s.sec===1?`仕訳 ${s.no}/15`:s.sec===2?"商品有高帳(20点)":"精算表(35点)"}<button class="rdskip" id="rdskip">${RD.i>=RD.steps.length-1?"提出する":"とばす"}</button></div>`:""}
   ${RD.o.kind==="jump"?`<div class="rdexh">⏩ 第${ROAD[RD.o.ci-1].no}章の確認テスト ${Math.min(RD.i+1,RD.steps.length)}/${RD.steps.length}<span style="margin-left:auto;color:var(--mute);font-size:12px">ミスあと${Math.max(0,RD.hp-1)}回</span></div>`:""}

function rdChId(){return RD&&RD.o&&RD.o.ci!=null?ROAD[RD.o.ci].id:null}

function rdGrade(s,v){

  if(s.t==="lr"){const L=[],R=[];for(const i in v)(v[i]==="L"?L:R).push(s.ch[i]);const eq=(a,b)=>a.length===b.length&&a.slice().sort().join()===b.slice().sort().join();return eq(L,s.L)&&eq(R,s.R)}
  if(s.t==="jr"){const pairs=sd=>{const o=[];for(let i=0;i<v.length;i+=2)if(v[i].sd===sd)o.push(v[i].v+":"+v[i+1].v);return o.sort().join()};

const AVCH=[["niya","ニヤ豆","#5f9a2e"],["luna","ルナ","#7b5fb0"],["gou","鉄山 ゴウ","#e0612f"],["robo","カンジョー2号","#3f78c9"]];
function avSrc(k){return k&&AVS[k]?AVS[k][1]:APPICON}
function myAv(){return avSrc(REC.av)}
function avModal(){
  const cur=REC.av||"";
  const m=modal(`<h3>アバターをえらぶ</h3><div class="avsc">
    <div class="avgr"><div class="avgt">デフォルト</div><div class="avgl"><button class="avi ${cur?"":"on"}" data-k=""><img src="${APPICON}" alt="アプリアイコン"></button></div></div>
    ${AVCH.map(([c,n,col])=>`<div class="avgr"><div class="avgt" style="color:${col}">${n}</div><div class="avgl">${Object.keys(AVS).filter(k=>k.startsWith(c+"_")).map(k=>`<button class="avi ${cur===k?"on":""}" data-k="${k}" aria-label="${n} ${AVS[k][0]}"><img src="${AVS[k][1]}" alt=""><small>${AVS[k][0]}</small></button>`).join("")}</div></div>`).join("")}
  </div><button class="big sec" id="avc">とじる</button>`);
  m.querySelector(".mbox").classList.add("avbox");
  m.querySelectorAll(".avi").forEach(b=>b.onclick=()=>{REC.av=b.dataset.k;saveRec();se("item");m.remove();if(NET.nr&&NET.screen==="lobby"){setPres({av:REC.av||""});renderLobby()}else navTo(NAV)});
  m.querySelector("#avc").onclick=()=>m.remove();
}

let NAV="home";
function shell(tab,inner){
  NAV=tab;gInit();const L=lvInfo(),mc=msClaimable();
  return`<div class="sg">
   <div class="tbar">
    <button class="avbtn" id="avb" aria-label="アバターを変える"><img class="av" src="${myAv()}" alt=""><i>✎</i></button>
    <div class="pinfo"><button class="pname" id="pname">${esc(REC.name||"プレイヤー")} ✎</button><span id="cico" class="cico">${CLOUD.user?(CLOUD.err?"⚠️":"☁️"):""}</span>
     <div class="lvrow"><span class="lv">Lv.${L.lv}</span><div class="xpb"><i style="width:${L.cur/L.need*100}%"></i></div></div></div>
    <div class="pills"><div class="pill coin">🪙<b class="mono">${REC.coins}</b></div><div class="pill part">🔩<b class="mono">${REC.parts||0}</b></div>${REC.tix?`<div class="pill tix">🎟️<b class="mono">${REC.tix}</b></div>`:""}</div>
   </div>
   <div class="pg">${inner}</div>
   <nav class="bnav">
    ${[["home","🏠","ホーム"],["road","📗","ロード"],["battle","⚔️","バトル"],["gacha","🎰","ガチャ"],["col","🧰","コレクション"],["set","⚙️","設定"]].map(([t,i,l])=>`<button data-nav="${t}" class="${tab===t?"on":""}"><span>${i}</span><small>${l}</small>${t==="home"&&mc?`<em class="bdg">${mc}</em>`:""}</button>`).join("")}
   </nav></div>`;
}
function bindShell(){
  app.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{se("key","IN");navTo(b.dataset.nav)});
  const pn=$("#pname");if(pn)pn.onclick=nameModal;const avb=$("#avb");if(avb)avb.onclick=avModal;
}
function navTo(t){
  if(ONTITLE){titleCloud();return}
  if(t==="home")return homeScreen();
  if(t==="battle")return vsMenu();
  if(t==="road")return roadScreen();
  if(t==="gacha"||t==="col")return gachaScreen(t);
  if(t==="set")return settingsScreen();
}
function modal(html){const m=document.createElement("div");m.className="mdl";m.innerHTML=`<div class="mbox">${html}</div>`;document.body.appendChild(m);m.onclick=e=>{if(e.target===m)m.remove()};return m}
function nameModal(){
  const m=modal(`<h3>名前を変える</h3><input id="nmi" maxlength="10" value="${esc(REC.name||"")}" placeholder="なまえ"><button class="big" id="nmok">決定</button>`);
  m.querySelector("#nmok").onclick=()=>{REC.name=m.querySelector("#nmi").value.trim()||"プレイヤー";saveRec();m.remove();navTo(NAV)};
}
function newsModal(){const m=modal(`<h3>📢 お知らせ</h3>${NEWS.map(([d,t])=>`<div class="nw"><span>${d}</span>${t}</div>`).join("")}<button class="big sec" id="nwok">とじる</button>`);m.querySelector("#nwok").onclick=()=>m.remove()}
function missionHTML(){
  const s=msState();
  return MISSIONS.map(m=>{const v=Math.min(s[m.id]||0,m.goal),done=v>=m.goal,got=s.got[m.id];
    return`<div class="ms ${done?"done":""} ${got?"got":""}"><div class="mt"><b>${m.n}</b><div class="mp"><i style="width:${v/m.goal*100}%"></i></div><small>${v}/${m.goal}</small></div>
     ${got?`<span class="mgot">受取済</span>`:done?`<button class="mclaim" data-m="${m.id}">🪙${m.rw}<br>受け取る</button>`:`<span class="mrw">🪙${m.rw}</span>`}</div>`}).join("");
}
function bindMissions(){app.querySelectorAll(".mclaim").forEach(b=>b.onclick=()=>{const m=MISSIONS.find(x=>x.id===b.dataset.m),s=msState();if(s.got[m.id])return;s.got[m.id]=1;addCoins(m.rw);se("item");toast(`🪙 +${m.rw}コイン!`);homeScreen()})}

function startCpuBattle(lv){const s=bset(),c2=s.gr==="2"?CPU2[lv]:null;
  startBattle("cpu",{lv,seed:battleBase(newCode()+":"+Date.now()),oppName:c2?c2.n:CPU_LV[lv].n,cpuWho:c2?lv:null})}
/* ================= ランクマッチ =================
   表:ティア(ブロンズ〜簿記マスター)+pt、裏:レート(イロ)でマッチングとCPUの強さを決める。
   順位表:public.rank_board(season,grade,user_id PK)。Googleログイン中だけ送信。 */
const TIERS=[["ブロンズ","🥉","#d08f55"],["シルバー","🥈","#c3cbe0"],["ゴールド","🥇","#f5c542"],["プラチナ","💠","#5fe0d0"],["ダイヤ","💎","#7ab8ff"],["簿記マスター","👑","#ff6ec7"]];
const RK_MASTER=1500,RK_WAIT=30;
const GHOSTS=["電卓の亡霊","夜勤の経理","決算の鬼","仕訳マシーン","伝説の簿記係","締め日の番人","貸借の妖精","監査の影"];
function seasonKey(d){d=d||new Date();const j=new Date(d.getTime()+9*3600e3);return j.getUTCFullYear()+"-"+String(j.getUTCMonth()+1).padStart(2,"0")}
function seasonLabel(k){const[y,m]=(k||seasonKey()).split("-");return`${y}年${+m}月シーズン`}
function rankOf(gr){REC.rank=REC.rank||{};let R=REC.rank[gr];const sk=seasonKey();
  if(!R)R=REC.rank[gr]={season:sk,r:1200,pt:0,w:0,l:0,best:0,streak:0,hist:[]};
  if(R.season!==sk){R.hist=(R.hist||[]).concat([{s:R.season,pt:R.pt,best:R.best,w:R.w,l:R.l}]).slice(-12);
    R.pt=Math.min(1200,Math.floor(R.pt*.5/100)*100);R.r=Math.round((R.r+1200)/2);R.w=0;R.l=0;R.best=R.pt;R.streak=0;R.season=sk;saveRec()}
  return R}
function tierOf(pt){if(pt>=RK_MASTER)return{t:5,div:"",in:pt-RK_MASTER};const t=Math.floor(pt/300);return{t,div:["III","II","I"][Math.floor(pt%300/100)],in:pt%100}}
function tierName(pt){const T=tierOf(pt);return TIERS[T.t][0]+(T.div?" "+T.div:"")}
function rkBadge(pt,sz){const T=tierOf(pt),c=TIERS[T.t];return`<span class="rkb ${sz||""}" style="--tc:${c[2]}"><i>${c[1]}</i><b>${tierName(pt)}</b></span>`}
function rkBar(pt){const T=tierOf(pt);return T.t===5?`<div class="rkbar m"><i style="width:100%"></i><span>${T.in} MP</span></div>`:`<div class="rkbar"><i style="width:${T.in}%;background:${TIERS[T.t][2]}"></i><span>${T.in} / 100 pt</span></div>`}
function rankApply(gr,win,oppR,cpu){
  const R=rankOf(gr),before=R.pt,tb=tierOf(before),r0=R.r;
  const exp=1/(1+Math.pow(10,(oppR-r0)/400));R.r=Math.round(r0+(cpu?20:32)*((win?1:0)-exp));
  let d,bonus=0;
  if(win){d=Math.round(20+Math.max(-8,Math.min(10,(oppR-r0)/20)));R.streak=Math.max(0,R.streak||0)+1;if(R.streak>=3)bonus=5;if(cpu)d=Math.round(d*.8);d+=bonus;R.w++}
  else{d=-Math.round(15+Math.max(-5,Math.min(8,(r0-oppR)/25)));R.streak=Math.min(0,R.streak||0)-1;R.l++}
  const floor=tb.t===5?RK_MASTER-100:tb.t*300;   /* ティア落ちなし(マスターだけダイヤIまで落ちる) */
  R.pt=Math.max(floor,Math.max(0,before+d));const ta=tierOf(R.pt);R.best=Math.max(R.best||0,R.pt);
  let msg="";
  if(ta.t>tb.t)msg=`⬆️ 昇格!${TIERS[ta.t][1]} ${tierName(R.pt)}`;
  else if(ta.t<tb.t)msg=`⬇️ 降格… ${tierName(R.pt)}`;
  else if(tierName(R.pt)!==tierName(before))msg=R.pt>before?`⬆️ ${tierName(R.pt)} に上がった!`:`⬇️ ${tierName(R.pt)} に下がった`;
  else if(!win&&R.pt===floor&&before+d<floor)msg=`🛡️ ${TIERS[tb.t][0]}から落ちることはないよ`;
  saveRec();rkUpload(gr);
  return{gr,before,after:R.pt,d:R.pt-before,msg,bonus,cpu}}
function rankResHTML(x){return`<div class="rkres"><div class="rkt">🏆 ランクマッチ ${x.gr}級${x.cpu?" <small>(vs CPU)</small>":""}</div>
  ${rkBadge(x.after,"lg")}<div class="rkd ${x.d>=0?"up":"dn"}">${x.d>=0?"+":""}${x.d} pt</div>${rkBar(x.after)}
  ${x.bonus?`<div class="rkmsg">🔥 連勝ボーナス +${x.bonus}</div>`:""}${x.msg?`<div class="rkmsg">${x.msg}</div>`:""}</div>`}
function rkCpuL(r){const t=Math.max(-.3,Math.min(1.3,(r-800)/1200));return{n:"ゴースト",read:Math.max(4,16-10*t),spd:Math.max(6,28-17*t),acc:Math.min(.96,.65+.25*t),itm:Math.min(.7,.25+.35*t)}}
/* ---- マッチング(待合室 bb-q-<級> の presence を全員が同じ規則でペアにする) ---- */
const RQ={nr:null,gr:"",t0:0,id:"",tk:null,cand:null,candN:0,peers:[],off:false,unsub:null,munsub:null,inv:null,done:false};
function rkLeave(){if(RQ.tk)clearInterval(RQ.tk);RQ.tk=null;if(RQ.nr){try{RQ.unsub&&RQ.unsub();RQ.munsub&&RQ.munsub()}catch(e){}RQ.nr.leave().catch(()=>{})}RQ.nr=null;RQ.unsub=null;RQ.munsub=null;RQ.peers=[];RQ.inv=null}
async function rankQueue(gr,keep){
  stopCpu();leaveNet();rkLeave();NET.ranked=null;G=null;
  const R=rankOf(gr);Object.assign(RQ,{gr,t0:keep&&keep.t0?Math.max(keep.t0,Date.now()-(RK_WAIT-10)*1000):Date.now(),inv:null,done:false,id:Math.random().toString(36).slice(2,10),cand:null,candN:0,peers:[],off:false});
  app.innerHTML=`<div class="title"><div class="lobby rkq"><div class="lc">🏆 ランクマッチ ${gr}級</div>${rkBadge(R.pt,"lg")}
    <div class="rkspin"></div><div class="ls" id="rqs">対戦相手をさがしています…</div><div class="rqt mono" id="rqt">0:00</div><small id="rqn"></small>
    <small class="rqh">${RK_WAIT}秒たっても見つからなければ、近い強さのCPU(ゴースト)と対戦します</small>
    <button class="big sec" id="rqc">キャンセル</button></div></div>`;
  $("#rqc").onclick=()=>{rkLeave();vsMenu()};
  RQ.tk=setInterval(rkTick,700);
  if(!ROOM||!navigator.onLine){RQ.off=true;return}
  try{const nr=await ROOM.join("bb-q-"+gr);if(RQ.gr!==gr||!RQ.tk){nr.leave().catch(()=>{});return}
    RQ.nr=nr;nr.presence({v:NETV,q:1,id:RQ.id,r:R.r,pt:R.pt,t:RQ.t0,nm:REC.name||"プレイヤー"}).catch(()=>{});
    RQ.unsub=nr.onPeers(ch=>{RQ.peers=ch.peers||[]});
    RQ.munsub=nr.onMsg(m=>{if(!m||RQ.done||RQ.gr!==gr)return;
      if(m.t==="inv"&&m.to===RQ.id){nr.send({t:"acc",to:m.from,from:RQ.id,code:m.code});rkCommit(m.code,m.from)}
      else if(m.t==="acc"&&m.to===RQ.id&&RQ.inv&&m.code===RQ.inv.code)rkCommit(m.code,m.from)})}catch(e){RQ.off=true}
}
function rkPair(){
  const t=Date.now(),seen=new Set();
  const list=RQ.peers.map(p=>p.presence).filter(p=>p&&p.q&&p.v===NETV&&p.id&&!seen.has(p.id)&&seen.add(p.id)).sort((a,b)=>(a.t-b.t)||(a.id<b.id?-1:1));
  const used=new Set();
  for(const a of list){if(used.has(a.id))continue;
    for(const b of list){if(b===a||used.has(b.id))continue;
      const w=(t-Math.min(a.t,b.t))/1000;
      if(Math.abs(a.r-b.r)<=150+12*w){used.add(a.id);used.add(b.id);if(a.id===RQ.id)return b;if(b.id===RQ.id)return a;break}}}
  return null}
function rkTick(){
  if(!RQ.tk)return;const el=(Date.now()-RQ.t0)/1000;
  const tt=$("#rqt");if(!tt){rkLeave();return}tt.textContent=fmtMS(Math.floor(el));
  const n=new Set(RQ.peers.map(p=>p.presence&&p.presence.q&&p.presence.id).filter(Boolean)).size;
  const rn=$("#rqn");if(rn)rn.textContent=RQ.off?"オンラインにつながらないので、CPUと対戦します":`いま${RQ.gr}級で待っている人:${Math.max(1,n)}人`;
  if(RQ.done)return;
  const o=RQ.off?null:rkPair();
  if(RQ.inv&&Date.now()-RQ.inv.at>3500)RQ.inv=null;   /* 返事がなければ出し直す */
  if(o){const s1=$("#rqs");if(s1)s1.textContent=`相手が見つかった!(${o.nm||"?"})つないでいます…`;
    /* 先に待っていた方が招待を送り、相手の「OK」が返ってきてから2人とも部屋へ移る */
    const meP=(RQ.peers.map(p=>p.presence).find(p=>p&&p.id===RQ.id))||{t:RQ.t0,id:RQ.id};
    const iProp=(meP.t-o.t)<0||(meP.t===o.t&&RQ.id<o.id);
    if(iProp&&(!RQ.inv||RQ.inv.to!==o.id)){const code="rk"+[RQ.id,o.id].sort().join("");RQ.inv={to:o.id,code,at:Date.now()};RQ.nr&&RQ.nr.send({t:"inv",to:o.id,from:RQ.id,code})}
    else if(iProp&&RQ.inv&&Date.now()-RQ.inv.at>1200&&!RQ.inv.re){RQ.inv.re=1;RQ.nr&&RQ.nr.send({t:"inv",to:o.id,from:RQ.id,code:RQ.inv.code})}}
  else{const s1=$("#rqs");if(s1)s1.textContent="対戦相手をさがしています…"}
  if(el>=(RQ.off?4:RK_WAIT)){const gr=RQ.gr;rkLeave();rkCpuStart(gr)}
}

let quitArmed=0,skipArmed=0;
function skipArm(){const n=Date.now();if(n-skipArmed<2000){skipArmed=0;return true}skipArmed=n;toast(isVS()&&G.streak>0?`もう一度押すとスキップ(${G.streak}連鎖が0になる)`:"もう一度押すとスキップ");return false}
function confirmQuit(){const n=Date.now();if(n-quitArmed<2000)return true;quitArmed=n;toast("もう一度✕で中断");return false}
function evalExpr(s){
  if(s==null)return NaN;
  const e=String(s).replace(/,/g,"").replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-");
  if(!e.trim()||!/^[0-9+\-*/().\s]+$/.test(e))return NaN;
  try{const v=Function('"use strict";return ('+e+')')();return typeof v==="number"&&isFinite(v)?v:NaN}catch(_){return NaN}
}
function paintBlanks(){
  app.querySelectorAll(".blank").forEach(b=>{
    const i=+b.dataset.b,bl=P.blanks[i],v=P.vals[i];
    b.classList.toggle("on",i===P.active&&!P.locked);
    if(i===P.active&&!P.locked&&isPhone()&&b._was!==true){try{b.scrollIntoView({block:"nearest"})}catch(e){}}
    b._was=(i===P.active);
    if(bl.t==="ch")b.innerHTML=v||"<span style='color:#aab'>選択</span>";
    else{const n=evalExpr(v);b.innerHTML=`<span>${v===""?"&nbsp;":(isNaN(n)?esc(v):yen(n))}</span>`}

function cur(){return Number(C.disp)}
function setNum(v){if(!isFinite(v)||Math.abs(v)>=1e12){C.err=true;C.disp="0";return}v=Math.round(v*1e8)/1e8;C.disp=String(v)}
function apply(a,op,b){return op==="+"?a+b:op==="-"?a-b:op==="*"?a*b:b===0?NaN:a/b}

  if(C.k){const a=C.k.a,x=cur(),o=C.k.op;setNum(o==="*"?a*x:o==="+"?x+a:o==="-"?x-a:(a===0?NaN:x/a));C.fresh=true;return}
  if(C.op){const arg=C.fresh&&C.lastArg!==null&&C.acc===null?C.lastArg:cur();
    const r=apply(C.acc,C.op,arg);C.lastOp=C.op;C.lastArg=arg;setNum(r);C.acc=null;C.op=null}

function calcKey(k){
  if(!P){if(RDCALC&&$("#calc")){se("key",k);calcKey0(k)}return}
  se("key",k);
  const preD=cur(),preF=C.fresh,preK=!!C.k,preV=P.vals[P.active],pa=P.active,preM=C.mem;
  calcKey0(k);
  try{
    if("+-*/".includes(k)&&k.length===1){
      if(C.k&&!preK){TAPE.cur=TAPE.cur.trim()+SYM[k]+" (定数) "}
      else if(!preF||!TAPE.cur)TAPE.cur+=fnum(preD)+" "+SYM[k]+" ";
      else TAPE.cur=TAPE.cur.replace(/[+−×÷] $/,SYM[k]+" ");
    }else if(k==="="){tapePush((TAPE.cur||"")+(preF&&!TAPE.cur?fnum(preD)+" ":TAPE.cur?fnum(preD)+" ":"")+"= "+fnum(cur()));TAPE.cur=""}
    else if(k==="%"){if(TAPE.cur){tapePush(TAPE.cur+fnum(preD)+"% = "+fnum(cur()));TAPE.cur=""}}
    else if(k==="SQ"){tapePush("√"+fnum(preD)+" = "+fnum(cur()))}
    else if(k==="TXIN"||k==="TXOUT"){tapePush(fnum(preD)+(k==="TXIN"?" 税込":" 税抜")+" = "+fnum(cur()))}
    else if(k==="GT"){tapePush("GT = "+fnum(cur()))}
    else if(k==="M+"||k==="M-"){tapePush((k==="M+"?"M+ ":"M− ")+fnum(cur())+"  (M="+fnum(C.mem)+")");TAPE.cur=""}
    else if(k==="AC"){if(TAPE.cur){TAPE.cur=""}}
    else if(k==="IN"&&P.vals[pa]!==preV){const ln=P.lines.find(l=>l[1]===pa);tapePush("→ "+(ln?ln[0]:"欄")+":"+fnum(evalExpr(P.vals[pa])))}
  }catch(e){}

}
function paintTape(){

  b.scrollTop=b.scrollHeight;

function calcKey0(k){
  if(!P&&!RDCALC)return;
  if(P&&P.locked&&k==="IN")return;
  guideTrack(k);
  C.hist.push(k);if(C.hist.length>5)C.hist.shift();
  if(C.egg){C.egg=0}
  if(C.err&&k!=="AC"&&k!=="C"){paintGuide();return}
  if(/^\d$/.test(k)||k==="00"){
    if(C.fresh){C.disp=k==="00"?"0":k;C.fresh=false}
    else{const digits=C.disp.replace(/[-.]/g,"").length;if(digits>=12)return;C.disp=C.disp==="0"?(k==="00"?"0":k):C.disp+k}
  }else if(k==="."){if(C.fresh){C.disp="0.";C.fresh=false}else if(!C.disp.includes("."))C.disp+="."}
  else if("+-*/".includes(k)){
    if(C.lastKey===k&&C.op===k&&C.fresh){/* 同じ演算キー2回 → 定数計算(K) */C.k={op:k,a:C.acc};C.op=null;C.acc=null;C.fresh=true}
    else{C.k=null;if(C.op&&!C.fresh)setNum(apply(C.acc,C.op,cur()));C.acc=cur();C.op=k;C.fresh=true}}
  else if(k==="="){const had=!!(C.op||C.k||C.lastOp);finish_eq();if(had||true){C.gt=(C.gt||0)+cur()}}
  else if(k==="GT"){setNum(C.gt||0);C.fresh=true}
  else if(k==="TXIN"){if(C.op&&!C.fresh)finish_eq();setNum(Math.round(cur()*1.1));C.fresh=true}
  else if(k==="TXOUT"){if(C.op&&!C.fresh)finish_eq();setNum(Math.round(cur()/1.1));C.fresh=true}
  else if(k==="NOP"){toast("このキーはゲームでは使わないよ")}
  else if(k==="CA"){C.disp="0";C.acc=null;C.op=null;C.fresh=true;C.lastOp=null;C.lastArg=null;C.err=false;C.k=null;C.mem=0;C.gt=0}
  else if(k==="%"){if(C.op){const a=C.acc,b=cur();let r;
      if(C.op==="*")r=a*b/100;else if(C.op==="/")r=a/b*100;else if(C.op==="+")r=a+a*b/100;else r=a-a*b/100;
      setNum(r);C.acc=null;C.op=null;C.fresh=true}}
  else if(k==="SQ"){setNum(Math.sqrt(Math.abs(cur())));C.fresh=true}
  else if(k==="NEG"){if(C.disp!=="0")C.disp=C.disp.startsWith("-")?C.disp.slice(1):"-"+C.disp}
  else if(k==="BS"){if(!C.fresh){C.disp=C.disp.slice(0,-1);if(C.disp===""||C.disp==="-")C.disp="0"}}
  else if(k==="C"){C.disp="0";C.fresh=true;C.err=false}
  else if(k==="AC"){C.disp="0";C.acc=null;C.op=null;C.fresh=true;C.lastOp=null;C.lastArg=null;C.err=false;C.k=null;C.gt=0;
    const seq=C.hist.join(",")==="1,3,7,9,AC",held=["1","3","7","9"].every(x=>HELD.has(x));
    if(seq||held){se("egg");C.egg=Date.now()+2500;setTimeout(()=>{if(C.egg&&Date.now()>=C.egg){C.egg=0;paintCalc()}},2600)}}
  else if(k==="M+"||k==="M-"){if(C.op)finish_eq();C.mem+=(k==="M+"?1:-1)*cur();C.fresh=true}
  else if(k==="MR"){setNum(C.mem);C.fresh=true}
  else if(k==="MC"){C.mem=0}
  else if(k==="IN"&&!P){if(C.op&&!C.fresh)finish_eq();const v=cur();C.acc=null;C.op=null;C.fresh=true;C.lastKey=k;paintCalc();RDCALC.onIn(v);return}
  else if(k==="IN"){
    if(C.op&&!C.fresh)finish_eq();
    const bl=P.blanks[P.active];
    if(bl.t==="ch"){toast("この欄は選択肢から選んでね");return}
    if(P.judged&&P.judged[P.active]!==undefined){advance();paintCalc();return}
    P.vals[P.active]=String(cur());C.acc=null;C.op=null;C.fresh=true;progress();
    if(isVS()&&G.fx.typoPending){G.fx.typoPending=false;P.vals[P.active]=typoOf(P.vals[P.active])}
    const b=app.querySelector(`.blank[data-b="${P.active}"]`);if(b){b.classList.remove("flash");void b.offsetWidth;b.classList.add("flash")}
    if(isVS())judgeBlank(P.active);
    advance();
  }
  C.lastKey=k;
  paintCalc();paintGuide();
}

/* ================= 検算ガイド ================= */
const KLAB={"*":"×","/":"÷","-":"−","NEG":"+/−","IN":"入力","M-":"M−","BS":"▶"};
function guideKeys(seq){const out=[];seq.concat(["IN"]).forEach((t,ti)=>{if(typeof t==="number"){String(t).split("").forEach(ch=>out.push({k:ch,t:ti}))}else out.push({k:t,t:ti})});return out}
function guideOn(){return !!(G&&P&&!P.locked&&G.fx&&((G.fx.guideUntil&&now()<G.fx.guideUntil)||G.fx.auto===P.active))}
function guideTimed(){return G.fx.guideUntil&&now()<G.fx.guideUntil}
function guideTrack(k){
  if(!guideOn())return;
  const bl=P.blanks[P.active];if(bl.t!=="num"||!bl.g)return;
  const gs=G.fx.gstep;if(gs.b!==P.active){gs.b=P.active;gs.s=0;gs.off=false}
  if(k==="CA")k="AC";
  const keys=guideKeys(bl.g),exp=keys[gs.s];
  if(exp&&k===exp.k&&!gs.off){gs.s++;if(k==="IN"){gs.b=-1}}
  else if(k==="00"&&exp&&exp.k==="0"&&keys[gs.s+1]&&keys[gs.s+1].k==="0"&&keys[gs.s+1].t===exp.t&&!gs.off){gs.s+=2}
  else if(k==="AC"){const i=keys.findIndex(x=>x.k==="AC");gs.s=i+1;gs.off=false}
  else if(k==="MC"&&keys[0].k==="MC"){gs.s=1;gs.off=false}
  else gs.off=true;
}
function paintGuide(){
  const box=$("#guide");if(!box)return;
  app.querySelectorAll(".ck.hint").forEach(x=>x.classList.remove("hint"));
  if(!guideOn()){box.style.display="none";return}
  box.style.display="block";
  const left=guideTimed()?Math.ceil((G.fx.guideUntil-now())/1000)+"s":"自動";
  const bl=P.blanks[P.active];
  if(bl.t!=="num"||!bl.g){box.innerHTML=`<div class="gh">🧮 検算ガイド <span>${left}</span></div><div class="gt">この欄は選択式(ガイドなし)</div>`;return}
  const gs=G.fx.gstep;if(gs.b!==P.active){gs.b=P.active;gs.s=0;gs.off=false}
  const keys=guideKeys(bl.g),seq=bl.g.concat(["IN"]);
  const curT=gs.off?-1:(keys[gs.s]?keys[gs.s].t:seq.length);
  box.innerHTML=`<div class="gh">🧮 ${guideTimed()?"検算ガイド":"お助けガイド"} <span>${left}</span></div><div class="gt">${seq.map((t,i)=>`<span class="${i<curT?"dn":i===curT?"cu":""}">${typeof t==="number"?yen(t):(KLAB[t]||t)}</span>`).join("")}</div>${gs.off?`<div class="goff">ずれたよ → AC から打ち直し</div>`:""}`;
  if(!gs.off&&keys[gs.s]){const b=app.querySelector(`.ck[data-k="${CSS.escape(keys[gs.s].k)}"]`);if(b)b.classList.add("hint");
    if(keys[gs.s].k==="0"&&keys[gs.s+1]&&keys[gs.s+1].k==="0"&&keys[gs.s+1].t===keys[gs.s].t){const b2=app.querySelector('.ck[data-k="00"]');if(b2)b2.classList.add("hint")}}

}

function applyMessy(){
  if(!P||P.locked){G.fx.messyNext=true;return}
  const np=makeProblem(P.base,P.idx,P.messyN+1);if(!np)return;
  P.blanks.forEach((old,i)=>{const v=P.vals[i];if(v==="")return;
    const right=old.t==="ch"?v===old.ans:Math.abs(evalExpr(v)-old.ans)<0.5;
    np.vals[i]=right?(np.blanks[i].t==="ch"?np.blanks[i].ans:String(np.blanks[i].ans)):v});
  np.judged=P.judged.slice();np.active=P.active;P=np;G.fx.gstep={b:-1,s:0};
  renderGame();
}
function typoOf(v){
  let neg=v.startsWith("-"),s=neg?v.slice(1):v;
  const d=s.split("");const idx=[];for(let i=0;i<d.length-1;i++)if(/\d/.test(d[i])&&/\d/.test(d[i+1])&&d[i]!==d[i+1])idx.push(i);
  if(idx.length){const i=idx[Math.floor(Math.random()*idx.length)];[d[i],d[i+1]]=[d[i+1],d[i]]}
  else{const ds=[];d.forEach((c,i)=>{if(/\d/.test(c))ds.push(i)});const i=ds[ds.length-1];d[i]=String((+d[i]+3)%10)}
  s=d.join("").replace(/^0+(?=\d)/,"");return(neg?"-":"")+s;
}
function applyTypo(){
  if(C.disp.replace(/[-.]/g,"").length>=3&&!C.err){C.disp=typoOf(C.disp);paintCalc();const n=$("#cnum");if(n){n.classList.remove("tp");void n.offsetWidth;n.classList.add("tp")}return}
  if(!P||P.locked){G.fx.typoPending=true;return}
  const cand=P.blanks.map((b,i)=>b.t==="num"&&P.vals[i]!==""&&P.judged[i]===undefined&&!isNaN(evalExpr(P.vals[i]))?i:-1).filter(i=>i>=0);
  if(!cand.length){G.fx.typoPending=true;return}
  const i=cand[Math.floor(Math.random()*cand.length)];P.vals[i]=typoOf(String(evalExpr(P.vals[i])));paintBlanks();
}

/* --- CPU --- */
const CPU={timer:null,qi:0,next:0,streak:0,shield:false,typo:false};
function startCpu(){Object.assign(CPU,{qi:0,streak:0,shield:false,typo:false,boostUntil:0});cpuSchedule();stopCpu();CPU.timer=setInterval(cpuStep,200)}
function stopCpu(){if(CPU.timer)clearInterval(CPU.timer);CPU.timer=null}
function cpuSchedule(){const L=G.cpuL||CPU_LV[G.lv],p=makeProblem(G.base,CPU.qi);CPU.n=p.blanks.length;CPU.next=now()+(L.read+CPU.n*L.spd)*(0.75+Math.random()*.5)*1000}
function cpuStep(){
  if(!G||G.mode!=="cpu"||G.ended||!G.running)return;
  if(now()<CPU.next)return;
  const L=G.cpuL||CPU_LV[G.lv];let ok=0,dmg=0;
  const res=[];for(let i=0;i<CPU.n;i++)res.push(Math.random()<L.acc);
  if(CPU.typo){const k=res.indexOf(true);if(k>=0)res[k]=false;CPU.typo=false}
  const s0=CPU.streak;let atk=0;
  res.forEach(r=>{if(r){ok++;CPU.streak++;dmg+=dmgFor(CPU.streak);if(CHAIN_ATK(CPU.streak))atk=CPU.streak}else CPU.streak=0});
  G.oppStreak=CPU.streak;
  if(CPU.streak>s0)oppChainFx(Math.max(s0+1,CPU.streak-ok+1),CPU.streak);
  if(dmg){G.oppHp=Math.min(MAXHP,G.oppHp+dmg);G.oppHealed+=dmg;setTimeout(()=>pop(`+${dmg}`,"var(--gold)","#hpop"),ok*280)}
  if(atk)setTimeout(()=>receiveAttack("chain",null,atk),ok*280+200);
  if(ok===CPU.n&&Math.random()<L.itm){
    if(Math.random()<.18&&!CPU.shield){CPU.shield=true;banner(`相手が🛡️内部統制を整備した`,"info")}
    else{const t=["messy","shuffle","typo"][Math.floor(Math.random()*3)];setTimeout(()=>receiveAttack(t),300)}
  }
  CPU.qi++;cpuSchedule();paintHP();
}
function cpuReceive(t){
  if(CPU.shield){CPU.shield=false;setTimeout(()=>banner("相手の🛡️内部統制にブロックされた…","info"),700);return}
  if(t==="messy")CPU.next+=8000;else if(t==="shuffle")CPU.next+=4000;else if(t==="typo")CPU.typo=true;
}

  NET.pres=NET.bc?{v:NETV,nm:name,st:"lobby",rd:false,ra:0,gid:0,ff:0,av:REC.av||"",bs:rk?rk.gr+".all":bsetKey(bset()),...(rk?{rk:{r:rankOf(rk.gr).r,pt:rankOf(rk.gr).pt}}:{})}
                 :{v:NETV,nm:name,st:"lobby",rd:false,ra:0,gid:0,hp:HP0,dead:false,at:[],bl:[],sk:0,ff:0,av:REC.av||"",bs:rk?rk.gr+".all":bsetKey(bset()),...(rk?{rk:{r:rankOf(rk.gr).r,pt:rankOf(rk.gr).pt}}:{})};
  NET.nr.presence(NET.pres).catch(()=>{});
  NET.unsub=NET.nr.onPeers(ch=>netPeers(ch.peers));
  if(NET.bc)NET.munsub=NET.nr.onMsg(netMsg);
  NET.screen="lobby";renderLobby();
}
function renderLobby(){
  if(NET.screen!=="lobby")return;
  const o=NET.opp,op=o&&o.presence||{};
  const me=NET.pres;
  app.innerHTML=`<div class="title"><button class="back" id="bk">← もどる</button>
   <div class="lobby">
    <div class="lc">${NET.ranked?`🏆 ランクマッチ ${NET.ranked.gr}級 ・ マッチング成立!`:`部屋 <b class="mono">${esc(NET.code)}</b>`}</div>
    <div class="pl"><div class="pc ${me.rd?"rd":""}"><img class="pav" src="${myAv()}" alt=""><b>${esc(me.nm)}</b><small>あなた</small><span>${me.rd?"準備OK":"待機中"}</span></div>
     <div class="vsx">VS</div>
     <div class="pc ${op.rd?"rd":""}">${o?`<img class="pav" src="${avSrc(op.av)}" alt=""><b>${esc(op.nm||"?")}</b><small>${NET.ranked&&op.rk?rkBadge(+op.rk.pt||0,"sm"):"相手"}</small><span>${op.st==="play"?"対戦中…":op.rd?"準備OK":"待機中"}</span>`:`<b>…</b><small>相手を待っています</small><span>同じ部屋コードで入室してもらってね</span>`}</div></div>
    <button class="big ${me.rd?"sec":""}" id="rdy" ${o?"":"disabled"}>${me.rd?"準備OKを取り消す":"準備OK!"}</button>
    <div class="ls" style="margin-top:12px">2人とも「準備OK」で対戦スタート ・ <b>${bsLabel(o?roomBs():me.bs)}</b></div>
    ${o&&(op.v||0)!==NETV?netErrHTML("E12"):o&&(op.bs||"1.all")!==(me.bs||"1.all")?`<div class="ls">設定がちがうので、先に準備OKした人の「${bsLabel(roomBs())}」で対戦するよ</div>`:""}
    <div id="netw" data-h=""></div>
   </div></div>`;
  $("#bk").onclick=()=>{leaveNet();vsMenu()};
  $("#rdy").onclick=()=>{setPres(me.rd?{rd:false}:{rd:true,ra:Date.now()});renderLobby();checkStart()};
  if(NET.ranked){const r=$("#rdy");if(r)r.style.display="none";
    if(o&&!me.rd&&(op.v||0)===NETV){setPres({rd:true,ra:Date.now()});setTimeout(()=>{renderLobby();checkStart()},0)}}
}
function netPeers(peers){
  if(!NET.nr)return;
  const others=peers.filter(p=>!p.sameTab&&p.presence&&typeof p.presence.nm==="string").sort((a,b)=>a.peer<b.peer?-1:1);NET.nOthers=others.length;
  const prev=NET.opp;
  NET.opp=others.find(p=>prev&&p.peer===prev.peer)||others[0]||null;
  if(NET.screen==="lobby"){renderLobby();checkStart();return}
  if(G&&G.mode==="online"&&!G.ended){
    const o=NET.opp;
    if(!o){if(!NET.missAt)NET.missAt=Date.now();return}
    NET.missAt=0;
    const op=o.presence;
    if(op.ff&&op.ff===G.gid){endBattle(true,"相手が降参した");return}
    if(!NET.bc)netApply(op);
  }
}
function netMsg(p){
  if(!G||G.mode!=="online"||G.ended||!p)return;
  if(p.gid!==G.gid)return;
  NET.msgAt=Date.now();NET.missAt=0;
  netApply(p);
}
function netApply(op){
  if(op.ff&&op.ff===G.gid){endBattle(true,"相手が降参した");return}
  if(op.gid!==G.gid)return;
  if(typeof op.hp==="number")G.oppPub={hp:op.hp,at:now()};
  if(op.dead){endBattle(true,"相手の体力が0になった");return}
  const nsk=Number(op.sk)||0;if(nsk>(G.oppStreak||0))oppChainFx((G.oppStreak||0)+1,nsk);G.oppStreak=nsk;
  (Array.isArray(op.at)?op.at:[]).forEach(a=>{if(a&&typeof a.id==="string"&&!G.seen.has(a.id)){G.seen.add(a.id);receiveAttack(a.t,a.id,a.n)}});
  const mine=new Set(G.myAtks.map(a=>a.id));
  (Array.isArray(op.bl)?op.bl:[]).forEach(id=>{if(mine.has(id)&&!G.seenBl.has(id)){G.seenBl.add(id);banner("相手の🛡️内部統制にブロックされた…","info")}});
  paintHP();
}
/* 退出判定:自分の接続が生きていて、相手が部屋から消えたまま10秒、かつ相手からの通信も10秒ない時だけ */
function netWatch(){
  if(!G||G.mode!=="online"||G.ended||!NET.nr)return;
  const t=Date.now();
  if(NET.nr.ok===false){NET.missAt=0;const d=NET.nr.downAt?t-NET.nr.downAt:0;
    if(d>20000){netFatal("E21");return}
    if(d>2000&&!G.nwarn){G.nwarn=1;banner("📡 通信が切れた…再接続中(E20)","info")}return}
  if(G.nwarn){G.nwarn=0;banner("📡 再接続できた!","info")}
  if(!navigator.onLine&&!G.offw){G.offw=1;banner("📡 インターネットにつながっていません(E01)","info")}else if(navigator.onLine)G.offw=0;
  const quiet=t-(NET.msgAt||t);
  if(NET.opp&&G.running&&quiet>6000&&!G.qwarn){G.qwarn=1;banner("⏳ 相手からの通信が止まっています(E22)","info")}
  if(quiet<3000)G.qwarn=0;
  if(NET.opp||!NET.missAt)return;
  if(t-NET.missAt>=10000&&t-(NET.msgAt||0)>=10000)endBattle(true,"相手が退出した");
}
function netFatal(code){
  if(!G||G.ended)return;G.ended=true;stopTimer();bgmStop();try{pause()}catch(e){}
  document.querySelectorAll(".fb,.banner").forEach(x=>x.remove());
  app.innerHTML=`<div class="title"><div class="lobby">${netErrHTML(code)}<button class="big" id="retry" style="margin-top:14px">部屋に入り直す</button><button class="big sec" id="home2" style="margin-top:8px">もどる</button></div></div>`;
  $("#retry").onclick=()=>{G=null;lobby(NET.code,NET.name)};$("#home2").onclick=()=>{G=null;leaveNet();vsMenu()};
}
function bsLabel(k){if(!k)return"1級・全部";const [g,s]=k.split(".");return`${g}級・${{all:"全部",com:"商業",ind:"工業"}[s]||"全部"}`}
const NETV=4;
/* 級・範囲がちがうときは、先に「準備OK」した人の設定に合わせる(同時なら文字順) */
function roomBs(){const o=NET.opp,op=o&&o.presence||{},me=NET.pres;const a=me.bs||"1.all",b=op.bs||"1.all";if(a===b)return a;
  const ra=me.rd?Number(me.ra)||0:Infinity,rb=op.rd?Number(op.ra)||0:Infinity;if(ra!==rb)return ra<rb?a:b;return a<b?a:b}
function checkStart(){
  const o=NET.opp;if(!o||NET.screen!=="lobby")return;
  const op=o.presence,me=NET.pres;
  if((op.v||0)!==NETV)return;
  const bs=roomBs();
  const gid0=Math.max(Number(me.ra)||0,Number(op.ra)||0);
  /* 相手が先に始めた(準備OK→対戦中が同時に届いた)場合も一緒に始める */
  if(me.rd&&me.st==="lobby"&&((op.rd&&op.st==="lobby")||(op.st==="play"&&op.gid===gid0&&gid0>0))){
    const gid=gid0;
    NET.screen="play";NET.missAt=0;NET.msgAt=Date.now()+4000;
    if(NET.bc){setPres({st:"play",rd:false,gid,ff:0});NET.gs={gid,hp:HP0,dead:false,at:[],bl:[],sk:0}}
    else setPres({st:"play",rd:false,gid,hp:HP0,dead:false,at:[],bl:[],sk:0,ff:0});
    startBattle("online",{seed:NET.code+":"+gid+"#"+bs,gid,myName:me.nm,oppName:op.nm||"相手"});
    if(NET.ranked&&G)G.ranked={gr:NET.ranked.gr,oppR:+(op.rk&&op.rk.r)||rankOf(NET.ranked.gr).r,cpu:false};
  }
}
function netPub(){
  if(!G||G.mode!=="online")return;
  G.lastPub=now();
  if(!NET.bc)setPres({st:G.ended?"end":"play"});
  netGame({gid:G.gid,hp:Math.max(0,Math.round(G.hp*10)/10),dead:G.hp<=0,at:G.myAtks.slice(-8),bl:G.blocked.slice(-8),sk:G.streak});
}
function netForfeit(){if(NET.nr&&G){if(NET.bc)netGame({gid:G.gid,ff:G.gid});setPres({st:"lobby",rd:false,ff:G.gid});NET.screen="";const nr=NET.nr;NET.nr=null;
  try{NET.unsub&&NET.unsub()}catch(e){}try{NET.munsub&&NET.munsub()}catch(e){}NET.opp=null;NET.unsub=null;NET.munsub=null;
  setTimeout(()=>nr.leave().catch(()=>{}),700)}}
function backToLobby(){G=null;setPres({st:"lobby",rd:false,ff:0});NET.screen="lobby";renderLobby()}

titleScreen();
cloudInit().then(()=>{if(ONTITLE)titleCloud();else if(CLOUD.user)navTo(NAV);else cloudRefreshUI()});

</script>
