<style>
:root{--bg:#0e1424;--panel:#172036;--panel2:#1f2a44;--line:#2c3a5c;--ink:#eef3ff;--mute:#8d9bbd;
--neon:#39ff9a;--gold:#ffd23f;--red:#ff5d6c;--blue:#4da3ff;--pink:#ff6ec7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"M PLUS Rounded 1c",system-ui,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font-family:inherit;cursor:pointer}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.wrap{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
/* title */
.title{padding:28px 20px 30px}
.logo{text-align:center;margin:10px 0 6px}
.logo h1{margin:0;font-size:40px;font-weight:800;letter-spacing:.04em;background:linear-gradient(90deg,var(--neon),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo p{margin:4px 0 0;color:var(--mute);font-weight:700;font-size:13px;letter-spacing:.2em}
.mode{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--panel);border-radius:18px;padding:16px 18px;margin-top:14px;color:var(--ink);position:relative;overflow:hidden}
.mode:active{transform:scale(.985)}
.mode b{display:block;font-size:20px}
.mode span{font-size:13px;color:var(--mute);line-height:1.6;display:block;margin-top:2px}
.mode .best{position:absolute;right:16px;top:16px;font-size:13px;color:var(--gold)}
.mode.ta{border-color:#2f6b55}.mode.ta b{color:var(--neon)}
.mode.sa{border-color:#6b2f5f}.mode.sa b{color:var(--pink)}
.code{margin-top:22px;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:14px 16px}
.code label{font-size:13px;color:var(--mute);font-weight:700}
.code .row{display:flex;gap:10px;margin-top:8px;align-items:center}
.code input{flex:1;min-width:0;background:var(--bg);border:2px solid var(--line);border-radius:12px;color:var(--ink);font:800 22px "JetBrains Mono",monospace;padding:8px 12px;letter-spacing:.2em}
.code small{display:block;color:var(--mute);font-size:12px;margin-top:8px;line-height:1.6}
.sbtn{border:2px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:12px;padding:10px 12px;font-weight:800;font-size:13px}
.recs{margin-top:22px}
.recs h3{font-size:14px;color:var(--mute);margin:0 0 8px}
.rec{display:flex;justify-content:space-between;padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px}
.rec .r{font-weight:800}
.empty{color:var(--mute);font-size:13px;padding:8px 0}
.rules{margin-top:22px;color:var(--mute);font-size:12px;line-height:1.8}
/* countdown */
.cd{flex:1;display:flex;align-items:center;justify-content:center;font:800 120px "JetBrains Mono",monospace;color:var(--neon)}
.cd span{animation:cdp .9s ease-out}
@keyframes cdp{0%{transform:scale(2);opacity:0}30%{opacity:1}100%{transform:scale(.9);opacity:.6}}
/* game */
.game{display:flex;flex-direction:column;height:100vh;height:100dvh}
.game,.game *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.game textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
.game button,.game canvas{touch-action:manipulation}
.game #cv{touch-action:none}
.hud{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#0a0f1c;border-bottom:2px solid var(--line)}
.hud .t{font:800 30px "JetBrains Mono",monospace;color:var(--neon);letter-spacing:.02em}
.hud .t.warn{color:var(--red)}
.hud .p{font-weight:800;color:var(--mute);font-size:14px;text-align:right;line-height:1.3}
.hud .p b{color:var(--ink);font-size:18px}
.hud .x{background:none;border:none;color:var(--mute);font-size:22px;padding:0 6px}
.pen{color:var(--red);font-size:12px}
.prob{flex:1;overflow-y:auto;padding:12px 14px 8px;-webkit-overflow-scrolling:touch}
.cat{display:inline-block;font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--panel2);color:var(--blue);margin-bottom:6px}
.ptitle{font-size:16px;font-weight:800;margin:2px 0 10px;line-height:1.5;white-space:pre-line}
.data{width:100%;border-collapse:collapse;background:var(--panel);border-radius:12px;overflow:hidden;font-size:14px;margin-bottom:12px}
.data td{padding:7px 10px;border-bottom:1px solid var(--line)}
.data td:last-child{text-align:right;font-family:"JetBrains Mono",monospace;font-weight:600}
.data tr:last-child td{border-bottom:none}
.sheet{background:#fdfcf6;color:#1e2433;border-radius:12px;padding:6px 12px}
.ln{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px dashed #d9d4bd;font-weight:700;font-size:14px;flex-wrap:wrap}
.ln:last-child{border-bottom:none}
.ln .lab{flex:1 1 auto}
.blank{min-width:120px;min-height:38px;border:2px solid #b9c3d8;background:#fff;border-radius:8px;font:800 17px "JetBrains Mono",monospace;color:#1e2433;text-align:right;padding:4px 10px;display:inline-flex;flex-direction:column;align-items:flex-end;justify-content:center}
.blank.ch{min-width:72px;text-align:center;align-items:center;font-family:"M PLUS Rounded 1c",sans-serif}
.blank.on{border-color:var(--blue);box-shadow:0 0 0 3px rgba(77,163,255,.35)}
.blank .pv{font-size:11px;color:#6b7590;font-weight:600}
.blank.ok{border-color:#1fbf6c;background:#e6fff1}
.blank.ng{border-color:var(--red);background:#ffecee}
.blank .ca{font-size:12px;color:#1fbf6c;font-weight:800}
.unit{font-size:12px;color:#6b7590;margin-left:2px}
.note{font-size:11.5px;color:var(--mute);margin:8px 2px 0;line-height:1.6}
/* keypad */
.pad{background:#0a0f1c;border-top:2px solid var(--line);padding:8px 8px 10px}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.k{border:none;border-radius:10px;background:var(--panel2);color:var(--ink);font:800 20px "JetBrains Mono",monospace;padding:11px 0}
.k:active{background:var(--line)}
.k.op{color:var(--blue);background:#18233c}
.k.fn{font-size:14px;font-family:"M PLUS Rounded 1c",sans-serif;color:var(--mute)}
.acts{display:flex;gap:6px;margin-top:6px}
.acts .k{flex:1;font-size:15px;font-family:"M PLUS Rounded 1c",sans-serif}
.k.go{background:var(--neon);color:#062413}
.k.nx{background:#24365d;color:var(--ink)}
.chs{display:flex;gap:8px;margin-bottom:6px}
.chs .k{flex:1;font-family:"M PLUS Rounded 1c",sans-serif;font-size:17px;background:#2a3554}
/* feedback */
.fb{position:fixed;inset:auto 0 0 0;max-width:560px;margin:0 auto;background:var(--panel);border-top:3px solid var(--neon);border-radius:20px 20px 0 0;padding:16px 18px 22px;z-index:20;animation:up .25s ease-out;max-height:70vh;overflow-y:auto}
.fb.bad{border-color:var(--red)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.fb h3{margin:0 0 6px;font-size:20px}
.fb.good h3{color:var(--neon)}.fb.bad h3{color:var(--red)}
.fb .meta{font-size:13px;color:var(--mute);margin-bottom:8px}
.fb pre{white-space:pre-wrap;font:600 13px/1.7 "M PLUS Rounded 1c",sans-serif;color:var(--ink);background:var(--bg);border-radius:10px;padding:10px 12px;margin:0 0 12px}
.big{display:block;width:100%;border:none;border-radius:14px;padding:15px;font-size:17px;font-weight:800;background:var(--neon);color:#062413}
.big.sec{background:var(--panel2);color:var(--ink);border:2px solid var(--line)}
.pop{position:fixed;left:50%;top:84px;transform:translateX(-50%);font:800 22px "JetBrains Mono",monospace;pointer-events:none;z-index:30;animation:pp 1s ease-out forwards}
@keyframes pp{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-30px)}}
/* result */
.res{padding:30px 20px;text-align:center}
.rank{font:800 110px "JetBrains Mono",monospace;line-height:1;margin:6px 0;animation:rk .6s cubic-bezier(.2,1.6,.4,1)}

.csl button b{display:block;font-size:14px}.csl button small{color:var(--mute);font-size:11px}
.csl button.on{border-color:var(--neon);background:#12301f}
.ck.nop{opacity:.75}
/* カシオ実務型 */
.calc.th-az{background:linear-gradient(#aebbc5,#8d9ca8)}
.th-az .cdisp{background:#b9c3a6}
.th-az .ck{background:#2d3035;color:#f2f2f2;box-shadow:0 2px 0 #121417}
.th-az .ck.mem{background:#5468b0;color:#fff;box-shadow:0 2px 0 #34427a}
.th-az .ck.clr{background:#8c3d55;color:#fff;box-shadow:0 2px 0 #5a2233}

.th-az .ck.in{background:var(--neon);color:#062413}
/* カシオ卓上型 */
.calc.th-df{background:linear-gradient(#e4e6e8,#c9cdd1)}
.th-df .cdisp{background:#cfdcdf}
.th-df .ck{background:#f7f8f9;color:#2a2d31;box-shadow:0 2px 0 #a9aeb4}

/* シャープ型 */
.calc.th-sh{background:linear-gradient(#c8ccd0,#a9aeb3);border-top:6px solid #15171a}
.th-sh .cdisp{background:#b8c4ad}

.th-sh .ck.in{background:var(--neon);color:#062413}
/* テンキー逆さま */
.calc.th-tel{background:linear-gradient(#1b2340,#11172b)}
.th-tel .ck{border-radius:50px;background:#2b3558;color:#fff;box-shadow:0 2px 0 #151b30}
.th-tel .ck.op,.th-tel .ck.eq{background:#ff9f43;color:#fff;box-shadow:0 2px 0 #b8691f}
.th-tel .ck.clr{background:#ff5d6c;color:#fff}
.th-tel .ck.in{background:var(--neon);color:#062413}

/* ===== 横画面(広い画面)では電卓を大きく ===== */
@media (min-width:900px){
  .calc{display:flex;flex-direction:column;min-height:0}
  .calc .ckeys2{flex:1 1 auto;min-height:0;gap:6px}
  .calc .cdisp{flex:0 0 auto}
  .calc .tape{flex:0 0 auto}
  .ck{font-size:clamp(17px,1.9vw,26px)}
  .ck.mem,.ck.fn,.ck.clr,.ck.tax,.ck.time,.ck.in{font-size:clamp(13px,1.4vw,19px)}
  .cnum{font-size:clamp(28px,3vw,40px)}
  /* 右手:右の列は電卓が主役、メモは上に小さく */
  .gright{width:40%;max-width:520px}
  .gright .memo2{flex:0 0 26%;min-height:110px}
  .gright .calc{flex:1 1 auto}
  /* 左手:電卓の列を太くして上まで使う */
  .gbody.lefty .calc{width:clamp(340px,34vw,470px);flex:0 0 auto;justify-content:stretch}
  .gbody.lefty .memo2{width:clamp(190px,18vw,280px);flex:0 0 auto}
}

/* ===== ガチャ画面 ===== */
.mode.gc{border-color:#6b5a2f;background:linear-gradient(135deg,#2a2412,#1f1a2e)}.mode.gc b{color:var(--gold)}
.tcoin{display:flex;justify-content:center;gap:6px;align-items:center;margin-top:6px;font-weight:800;color:var(--gold)}
.gtop{display:flex;justify-content:space-between;align-items:center}
.coins{display:flex;align-items:center;gap:6px;background:var(--panel);border:2px solid #6b5a2f;border-radius:99px;padding:4px 12px}
.coins b{font-size:18px;color:var(--gold)}.coins small{color:var(--mute);font-size:11px;margin-left:4px}
.gtabs{display:flex;gap:8px;margin:14px 0}
.gtabs button{flex:1;border:2px solid var(--line);background:var(--panel);color:var(--mute);border-radius:12px;padding:10px;font-weight:800}
.gtabs button.on{border-color:var(--gold);color:var(--gold)}
.machine{width:220px;margin:6px auto 14px;position:relative}
.machine.shake2{animation:shk .25s 3}
.dome{height:150px;border-radius:110px 110px 18px 18px;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.45),rgba(255,255,255,.08) 45%,rgba(120,160,255,.12));border:4px solid #c9d3ef;position:relative;overflow:hidden}
.dome i{position:absolute;left:var(--x);top:var(--y);width:30px;height:30px;border-radius:50%;background:linear-gradient(var(--c) 50%,#fff 50%);box-shadow:inset -3px -3px 0 rgba(0,0,0,.15)}
.mbody{height:110px;background:linear-gradient(#ff5d6c,#d63a52);border-radius:14px;margin-top:-6px;position:relative}
.slot2{position:absolute;left:24px;bottom:18px;width:54px;height:40px;background:#3b1020;border-radius:10px}
.handle{position:absolute;right:30px;top:24px;width:46px;height:46px;border-radius:50%;background:#fff;border:6px solid #f2c94c}
.machine.shake2 .handle{animation:spin .7s}
@keyframes spin{to{transform:rotate(360deg)}}
.mname{position:absolute;left:0;right:0;top:4px;text-align:center;color:#fff;font-weight:800;font-size:13px;letter-spacing:.1em}
.pbtns{display:flex;gap:8px}.pbtns .big{flex:1;font-size:16px}

.ptip{color:var(--mute);font-size:12px}.ptip b{color:var(--ink)}
.h3 .unq{float:right;border:1px solid var(--line);background:var(--panel);color:var(--mute);border-radius:8px;font-size:11px;padding:2px 8px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.citem,.gcard{background:var(--panel);border:2px solid var(--rc);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:3px;position:relative}
.citem.on{box-shadow:0 0 0 3px var(--neon)}
.citem.lock .mini{filter:grayscale(1) brightness(.5)}
.citem b,.gcard b{font-size:13px}.citem small,.gcard small{font-size:10.5px;color:var(--mute)}
.rr{position:absolute;right:6px;top:6px;z-index:2;font:800 11px "JetBrains Mono",monospace;background:var(--rc);color:#111;border-radius:6px;padding:1px 6px}
.eqb,.exb{border:none;border-radius:8px;padding:6px;font-weight:800;font-size:12px;background:var(--neon);color:#062413;margin-top:2px}
.exb{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.cnt{position:absolute;left:8px;top:6px;font-size:11px;color:var(--mute);z-index:2}
.mini.calc{padding:6px;border-radius:10px;pointer-events:none}
.mini .cdisp{padding:2px 6px;margin-bottom:4px}.mini .cnum{font-size:15px}
.mini .mk{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,18px);gap:3px}
.mini .ck{font-size:10px;display:flex;align-items:center;justify-content:center;border-radius:4px;padding:0}
.mini .mk .ck:nth-child(1){grid-area:1/1}.mini .mk .ck:nth-child(2){grid-area:1/2}.mini .mk .ck:nth-child(3){grid-area:1/3}

<div class="toast" id="toast"></div>
<script>
/* ================================================================
   ボキバトル 1級  —  タイムアタック / スコアアタック / 対戦(CPU・オンライン)
   ================================================================ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
const yen=n=>Number(n).toLocaleString("ja-JP");
const sgn=n=>(n>0?"+":n<0?"−":"±")+yen(Math.abs(n));
const OFF=(n)=>{const a=[];for(let i=-n;i<=n;i++)if(i)a.push(i);return a};

/* ---------- 問題を作るための乱数コンテキスト ----------
   構造(比率・方向など)は sr、数字の「細かさ」だけ mr で変える。
   → 端数地獄で同じ問題のまま数字だけ細かくできる */
function ctx(seed,messySeed,mu){
  const sr=mulberry32(seed),mr=messySeed?mulberry32(messySeed):null;
  const c={
    messy:!!mr,
    ri:(a,b)=>a+Math.floor(sr()*(b-a+1)),
    pick:a=>a[Math.floor(sr()*a.length)],
    rnd:()=>sr(),
    M:(a,b,k)=>{const base=a+Math.floor(sr()*(b-a+1));if(!mr)return base*k;
      let v=base*k+Math.round((mr()-.5)*Math.abs(k)*.9);v=Math.round(v/mu)*mu;return v===0?mu:v},
    R:(x,u)=>mr?Math.round(x):Math.round(x/u)*u,
    ok:true
  };
  return c;
}
const K=(...a)=>a;

/* ---------- 問題ジェネレーター ----------
   blank: {t:"num",ans,g:[電卓ガイド]} / {t:"ch",opts,ans} */
const GENS=[
function consA(c){
  const r=c.pick([60,70,75,80,90]),C=c.M(5,15,1000),E=c.M(1,6,1000),T=C+E,g=c.M(1,10,100),PI=T*r/100,P=PI+g,nci=T*(100-r)/100;
  return{cat:"連結会計",title:`P社はS社の発行済株式の${r}%を${yen(P)}で取得し、支配を獲得した。\n支配獲得日の連結修正について答えなさい。`,
  data:[["S社 資本金",C],["S社 利益剰余金",E],["取得原価(S社株式)",P],["P社の持分比率",r+"%"]],
  lines:[["のれん",0],["非支配株主持分",1]],
  blanks:[{t:"num",ans:g,g:K("AC",T,"*",r,"%","NEG","+",P,"=")},{t:"num",ans:nci,g:K("AC",T,"*",100-r,"%")}],
  ex:`S社資本 ${yen(T)}\nP社持分 ${yen(T)}×${r}%=${yen(PI)}\nのれん ${yen(P)}−${yen(PI)}=${yen(g)}\n非支配株主持分 ${yen(T)}×${100-r}%=${yen(nci)}`,chk:[PI]};
},
function consB(c){
  const r=c.pick([60,70,75,80,90]),C=c.M(5,15,1000),E=c.M(1,6,1000),T=C+E,g=c.M(1,10,200),P=T*r/100+g,NI=c.M(4,30,100);
  const am=g/20,ncNI=NI*(100-r)/100,nci=(T+NI)*(100-r)/100;
  return{cat:"連結会計",title:`前期末にP社はS社株式の${r}%を${yen(P)}で取得した。\n当期のS社の当期純利益は${yen(NI)}(配当なし)。のれんは20年で定額償却する。`,
  data:[["取得時 S社資本金",C],["取得時 S社利益剰余金",E],["取得原価",P],["S社 当期純利益",NI]],
  lines:[["のれん償却額",0],["非支配株主に帰属する当期純利益",1],["当期末の非支配株主持分",2]],
  blanks:[{t:"num",ans:am,g:K("AC",T,"*",r,"%","NEG","+",P,"=","/",20,"=")},{t:"num",ans:ncNI,g:K("AC",NI,"*",100-r,"%")},{t:"num",ans:nci,g:K("AC",T,"+",NI,"=","*",100-r,"%")}],
  ex:`のれん ${yen(P)}−${yen(T)}×${r}%=${yen(g)} → ÷20=${yen(am)}\n非支配株主に帰属 ${yen(NI)}×${100-r}%=${yen(ncNI)}\n期末非支配株主持分 (${yen(T)}+${yen(NI)})×${100-r}%=${yen(nci)}`,chk:[P]};
},
function consC(c){
  const r=c.pick([60,70,75,80]),S=c.M(1,10,2000),p=c.pick([20,25,30]),up=c.rnd()<.6,U=S*p/100,nc=up?U*(100-r)/100:0;
  return{cat:"連結会計",title:`${up?"S社(子会社)がP社(親会社)":"P社(親会社)がS社(子会社)"}に商品を販売している。\n売上総利益率は売価の${p}%。P社のS社に対する持分比率は${r}%。`,
  data:[[up?"P社の期末商品(S社から仕入)":"S社の期末商品(P社から仕入)",S],["売上総利益率",p+"%"],["期首商品の未実現利益","なし"]],
  lines:[["期末商品に含まれる未実現利益",0],["非支配株主持分への負担額",1]],
  blanks:[{t:"num",ans:U,g:K("AC",S,"*",p,"%")},{t:"num",ans:nc,g:up?K("AC",S,"*",p,"%","*",100-r,"%"):K("AC",0)}],
  ex:`未実現利益 ${yen(S)}×${p}%=${yen(U)}\n${up?`アップストリームなので非支配株主も負担:${yen(U)}×${100-r}%=${yen(nc)}`:"ダウンストリームなので全額親会社負担。非支配株主の負担は0"}`};
},
function taxA(c){
  const X=c.M(5,30,1000),Kx=c.M(1,9,100),A=c.M(1,9,100),tax=(X+Kx+A)*30/100,adj=A*30/100,NI=X-tax+adj;
  return{cat:"税効果会計",title:"次の資料から、損益計算書の金額を求めなさい。\n法定実効税率は30%。",
  data:[["税引前当期純利益",X],["交際費の損金不算入額",Kx],["貸倒引当金の繰入限度超過額(当期発生)",A]],
  lines:[["法人税、住民税及び事業税",0],["法人税等調整額(△で表示)",1],["当期純利益",2]],
  blanks:[{t:"num",ans:tax,g:K("AC",X,"+",Kx,"+",A,"=","*",30,"%")},{t:"num",ans:-adj,g:K("AC",A,"*",30,"%","NEG")},{t:"num",ans:NI,g:K("AC",X,"+",Kx,"=","*",30,"%","NEG","+",X,"=")}],
  ex:`課税所得 ${yen(X)}+${yen(Kx)}+${yen(A)}=${yen(X+Kx+A)} → ×30%=${yen(tax)}\n法人税等調整額 ${yen(A)}×30%=△${yen(adj)}(交際費は永久差異なので対象外)\n当期純利益 ${yen(X)}−${yen(tax)}+${yen(adj)}=${yen(NI)}`,note:"△はマイナス(電卓の +/−)で入力"};
},
function taxB(c){
  const s=c.rnd()<.65?1:-1,cost=s>0?c.M(10,50,100):c.M(20,50,100),dm=s>0?c.M(1,15,100):c.M(1,6,100),d=dm*s,fv=cost+d,dt=dm*30/100,oci=d*70/100;
  if(fv<=0||dm<=0)c.ok=false;
  return{cat:"税効果会計",title:"その他有価証券を期末に時価評価する(全部純資産直入法)。\n法定実効税率は30%。",
  data:[["取得原価",cost],["期末時価",fv]],
  lines:[["計上する繰延税金",0],["その金額",1],["その他有価証券評価差額金(借方なら−)",2]],
  blanks:[{t:"ch",opts:["資産","負債"],ans:d>0?"負債":"資産"},{t:"num",ans:dt,g:d>0?K("AC",fv,"-",cost,"=","*",30,"%"):K("AC",cost,"-",fv,"=","*",30,"%")},{t:"num",ans:oci,g:K("AC",fv,"-",cost,"=","*",70,"%")}],
  ex:`評価差額 ${yen(fv)}−${yen(cost)}=${d>0?"":"△"}${yen(dm)}\n${d>0?"評価差益→将来加算一時差異→繰延税金負債":"評価差損→将来減算一時差異→繰延税金資産"} ${yen(dm)}×30%=${yen(dt)}\n評価差額金 ${sgn(oci)}(70%分)`};
},
function ret(c){
  const PBO=c.M(10,50,1000),dr=c.pick([1,1.5,2]),PA=c.M(5,9,1000),er=c.pick([2,2.5,3]),SC=c.M(5,20,100),Kc=c.M(3,15,100);
  const it=PBO*dr/100,ex=PA*er/100,cost=SC+it-ex,end=PBO-PA+cost-Kc;
  if(PA>=PBO)c.ok=false;
  return{cat:"退職給付会計",title:"次の資料から当期の金額を求めなさい。\n未認識の差異はない。",
  data:[["期首 退職給付債務",PBO],["期首 年金資産",PA],["勤務費用",SC],["割引率",dr+"%"],["長期期待運用収益率",er+"%"],["年金掛金の拠出額",Kc]],
  lines:[["利息費用",0],["期待運用収益",1],["退職給付費用",2],["期末 退職給付引当金",3]],
  blanks:[{t:"num",ans:it,g:K("AC",PBO,"*",dr,"%")},{t:"num",ans:ex,g:K("AC",PA,"*",er,"%")},
    {t:"num",ans:cost,g:K("MC","AC",PBO,"*",dr,"%","M+",SC,"M+",PA,"*",er,"%","M-","MR")},
    {t:"num",ans:end,g:K("MC","AC",PBO,"M+",PA,"M-",PBO,"*",dr,"%","M+",SC,"M+",PA,"*",er,"%","M-",Kc,"M-","MR")}],
  ex:`利息費用 ${yen(PBO)}×${dr}%=${yen(it)}\n期待運用収益 ${yen(PA)}×${er}%=${yen(ex)}\n退職給付費用 ${yen(SC)}+${yen(it)}−${yen(ex)}=${yen(cost)}\n期末引当金 (${yen(PBO)}−${yen(PA)})+${yen(cost)}−${yen(Kc)}=${yen(end)}`};
},
function imp(c){
  const BV=c.M(10,60,1000),impd=c.rnd()<.75;
  let a,b,d;if(impd){a=c.ri(70,95);b=c.ri(35,65);d=c.ri(40,68)}else{a=c.ri(102,130);b=c.ri(50,85);d=c.ri(55,90)}
  if(d===b)d++;
  const CF=c.R(BV*a/100,100),N=c.R(BV*b/100,100),V=c.R(BV*d/100,100),RA=Math.max(N,V),loss=CF<BV?BV-RA:0;
  return{cat:"減損会計",title:"減損の兆候がある固定資産について答えなさい。",

    let bq=null,bt=null,blast=0;
    const peers=()=>{const st=(ch&&ch.presenceState())||{};const out=[];
      for(const k in st){const arr=st[k]||[];const p=arr[arr.length-1]||{};const o={};for(const f in p)if(f!=="presence_ref")o[f]=p[f];
        out.push({peer:k,sameTab:k===myKey,isMe:k===myKey,presence:k===myKey?pres:o})}
      if(!out.some(p=>p.sameTab))out.push({peer:myKey,sameTab:true,isMe:true,presence:pres});return out};
    const emit=()=>{lastPeers=peers();fns.forEach(f=>{try{f({peers:lastPeers})}catch(e){}})};
    const flush=()=>{timer=null;last=Date.now();if(ch&&api.ok)Promise.resolve(ch.track(pres)).catch(()=>{})};
    const bflush=()=>{bt=null;blast=Date.now();if(ch&&api.ok&&bq){const m=bq;bq=null;Promise.resolve(ch.send({type:"broadcast",event:"g",payload:m})).catch(()=>{})}};
    const connect=()=>{
      if(left)return;
      const c=client.channel(name,{config:{presence:{key:myKey},broadcast:{self:false}}});ch=c;
      c.on("presence",{event:"sync"},()=>{if(ch===c)emit()});
      c.on("broadcast",{event:"g"},m=>{if(ch!==c)return;const p=m&&m.payload;if(!p||p.k===myKey)return;mfns.forEach(f=>{try{f(p)}catch(e){}})});
      c.subscribe(st=>{
        if(ch!==c)return;
        if(st==="SUBSCRIBED"){api.ok=true;api.downAt=0;flush();if(!done){done=true;res(api)}}
        else if(st==="CHANNEL_ERROR"||st==="TIMED_OUT"||st==="CLOSED"){
          api.ok=false;if(!api.downAt)api.downAt=Date.now();
          if(!done){done=true;rej({code:st});return}
          if(left)return;
          setTimeout(()=>{if(left||ch!==c)return;try{client.removeChannel(c)}catch(e){}connect()},1500);
        }});
    };
    const api={ok:false,downAt:0,
      presence:async(patch)=>{pres=Object.assign({},pres,patch);for(const k in patch)if(patch[k]===null)delete pres[k];
        if(!timer)timer=setTimeout(flush,Math.max(0,1200-(Date.now()-last)))},
      send:(payload)=>{bq=Object.assign({k:myKey},payload);if(!bt)bt=setTimeout(bflush,Math.max(0,300-(Date.now()-blast)))},
      onPeers:(f)=>{fns.push(f);setTimeout(()=>f({peers:peers()}),0);return()=>{fns=fns.filter(x=>x!==f)}},
      onMsg:(f)=>{mfns.push(f);return()=>{mfns=mfns.filter(x=>x!==f)}},
      leave:async()=>{if(bq&&api.ok){clearTimeout(bt);bflush()}left=true;const c=ch;try{await c.untrack()}catch(e){}try{client.removeChannel(c)}catch(e){}}
    };
    connect();
    setTimeout(()=>{if(!done){done=true;rej({code:"timeout"})}},10000);
  })};
}

const CLOUD={ok:false,user:null,busy:false,last:0,timer:null,err:""};
function sbClient(){
  if(!SB_URL||!SB_KEY||!window.supabase)return null;
  if(!window._sbc)window._sbc=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"implicit"},realtime:{params:{eventsPerSecond:10}}});
  return window._sbc;

function cloudSummary(d){d=d||{};const xp=d.xp||0;let lv=1,need=60,x=xp;while(x>=need){x-=need;lv++;need=Math.round(need*1.15)}
  return`Lv.${lv} / 🪙${d.coins||0} / アイテム${Object.keys(d.inv||{}).length}種 / ${(d.win&&(d.win.cpu+d.win.on))||0}勝`}
async function cloudInit(){
  const sb=sbClient();if(!sb)return;CLOUD.ok=true;
  try{const{data}=await sb.auth.getSession();CLOUD.user=data&&data.session?data.session.user:null}catch(e){}
  if(CLOUD.user)cloudOnLogin();
  sb.auth.onAuthStateChange((ev,session)=>{const was=CLOUD.user;CLOUD.user=session?session.user:null;
    if(ev==="SIGNED_IN"&&(!was||was.id!==CLOUD.user.id))cloudOnLogin();
    if(ev==="SIGNED_OUT")cloudRefreshUI()});
  if(location.hash.includes("access_token"))history.replaceState(null,"",location.pathname+location.search);

async function cloudLogin(){const sb=sbClient();if(!sb)return;
  try{await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+location.pathname}})}catch(e){toast("ログインできなかった")}}

async function cloudFetch(){
  const sb=sbClient();const{data,error}=await sb.from("saves").select("data,updated_at").eq("user_id",CLOUD.user.id).maybeSingle();
  if(error)throw error;return data;
}
async function cloudPush(){
  const sb=sbClient();if(!sb||!CLOUD.user||CLOUD.busy)return;CLOUD.busy=true;
  try{const now=new Date().toISOString();
    const{error}=await sb.from("saves").upsert({user_id:CLOUD.user.id,data:cloudData(),updated_at:now});
    if(error)throw error;CLOUD.last=Date.now();CLOUD.err="";REC._cloudAt=now;try{localStorage.setItem(KEY,JSON.stringify(REC))}catch(e){}
  }catch(e){CLOUD.err=(e&&e.message)||"保存エラー"}
  CLOUD.busy=false;cloudRefreshUI();
}
function cloudDirty(){if(!CLOUD.user||REC._cloudPending)return;clearTimeout(CLOUD.timer);CLOUD.timer=setTimeout(cloudPush,3000)}

async function cloudOnLogin(){

  m.querySelector("#cc_l").onclick=async()=>{REC._cloudPending=false;REC._cloudUid=uid;m.remove();await cloudPush();toast("☁️ この端末のデータで上書きした");navTo(NAV)};
}

/* ================= サウンド(Web Audioで合成。音声ファイルなし) ================= */
const SND={ctx:null,master:null,se:null,bgm:null};
function sndOn(k){return k==="se"?REC.se!==false:REC.bgm!==false}
function sndVol(){return typeof REC.vol==="number"?REC.vol:0.7}
function audioInit(){
  try{
    if(!SND.ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
      SND.ctx=new AC();SND.master=SND.ctx.createGain();SND.master.gain.value=sndVol();SND.master.connect(SND.ctx.destination);
      SND.se=SND.ctx.createGain();SND.se.gain.value=sndOn("se")?1:0;SND.se.connect(SND.master);
      SND.bgm=SND.ctx.createGain();SND.bgm.gain.value=sndOn("bgm")?0.55:0;SND.bgm.connect(SND.master)}
    if(SND.ctx.state==="suspended")SND.ctx.resume();
  }catch(e){}
}
["pointerdown","keydown","touchstart"].forEach(t=>document.addEventListener(t,audioInit,{capture:true,passive:true}));
function sndApply(){if(!SND.ctx)return;SND.master.gain.value=sndVol();SND.se.gain.value=sndOn("se")?1:0;SND.bgm.gain.value=sndOn("bgm")?0.55:0}
function tone(f,d,type,v,at,slide,dest){
  const c=SND.ctx;if(!c)return;const t=(at||c.currentTime);
  const o=c.createOscillator(),g=c.createGain();o.type=type||"square";o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||.15,t+.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(dest||SND.se);o.start(t);o.stop(t+d+.02);
}
let NOISE=null;
function noise(d,v,fq,at,dest,type){
  const c=SND.ctx;if(!c)return;const t=at||c.currentTime;
  if(!NOISE){NOISE=c.createBuffer(1,c.sampleRate,c.sampleRate);const a=NOISE.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}
  const s=c.createBufferSource();s.buffer=NOISE;const f=c.createBiquadFilter();f.type=type||"highpass";f.frequency.value=fq||3000;
  const g=c.createGain();g.gain.setValueAtTime(v||.1,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  s.connect(f);f.connect(g);g.connect(dest||SND.se);s.start(t);s.stop(t+d+.02);
}
const PENTA=[0,2,4,7,9,12,14,16,19,21,24,26,28,31,33,36];
const SE={
  key(k){if(!SND.ctx)return;if(k==="IN"){tone(880,.06,"square",.08);tone(1320,.08,"square",.07,SND.ctx.currentTime+.05)}
    else if(k==="AC"||k==="C")tone(420,.05,"square",.06);else{tone(1900,.025,"square",.035);noise(.02,.03,6000)}},
  ok(n){if(!SND.ctx)return;const t=SND.ctx.currentTime,b=523.25*Math.pow(2,PENTA[Math.min(n-1,15)]/12);
    tone(b,.09,"square",.11,t);tone(b*1.5,.14,"square",.1,t+.07);if(n>=3)tone(b*2,.18,"triangle",.09,t+.14)},
  ng(){if(!SND.ctx)return;tone(196,.22,"sawtooth",.12,0,110);tone(185,.22,"square",.05)},
  heal(){if(!SND.ctx)return;const t=SND.ctx.currentTime;[1047,1319,1568].forEach((f,i)=>tone(f,.12,"triangle",.06,t+i*.04))},
  atk(){if(!SND.ctx)return;noise(.45,.25,400,0,null,"bandpass");tone(110,.35,"sawtooth",.18,0,55);tone(880,.3,"square",.06,0,1760)},
  hit(){if(!SND.ctx)return;tone(90,.3,"sine",.35,0,40);noise(.2,.22,1200,0,null,"lowpass")},
  item(){if(!SND.ctx)return;const t=SND.ctx.currentTime;[1568,2093,2637].forEach((f,i)=>tone(f,.1,"square",.06,t+i*.06))},
  use(){if(!SND.ctx)return;tone(440,.25,"square",.08,0,1760)},
  block(){if(!SND.ctx)return;tone(2400,.08,"square",.06);tone(1200,.2,"triangle",.1,SND.ctx.currentTime+.05)},
  phase(){if(!SND.ctx)return;const t=SND.ctx.currentTime;for(let i=0;i<4;i++)tone(i%2?740:988,.12,"square",.08,t+i*.14)},
  count(n){if(!SND.ctx)return;n?tone(660,.12,"square",.1):tone(1320,.3,"square",.12)},
  win(){if(!SND.ctx)return;const t=SND.ctx.currentTime;[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,i===5?.5:.14,"square",.1,t+i*.12))},
  lose(){if(!SND.ctx)return;const t=SND.ctx.currentTime;[392,370,349,262].forEach((f,i)=>tone(f,i===3?.6:.22,"triangle",.12,t+i*.22))},
  clear(){if(!SND.ctx)return;const t=SND.ctx.currentTime;[784,988,1175,1568].forEach((f,i)=>tone(f,.16,"square",.09,t+i*.09))},
  egg(){if(!SND.ctx)return;const t=SND.ctx.currentTime;[1047,1319,1568,2093,1568].forEach((f,i)=>tone(f,.09,"square",.07,t+i*.09))},

/* --- BGM:小さなステップシーケンサー(対戦は四半期ごとにテンポアップ) --- */
const BGM={on:false,kind:"",step:0,next:0,timer:null,bpm:120,danger:false};
const N=(s)=>440*Math.pow(2,(s-69)/12);
const SONGS={
  vs:{bpm:124,bass:[45,45,41,41,48,48,43,43],chords:[[57,60,64],[53,57,60],[48,52,55],[55,59,62]],lead:[76,0,74,72,0,69,72,0,74,0,72,69,67,0,69,0]},
  solo:{bpm:108,bass:[48,48,45,45,41,41,43,43],chords:[[60,64,67],[57,60,64],[53,57,60],[55,59,62]],lead:[72,0,0,74,76,0,74,0,72,0,69,0,67,0,0,0]}
};
function bgmStart(kind){BGM.kind=kind;BGM.on=true;BGM.step=0;BGM.bpm=SONGS[kind].bpm;BGM.danger=false;if(!SND.ctx)return;BGM.next=SND.ctx.currentTime+.1;
  if(BGM.timer)clearInterval(BGM.timer);BGM.timer=setInterval(bgmSched,25)}
function bgmStop(){BGM.on=false;if(BGM.timer)clearInterval(BGM.timer);BGM.timer=null}
function bgmTempo(phase){if(BGM.kind==="vs")BGM.bpm=SONGS.vs.bpm+phase*10}
function bgmSched(){
  if(!BGM.on||!SND.ctx){return}
  const c=SND.ctx,S=SONGS[BGM.kind],d=SND.bgm,sp=60/BGM.bpm/4;
  if(BGM.next<c.currentTime-.5)BGM.next=c.currentTime+.05;
  while(BGM.next<c.currentTime+.12){
    const st=BGM.step,t=BGM.next,bar=Math.floor(st/16)%4,s16=st%16;
    if(s16%2===0)tone(N(S.bass[(bar*2+(s16>=8?1:0))%8]-12),sp*1.8,"triangle",.22,t,0,d);
    if(s16%4===0){tone(150,.12,"sine",.35,t,45,d)}
    if(s16%4===2||(BGM.danger&&s16%2===1))noise(.04,BGM.danger?.07:.05,7000,t,d);
    const ch=S.chords[bar],ar=ch[[0,1,2,1][s16%4]]+(s16>=8?12:0);
    if(BGM.kind==="vs"||s16%2===0)tone(N(ar),sp*.9,"square",.035,t,0,d);
    const l=S.lead[s16];if(l&&(bar%2===1||BGM.danger))tone(N(l+(BGM.danger?12:0)),sp*1.6,"square",.045,t,0,d);
    BGM.step++;BGM.next+=sp;
  }
}

  else{const cost=n===10?900:100;if(REC.coins<cost){toast("コインが足りないよ");return null}REC.coins-=cost}
  const out=[];
  for(let i=0;i<n;i++){
    let r=rollRar(n===10&&i===9&&!out.some(o=>o.r==="SR"||o.r==="UR"));
    REC.pity=r==="UR"?0:REC.pity+1;
    const pool=GITEMS.filter(g=>g.r===r),it=pool[Math.floor(Math.random()*pool.length)];
    const dup=(REC.inv[it.id]||0)>0;REC.inv[it.id]=(REC.inv[it.id]||0)+1;
    if(dup)REC.parts+=RAR[r].pt;
    out.push({...it,dup});
  }
  saveRec();return out;
}

async function doPull(n,pay){
  audioInit();

  const best=res.reduce((a,b)=>ri(b.r)>ri(a)?b.r:a,"N");

  else if(best==="SR"){if(Math.random()<.65)steps.push("R");steps.push("SR")}
  else if(best==="R"){if(Math.random()<.25)steps.push("N");steps.push("R")}

  const TAP=ms=>new Promise(r=>{if(skip)return r();tapR=r;setTimeout(()=>{if(tapR===r){tapR=null;r()}},ms)});
  ov.addEventListener("click",e=>{if(e.target.closest(".gskip,.gbtm2"))return;fire()});

  const burst=(r,cnt)=>{const sc=ov.querySelector(".gsc");if(!sc)return;
    const cols=r==="UR"?["#ff5d6c","#ffd23f","#39ff9a","#4da3ff","#b06cff","#fff"]:r==="SR"?["#ffd23f","#fff2a8","#ffb000","#fff"]:r==="R"?["#4da3ff","#9fd0ff","#fff"]:["#c9d3ef","#fff"];
    for(let i=0;i<cnt;i++){const p=document.createElement("i");p.className="gpt";const ang=Math.random()*Math.PI*2,d=120+Math.random()*(r==="UR"?320:220);
      p.style.cssText=`--x:${Math.cos(ang)*d}px;--y:${Math.sin(ang)*d}px;--c:${cols[i%cols.length]};--s:${4+Math.random()*10}px;--t:${.7+Math.random()*.8}s;--br:${Math.random()<.4?"2px":"50%"}`;

  ov.classList.add("res");
  const canAgain=pay==="ur"?REC.urt>=1:pay==="tix"?REC.tix>=n:REC.coins>=(n===10?900:100);
  const againLab=pay==="ur"?`🌟 もう一回<small>のこり${REC.urt}枚</small>`:pay==="tix"?`🎟️ もう一回<small>のこり${REC.tix}枚</small>`:`もう一回<small>🪙${n===10?900:100}</small>`;
  st.innerHTML=`<div class="gres2 n${n}">${res.map((it,i)=>`<div class="fc r-${it.r}" style="animation-delay:${i*(n===10?.05:0)}s"><div class="fi"><div class="fbk">簿</div>
     <div class="gcard ff c-${it.r}" style="--rc:${RAR[it.r].c}"><div class="rr">${it.r}</div>${miniCalc(it.id)}<b>${it.n}</b><small>${TLAB[it.t]}</small>${it.dup?`<em class="dup">かぶり 🔩+${RAR[it.r].pt}</em>`:`<em class="new">NEW!</em>`}</div></div></div>`).join("")}</div>
    <div class="gsum" id="gsum">${n===10?"タップでどんどんめくる":""}</div>
    <div class="gbtm2" id="gbt"><button class="big sec" id="gok">OK</button>${canAgain?`<button class="big gold" id="gag">${againLab}</button>`:""}</div>`;
  const cards=[...st.querySelectorAll(".fc")];
  let fast=false;const tapFast=()=>{fast=true};ov.addEventListener("click",tapFast);
  await W(n===10?600:350);
  for(let i=0;i<cards.length;i++){
    const c=cards[i],r=res[i].r;
    if(skip){c.classList.add("on");continue}
    if((r==="SR"||r==="UR")&&!fast){c.classList.add("pre");se("gshake");await W(r==="UR"?520:420)}
    c.classList.add("on");se("gflip",r);
    await W(fast?40:r==="UR"?380:r==="SR"?300:n===10?150:200);
  }
  ov.removeEventListener("click",tapFast);
  const cnt={};res.forEach(it=>cnt[it.r]=(cnt[it.r]||0)+1);
  const nw=res.filter(it=>!it.dup).length,pt=res.reduce((a,it)=>a+(it.dup?RAR[it.r].pt:0),0);
  st.querySelector("#gsum").innerHTML=`${["UR","SR","R","N"].filter(r=>cnt[r]).map(r=>`<span style="color:${rc(r)}">${r}×${cnt[r]}</span>`).join(" ・ ")}${nw?` ・ <b>NEW ${nw}</b>`:""}${pt?` ・ 🔩+${pt}`:""}`;
  const gb=st.querySelector("#gbt");gb.classList.add("on");ov.querySelector("#gskp").remove();
  st.querySelector("#gok").onclick=()=>{ov.remove();gachaScreen("gacha")};
  const ag=st.querySelector("#gag");if(ag)ag.onclick=()=>{ov.remove();gachaScreen("gacha");doPull(n,pay)};
}

const _keySE=SE.key;
SE.key=function(k){
  const s=REC.eq&&REC.eq.snd;if(!SND.ctx)return;
  if(!s||k==="IN")return _keySE(k);
  const d=/^\d$/.test(k)?+k:k==="00"?0:k==="."?10:["+","-","*","/","="].indexOf(k)>=0?11+["+","-","*","/","="].indexOf(k):16;
  const f=440*Math.pow(2,([0,2,4,5,7,9,11,12,14,16,17,19,21,23,24,26,28][d%17]-9)/12)*2;
  if(s==="s_xylo"){tone(f,.18,"sine",.14);tone(f*4,.05,"sine",.04)}
  else if(s==="s_type"){noise(.03,.18,1800);tone(140,.04,"square",.06)}
  else if(s==="s_8bit"){tone(f,.05,"square",.06);tone(f*1.5,.05,"square",.05,SND.ctx.currentTime+.04)}
  else if(s==="s_piano"){tone(f/2,.45,"triangle",.13);tone(f,.3,"sine",.05)}
  else _keySE(k);
};

const MISSIONS=[
 {id:"play",n:"ゲームを1回プレイする",goal:1,rw:50},
 {id:"chain",n:"対戦で5連鎖する",goal:5,rw:50},
 {id:"win",n:"対戦で1回勝つ",goal:1,rw:80},
 {id:"all",n:"デイリーミッションをすべて達成",goal:3,rw:100}
];
function msState(){
  const d=new Date().toDateString();
  if(!REC.ms||REC.ms.d!==d)REC.ms={d,play:0,chain:0,win:0,got:{}};
  REC.ms.all=["play","chain","win"].filter(k=>REC.ms[k]>=MISSIONS.find(m=>m.id===k).goal).length;
  return REC.ms;
}
function msAdd(k,v,max){const s=msState();s[k]=max?Math.max(s[k]||0,v):(s[k]||0)+v;msState();saveRec()}
function msClaimable(){const s=msState();return MISSIONS.filter(m=>s[m.id]>=m.goal&&!s.got[m.id]).length}
function lvInfo(){let xp=REC.xp||0,lv=1,need=60;while(xp>=need){xp-=need;lv++;need=Math.round(need*1.15)}return{lv,cur:xp,need}}
function addXp(n){REC.xp=(REC.xp||0)+n;saveRec()}

const NB=[
  {i:"🎟️",n:"ガチャ20連",k:"tix",v:20},
  {i:"🪙",n:"500コイン",k:"coins",v:500},
  {i:"🎟️",n:"ガチャ10連",k:"tix",v:10},
  {i:"🔩",n:"パーツ100",k:"parts",v:100},
  {i:"🪙",n:"1000コイン",k:"coins",v:1000},
  {i:"🎟️",n:"ガチャ10連",k:"tix",v:10},
  {i:"🌟",n:"UR確定ガチャ",k:"urt",v:1}
];
function nbToday(){return new Date().toDateString()}
function nbDone(){const b=REC.nb||{n:0};return b.n>=NB.length}
function nbReady(){const b=REC.nb||{n:0,last:""};return b.n<NB.length&&b.last!==nbToday()}
function nbModal(){
  gInit();const b=REC.nb,ready=nbReady();
  const cell=(r,i)=>`<div class="nbd d${i+1} ${i<b.n?"got":""} ${ready&&i===b.n?"today":""}"><small>${i+1}日目</small><span class="ni">${r.i}</span><b>${r.n}</b></div>`;
  const m=modal(`<div class="nbh">🎁 初心者ログインボーナス</div><div class="nbs">ログインした日ごとに1日分もらえるよ(7日間)</div>
    <div class="nbg">${NB.map(cell).join("")}</div>
    ${ready?`<button class="big gold" id="nbok">${b.n+1}日目を受け取る</button>`:`<button class="big sec" id="nbok">${nbDone()?"コンプリート!":"また明日ね"}</button>`}`);
  m.querySelector(".mbox").classList.add("nbbox");
  m.querySelector("#nbok").onclick=()=>{
    if(!nbReady()){m.remove();return}
    const r=NB[b.n];REC[r.k]=(REC[r.k]||0)+r.v;b.n++;b.last=nbToday();saveRec();
    audioInit();se("item");
    m.remove();
    const g=modal(`<div class="nbh">${r.i} ${r.n} ゲット!</div>
      <div class="nbs">${r.k==="tix"?`ガチャチケットは「ガチャ」画面で使えるよ(のこり ${REC.tix}枚)`:r.k==="urt"?"「ガチャ」画面でUR確定ガチャが引けるよ!":r.k==="parts"?"パーツはコレクション画面でほしいアイテムと交換できるよ":"ガチャやアイテム交換に使ってね"}</div>
      ${r.k==="tix"||r.k==="urt"?`<button class="big gold" id="nbg">🎰 さっそくガチャへ</button>`:""}<button class="big sec" id="nbc">とじる</button>`);
    g.querySelector(".mbox").classList.add("nbbox");
    const go=g.querySelector("#nbg");if(go)go.onclick=()=>{g.remove();navTo("gacha")};
    g.querySelector("#nbc").onclick=()=>{g.remove();if(NAV==="home")homeScreen()};
  };
}

async function resetAll(){
  const keep={};if(CLOUD.user)keep._cloudUid=CLOUD.user.id;

  if(CLOUD.user){clearTimeout(CLOUD.timer);await cloudPush()}

function calcKey0(k){

    if(C.fresh){C.disp=k==="00"?"0":k;C.fresh=false}
    else{const digits=C.disp.replace(/[-.]/g,"").length;if(digits>=12)return;C.disp=C.disp==="0"?(k==="00"?"0":k):C.disp+k}
  }else if(k==="."){if(C.fresh){C.disp="0.";C.fresh=false}else if(!C.disp.includes("."))C.disp+="."}
  else if("+-*/".includes(k)){
    if(C.lastKey===k&&C.op===k&&C.fresh){/* 同じ演算キー2回 → 定数計算(K) */C.k={op:k,a:C.acc};C.op=null;C.acc=null;C.fresh=true}
    else{C.k=null;if(C.op&&!C.fresh)setNum(apply(C.acc,C.op,cur()));C.acc=cur();C.op=k;C.fresh=true}}

  else if(k==="TXOUT"){if(C.op&&!C.fresh)finish_eq();setNum(Math.round(cur()/1.1));C.fresh=true}
  else if(k==="NOP"){toast("このキーはゲームでは使わないよ")}
  else if(k==="CA"){C.disp="0";C.acc=null;C.op=null;C.fresh=true;C.lastOp=null;C.lastArg=null;C.err=false;C.k=null;C.mem=0;C.gt=0}
  else if(k==="%"){if(C.op){const a=C.acc,b=cur();let r;
      if(C.op==="*")r=a*b/100;else if(C.op==="/")r=a/b*100;else if(C.op==="+")r=a+a*b/100;else r=a-a*b/100;
      setNum(r);C.acc=null;C.op=null;C.fresh=true}}

  else if(k==="NEG"){if(C.disp!=="0")C.disp=C.disp.startsWith("-")?C.disp.slice(1):"-"+C.disp}
  else if(k==="BS"){if(!C.fresh){C.disp=C.disp.slice(0,-1);if(C.disp===""||C.disp==="-")C.disp="0"}}
  else if(k==="C"){C.disp="0";C.fresh=true;C.err=false}

    const seq=C.hist.join(",")==="1,3,7,9,AC",held=["1","3","7","9"].every(x=>HELD.has(x));

/* ================= 検算ガイド ================= */
const KLAB={"*":"×","/":"÷","-":"−","NEG":"+/−","IN":"入力","M-":"M−","BS":"▶"};
function guideKeys(seq){const out=[];seq.concat(["IN"]).forEach((t,ti)=>{if(typeof t==="number"){String(t).split("").forEach(ch=>out.push({k:ch,t:ti}))}else out.push({k:t,t:ti})});return out}
function guideOn(){return !!(G&&P&&!P.locked&&G.fx&&((G.fx.guideUntil&&now()<G.fx.guideUntil)||G.fx.auto===P.active))}
function guideTimed(){return G.fx.guideUntil&&now()<G.fx.guideUntil}
function guideTrack(k){
  if(!guideOn())return;
  const bl=P.blanks[P.active];if(bl.t!=="num"||!bl.g)return;
  const gs=G.fx.gstep;if(gs.b!==P.active){gs.b=P.active;gs.s=0;gs.off=false}
  if(k==="CA")k="AC";
  const keys=guideKeys(bl.g),exp=keys[gs.s];
  if(exp&&k===exp.k&&!gs.off){gs.s++;if(k==="IN"){gs.b=-1}}
  else if(k==="00"&&exp&&exp.k==="0"&&keys[gs.s+1]&&keys[gs.s+1].k==="0"&&keys[gs.s+1].t===exp.t&&!gs.off){gs.s+=2}
  else if(k==="AC"){const i=keys.findIndex(x=>x.k==="AC");gs.s=i+1;gs.off=false}
  else if(k==="MC"&&keys[0].k==="MC"){gs.s=1;gs.off=false}
  else gs.off=true;
}
function paintGuide(){
  const box=$("#guide");if(!box)return;
  app.querySelectorAll(".ck.hint").forEach(x=>x.classList.remove("hint"));
  if(!guideOn()){box.style.display="none";return}
  box.style.display="block";
  const left=guideTimed()?Math.ceil((G.fx.guideUntil-now())/1000)+"s":"自動";
  const bl=P.blanks[P.active];
  if(bl.t!=="num"||!bl.g){box.innerHTML=`<div class="gh">🧮 検算ガイド <span>${left}</span></div><div class="gt">この欄は選択式(ガイドなし)</div>`;return}
  const gs=G.fx.gstep;if(gs.b!==P.active){gs.b=P.active;gs.s=0;gs.off=false}
  const keys=guideKeys(bl.g),seq=bl.g.concat(["IN"]);
  const curT=gs.off?-1:(keys[gs.s]?keys[gs.s].t:seq.length);
  box.innerHTML=`<div class="gh">🧮 ${guideTimed()?"検算ガイド":"お助けガイド"} <span>${left}</span></div><div class="gt">${seq.map((t,i)=>`<span class="${i<curT?"dn":i===curT?"cu":""}">${typeof t==="number"?yen(t):(KLAB[t]||t)}</span>`).join("")}</div>${gs.off?`<div class="goff">ずれたよ → AC から打ち直し</div>`:""}`;

function cpuSchedule(){const L=CPU_LV[G.lv],p=makeProblem(G.base,CPU.qi);CPU.n=p.blanks.length;CPU.next=now()+(L.read+CPU.n*L.spd)*(0.75+Math.random()*.5)*1000}
function cpuStep(){
  if(!G||G.mode!=="cpu"||G.ended||!G.running)return;

  if(CPU.typo){const k=res.indexOf(true);if(k>=0)res[k]=false;CPU.typo=false}

  G.oppStreak=CPU.streak;

   <div style="color:var(--mute);font-weight:800;margin-bottom:6px">vs ${esc(g.oppName)}${why?` ・ ${why}`:""}</div>
   <div class="stats">
    <div class="st"><span>回復した量</span><b>${g.healed}</b></div><div class="st"><span>生き残った時間</span><b>${fmtT(g.elapsed)}</b></div>
    <div class="st"><span>最大連鎖</span><b>${g.maxStreak}</b></div><div class="st"><span>正答率(欄)</span><b>${acc}%</b></div>
    <div class="st"><span>解いた問題</span><b>${Math.max(0,g.qi-(P&&!P.locked?1:0))}題</b></div><div class="st"><span>到達</span><b style="font-size:15px">${PHASE[g.phase]}</b></div>
   </div>
   <button class="big" id="again" style="margin-bottom:10px">${g.mode==="cpu"?"🔁 もう一回":"🔁 ロビーに戻って再戦"}</button>
   <button class="big sec" id="home">対戦メニューへ</button></div>`;
  $("#again").onclick=()=>{if(g.mode==="cpu")startBattle("cpu",{lv:g.lv,seed:newCode()+":"+Date.now(),oppName:CPU_LV[g.lv].n});else backToLobby()};
  $("#home").onclick=()=>{G=null;vsMenu()};
  window.scrollTo(0,0);
}

/* ================= オンライン対戦 =================
   bc=true(Supabase): presence は {nm,st,rd,ra,gid,ff} だけ、対戦中の状態は broadcast。
   bc=false(roomのみ): 従来どおり presence に全部のせる。 */
const NET={nr:null,code:"",name:"",opp:null,unsub:null,munsub:null,pres:{},screen:"",bc:false,gs:{},msgAt:0,missAt:0};
function leaveNet(){
  if(NET.nr){try{NET.unsub&&NET.unsub()}catch(e){}try{NET.munsub&&NET.munsub()}catch(e){}NET.nr.leave().catch(()=>{});}
  NET.nr=null;NET.opp=null;NET.unsub=null;NET.munsub=null;NET.screen="";NET.missAt=0;
}
function setPres(patch){Object.assign(NET.pres,patch);if(NET.nr)NET.nr.presence(patch).catch(()=>{})}
function netGame(patch){
  if(!NET.nr)return;
  if(NET.bc){NET.gs=Object.assign({},NET.gs,patch);NET.nr.send(NET.gs)}else setPres(patch);
}
async function lobby(code,name){
  stopCpu();leaveNet();
  NET.code=code;NET.name=name;
  app.innerHTML=`<div class="title"><button class="back" id="bk">← もどる</button><div class="lobby"><div class="lc">部屋 <b class="mono">${esc(code)}</b></div><div class="ls">接続中…</div></div></div>`;
  $("#bk").onclick=()=>{leaveNet();vsMenu()};
  if(!ROOM){await new Promise(r=>setTimeout(r,1500))}
  if(!ROOM){
    app.querySelector(".ls").innerHTML=`オンライン対戦につながらなかったよ。<br>(公開版:index.html の SB_URL / SB_KEY が未設定か、通信がブロックされています)<br>CPU対戦・タイムアタック・スコアアタックは遊べるよ。<br><br><button class="big sec" id="tocpu">CPU対戦で遊ぶ</button>`;
    $("#tocpu").onclick=vsMenu;return;
  }
  try{NET.nr=await ROOM.join("bb-"+code)}catch(e){
    app.querySelector(".ls").innerHTML=`部屋に入れなかった(${esc(e&&e.code||"error")})。少し待ってもう一度ためしてね。`;return}
  NET.bc=typeof NET.nr.send==="function"&&typeof NET.nr.onMsg==="function";
  NET.pres=NET.bc?{nm:name,st:"lobby",rd:false,ra:0,gid:0,ff:0}
                 :{nm:name,st:"lobby",rd:false,ra:0,gid:0,hp:HP0,dead:false,at:[],bl:[],sk:0,ff:0};
  NET.nr.presence(NET.pres).catch(()=>{});
  NET.unsub=NET.nr.onPeers(ch=>netPeers(ch.peers));
  if(NET.bc)NET.munsub=NET.nr.onMsg(netMsg);
  NET.screen="lobby";renderLobby();
}
function renderLobby(){
  if(NET.screen!=="lobby")return;
  const o=NET.opp,op=o&&o.presence||{};
  const me=NET.pres;
  app.innerHTML=`<div class="title"><button class="back" id="bk">← もどる</button>
   <div class="lobby">
    <div class="lc">部屋 <b class="mono">${esc(NET.code)}</b></div>
    <div class="pl"><div class="pc ${me.rd?"rd":""}"><b>${esc(me.nm)}</b><small>あなた</small><span>${me.rd?"準備OK":"待機中"}</span></div>
     <div class="vsx">VS</div>
     <div class="pc ${op.rd?"rd":""}">${o?`<b>${esc(op.nm||"?")}</b><small>相手</small><span>${op.st==="play"?"対戦中…":op.rd?"準備OK":"待機中"}</span>`:`<b>…</b><small>相手を待っています</small><span>同じ部屋コードで入室してもらってね</span>`}</div></div>
    <button class="big ${me.rd?"sec":""}" id="rdy" ${o?"":"disabled"}>${me.rd?"準備OKを取り消す":"準備OK!"}</button>
    <div class="ls" style="margin-top:12px">2人とも「準備OK」で対戦スタート</div>
   </div></div>`;
  $("#bk").onclick=()=>{leaveNet();vsMenu()};
  $("#rdy").onclick=()=>{setPres(me.rd?{rd:false}:{rd:true,ra:Date.now()});renderLobby();checkStart()};
}
function netPeers(peers){
  if(!NET.nr)return;
  const others=peers.filter(p=>!p.sameTab&&p.presence&&typeof p.presence.nm==="string").sort((a,b)=>a.peer<b.peer?-1:1);
  const prev=NET.opp;
  NET.opp=others.find(p=>prev&&p.peer===prev.peer)||others[0]||null;
  if(NET.screen==="lobby"){renderLobby();checkStart();return}
  if(G&&G.mode==="online"&&!G.ended){
    const o=NET.opp;
    if(!o){if(!NET.missAt)NET.missAt=Date.now();return}
    NET.missAt=0;
    const op=o.presence;
    if(op.ff&&op.ff===G.gid){endBattle(true,"相手が降参した");return}
    if(!NET.bc)netApply(op);
  }
}
function netMsg(p){
  if(!G||G.mode!=="online"||G.ended||!p)return;
  if(p.gid!==G.gid)return;
  NET.msgAt=Date.now();NET.missAt=0;
  netApply(p);
}
function netApply(op){
  if(op.ff&&op.ff===G.gid){endBattle(true,"相手が降参した");return}
  if(op.gid!==G.gid)return;
  if(typeof op.hp==="number")G.oppPub={hp:op.hp,at:now()};
  if(op.dead){endBattle(true,"相手の体力が0になった");return}
  const nsk=Number(op.sk)||0;if(nsk>(G.oppStreak||0))oppChainFx((G.oppStreak||0)+1,nsk);G.oppStreak=nsk;
  (Array.isArray(op.at)?op.at:[]).forEach(a=>{if(a&&typeof a.id==="string"&&!G.seen.has(a.id)){G.seen.add(a.id);receiveAttack(a.t,a.id,a.n)}});
  const mine=new Set(G.myAtks.map(a=>a.id));
  (Array.isArray(op.bl)?op.bl:[]).forEach(id=>{if(mine.has(id)&&!G.seenBl.has(id)){G.seenBl.add(id);banner("相手の🛡️内部統制にブロックされた…","info")}});
  paintHP();
}
/* 退出判定:自分の接続が生きていて、相手が部屋から消えたまま10秒、かつ相手からの通信も10秒ない時だけ */
function netWatch(){
  if(!G||G.mode!=="online"||G.ended||!NET.nr)return;
  const t=Date.now();
  if(NET.nr.ok===false){NET.missAt=0;return}
  if(NET.opp||!NET.missAt)return;
  if(t-NET.missAt>=10000&&t-(NET.msgAt||0)>=10000)endBattle(true,"相手が退出した");
}
function checkStart(){
  const o=NET.opp;if(!o||NET.screen!=="lobby")return;
  const op=o.presence,me=NET.pres;
  const gid0=Math.max(Number(me.ra)||0,Number(op.ra)||0);
  /* 相手が先に始めた(準備OK→対戦中が同時に届いた)場合も一緒に始める */
  if(me.rd&&me.st==="lobby"&&((op.rd&&op.st==="lobby")||(op.st==="play"&&op.gid===gid0&&gid0>0))){
    const gid=gid0;
    NET.screen="play";NET.missAt=0;NET.msgAt=0;
    if(NET.bc){setPres({st:"play",rd:false,gid,ff:0});NET.gs={gid,hp:HP0,dead:false,at:[],bl:[],sk:0}}
    else setPres({st:"play",rd:false,gid,hp:HP0,dead:false,at:[],bl:[],sk:0,ff:0});
    startBattle("online",{seed:NET.code+":"+gid,gid,myName:me.nm,oppName:op.nm||"相手"});
  }
}
function netPub(){
  if(!G||G.mode!=="online")return;
  G.lastPub=now();
  if(!NET.bc)setPres({st:G.ended?"end":"play"});
  netGame({gid:G.gid,hp:Math.max(0,Math.round(G.hp*10)/10),dead:G.hp<=0,at:G.myAtks.slice(-8),bl:G.blocked.slice(-8),sk:G.streak});
}
function netForfeit(){if(NET.nr&&G){if(NET.bc)netGame({gid:G.gid,ff:G.gid});setPres({st:"lobby",rd:false,ff:G.gid});NET.screen="";const nr=NET.nr;NET.nr=null;
  try{NET.unsub&&NET.unsub()}catch(e){}try{NET.munsub&&NET.munsub()}catch(e){}NET.opp=null;NET.unsub=null;NET.munsub=null;
  setTimeout(()=>nr.leave().catch(()=>{}),700)}}
function backToLobby(){G=null;setPres({st:"lobby",rd:false,ff:0});NET.screen="lobby";renderLobby()}

titleScreen();
cloudInit().then(()=>{if(ONTITLE)titleCloud();else if(CLOUD.user)navTo(NAV);else cloudRefreshUI()});

</script>
